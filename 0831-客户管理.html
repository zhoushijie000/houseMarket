    .brand-agency { margin-left: 20px; color: var(--regular); white-space: nowrap; }

    .nav-item { height: 100%; position: relative; color: #262626; white-space: nowrap; }
    .nav-trigger { height: 100%; padding: 0 15px; display: flex; align-items: center; gap: 10px; color: inherit; background: transparent; border: 0; font-size: 15px; }

    .nav-item:not([data-nav-menu]) .nav-primary-link { padding: 0 15px; }
    .nav-menu-toggle { width: 28px; padding: 0 10px 0 0; }
    .nav-primary-link:hover, .nav-item.open > .nav-primary-link { color: var(--primary); background: #f7f9fd; }
    .nav-item.active > .nav-primary-link { color: var(--primary); font-weight: 600; }
    .nav-trigger:hover, .nav-item.open .nav-trigger { background: #f7f9fd; }
    .nav-item.active .nav-trigger { color: var(--primary); }
    .nav-item.open .nav-trigger .chevron { transform: rotate(225deg) translate(-1px, -1px); }
    .nav-menu { width: 212px; padding: 10px 0; position: absolute; top: calc(100% + 1px); left: 50%; z-index: 70; display: none; transform: translateX(-50%); background: #fff; border: 1px solid #edf0f5; border-radius: 4px; box-shadow: 0 8px 24px rgba(31, 41, 61, .14); }
    .nav-item.open .nav-menu { display: block; }
    .nav-menu-link { width: 100%; height: 46px; padding: 0 20px; display: flex; align-items: center; color: #30343a; background: transparent; border: 0; text-align: left; text-decoration: none; font-size: 15px; }

    .nav-menu-link.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
    .chevron { width: 7px; height: 7px; display: inline-block; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); }
    .user { height: 56px; margin-left: 34px; flex-direction: column; justify-content: center; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; position: relative; background: #e4e7ed; }

        dynamics: [['预约看房', '预约“锦江金茂府”周末线下看房', '2026-08-28 16:32'], ['楼盘对比', '对比锦江区3个改善项目', '2026-08-28 15:55']],
        records: [['电话', '确定周六上午看房，关注学校与通勤', '陈顾问', '2026-08-28 16:32'], ['企微', '发送项目区位与教育配套资料', '陈顾问', '2026-08-27 09:48']] },
      { id: 5, name: '一米阳光', phone: '17780651209', tags: ['刚需', '待跟进'], event: '直播互动｜咨询首付及月供', eventTime: '2026-08-27 20:18', count: 3,
        dynamics: [['直播互动', '在“成都刚需购房课堂”中咨询首付', '2026-08-27 20:18'], ['查看回放', '观看网签流程直播回放46分钟', '2026-08-26 22:02']],
        records: [['直播回访', '回访直播提问，确认预算约160万元', '刘顾问', '2026-08-28 09:35']] },
      { id: 6, name: '西岭归客', phone: '18190764532', tags: ['改善型', '已联系'], event: '企微沟通｜发送青羊区改善项目资料', eventTime: '2026-08-26 11:56', count: 6,
        dynamics: [['收藏楼盘', '收藏“青羊樾府”项目', '2026-08-26 11:42'], ['地图找房', '筛选青羊区地铁沿线项目', '2026-08-25 18:36']],
        records: [['企微', '发送青羊区改善项目对比表', '周顾问', '2026-08-26 11:56'], ['电话', '沟通现有住房置换计划', '周顾问', '2026-08-24 10:05']] }
    ];
    let query = { name: '', phone: '', tag: '' };
    let toastTimer;

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function maskPhone(phone) { return `${phone.slice(0, 3)}****${phone.slice(7)}`; }

    function tagClass(tag) {
      if (['高意向', '待跟进'].includes(tag)) return 'orange';
      if (['已联系', '改善型'].includes(tag)) return 'green';
      return '';
    }

    function filteredCustomers() {
      return customers.filter(customer => {
        const nameMatch = !query.name || customer.name.includes(query.name);
        const phoneMatch = !query.phone || customer.phone.includes(query.phone);
        const tagMatch = !query.tag || customer.tags.includes(query.tag);
        return nameMatch && phoneMatch && tagMatch;
      });
    }

    function renderCustomers() {
      const rows = filteredCustomers();
      $('#customerTableBody').innerHTML = rows.length ? rows.map((customer, index) => `
        <tr>
          <td class="col-index">${index + 1}</td>
          <td><span class="customer-name">${escapeHTML(customer.name)}</span></td>
          <td><span class="phone-value">${maskPhone(customer.phone)}</span></td>
          <td><div class="tag-list">${customer.tags.map(tag => `<span class="customer-tag ${tagClass(tag)}">${escapeHTML(tag)}</span>`).join('')}</div></td>
          <td><div class="event-name">${escapeHTML(customer.event)}</div><div class="event-time">${escapeHTML(customer.eventTime)}</div></td>
          <td class="col-count"><span class="contact-count">${customer.count}</span> 次</td>
          <td class="col-action"><button class="table-action" type="button" data-dynamic="${customer.id}">查看客户动态</button><button class="table-action" type="button" data-records="${customer.id}">联系记录</button></td>
        </tr>`).join('') : '<tr><td class="empty" colspan="7">暂无符合条件的客户</td></tr>';
      $('#totalText').textContent = `共 ${rows.length} 条`;
    }

    function summaryHTML(customer) {
      return `<div class="customer-summary"><div><div class="summary-label">客户昵称</div><div class="summary-value">${escapeHTML(customer.name)}</div></div><div><div class="summary-label">客户手机号</div><div class="summary-value phone-value">${maskPhone(customer.phone)}</div></div><div><div class="summary-label">客户标签</div><div class="summary-value"><div class="tag-list">${customer.tags.map(tag => `<span class="customer-tag ${tagClass(tag)}">${escapeHTML(tag)}</span>`).join('')}</div></div></div></div>`;
    }

    function openDynamics(customer) {
      $('#detailTitle').textContent = '查看客户动态';
      $('#detailBody').innerHTML = summaryHTML(customer) + `<div class="timeline">${customer.dynamics.map(item => `<div class="timeline-item"><span class="timeline-dot"></span><div class="timeline-title">${escapeHTML(item[0])}</div><div class="timeline-copy">${escapeHTML(item[1])}</div><div class="timeline-time">${escapeHTML(item[2])}</div></div>`).join('')}</div>`;
      openDialog();
    }

    function openRecords(customer) {
      $('#detailTitle').textContent = '联系记录';
      const rows = customer.records.map(item => `<tr><td>${escapeHTML(item[0])}</td><td>${escapeHTML(item[1])}</td><td>${escapeHTML(item[2])}</td><td>${escapeHTML(item[3])}</td></tr>`).join('');
      $('#detailBody').innerHTML = summaryHTML(customer) + `<div class="record-table"><table><thead><tr><th style="width:100px">联系渠道</th><th>联系内容</th><th style="width:100px">跟进人</th><th style="width:170px">联系时间</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">暂无联系记录</td></tr>'}</tbody></table></div>`;
      openDialog();
    }

    function openDialog() {
      $('#detailOverlay').classList.add('show');
      $('#detailOverlay').setAttribute('aria-hidden', 'false');
    }

    function closeDialog() {
      $('#detailOverlay').classList.remove('show');
      $('#detailOverlay').setAttribute('aria-hidden', 'true');
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      $('#toast').textContent = message;
      $('#toast').classList.add('show');
      toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 1800);
    }

    function closeHeaderMenus() {
      $$('[data-nav-menu]').forEach(item => {
        item.classList.remove('open');
        item.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'false');
      });
    }

    $('#searchButton').addEventListener('click', () => {
      query = { name: $('#nameFilter').value.trim(), phone: $('#phoneFilter').value.trim(), tag: $('#tagFilter').value };
      renderCustomers();
    });
    $('#resetButton').addEventListener('click', () => {
      $('#nameFilter').value = ''; $('#phoneFilter').value = ''; $('#tagFilter').value = '';
      query = { name: '', phone: '', tag: '' };
      renderCustomers();
    });
    $('#phoneFilter').addEventListener('input', event => { event.target.value = event.target.value.replace(/\D/g, '').slice(0, 11); });
    $('#customerTableBody').addEventListener('click', event => {
      const dynamicButton = event.target.closest('[data-dynamic]');
      const recordButton = event.target.closest('[data-records]');
      if (dynamicButton) openDynamics(customers.find(item => item.id === Number(dynamicButton.dataset.dynamic)));
      if (recordButton) openRecords(customers.find(item => item.id === Number(recordButton.dataset.records)));
    });
    $('#closeDialog').addEventListener('click', closeDialog);
    $('#confirmDialog').addEventListener('click', closeDialog);
    $('#detailOverlay').addEventListener('mousedown', event => { if (event.target === $('#detailOverlay')) closeDialog(); });

    $('#headerNav').addEventListener('click', event => {
      const menuTrigger = event.target.closest('[data-nav-menu] > .nav-trigger');
      if (menuTrigger) {
        const menu = menuTrigger.parentElement;
        const willOpen = !menu.classList.contains('open');
        closeHeaderMenus();
        menu.classList.toggle('open', willOpen);
        menuTrigger.setAttribute('aria-expanded', String(willOpen));
        event.stopPropagation();
        return;
      }
      const customerMenu = event.target.closest('[data-customer-menu]');
      if (customerMenu) { closeHeaderMenus(); showToast(`已选择${customerMenu.dataset.customerMenu}`); return; }
      const placeholder = event.target.closest('[data-placeholder-menu]');
      if (placeholder) { closeHeaderMenus(); showToast(`“${placeholder.textContent.trim()}”未纳入本次原型`); }
    });
    document.addEventListener('click', event => { if (!event.target.closest('#headerNav')) closeHeaderMenus(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { if ($('#detailOverlay').classList.contains('show')) closeDialog(); else closeHeaderMenus(); } });

    renderCustomers();
  </script>
</body>
</html>
