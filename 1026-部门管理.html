<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>部门管理 - 无纸化运营平台</title><style>
*{box-sizing:border-box}body{margin:0;color:#606266;font:14px 'Microsoft YaHei',Arial,sans-serif;background:white}button,input,select{font:inherit}button{cursor:pointer}aside{width:216px;position:fixed;inset:0 auto 0 0;background:#304156;color:#bfcbd9;overflow:auto}.brand{white-space:nowrap;height:64px;color:white;font-size:18px;font-weight:600;display:flex;align-items:center;padding:0 20px;gap:10px}.brand svg{width:26px;height:26px;flex-shrink:0}.nav{height:60px;display:flex;align-items:center;padding:0 22px;gap:18px;font-size:16px}.nav svg{width:18px;height:18px}.sub{background:#1f2d3d;padding-left:42px;height:54px}.active{color:#409eff}main{margin-left:216px;min-width:850px}header{height:62px;display:flex;align-items:center;padding:0 22px;gap:26px;box-shadow:0 1px 5px #ddd}.crumb{color:#a7b1c2}.crumb b{color:#606266;font-weight:400}.tools{margin-left:auto;display:flex;gap:22px;font-size:22px}.tabs{height:38px;box-shadow:0 2px 3px #ddd;display:flex;gap:5px;align-items:center;padding-left:17px}.tab{border:1px solid #d8dce5;padding:5px 9px;color:#8893a5}.tab.selected{background:#409eff;color:white;border-color:#409eff}.content{padding:22px}.filters{display:flex;align-items:center;gap:10px;margin-bottom:20px}.filters label{font-weight:bold;margin-right:3px}.filters input,.filters select{height:36px;width:225px;padding:0 15px;border:1px solid #dcdfe6;border-radius:4px;background:white;color:#606266}.filters input::placeholder{color:#c0c4cc}.filters select{margin-right:2px}.btn{border:1px solid #dcdfe6;background:white;color:#606266;border-radius:3px;height:32px;padding:0 16px}.primary{background:#1890ff;color:white;border-color:#1890ff}.pale{color:#409eff;background:#ecf5ff;border-color:#b3d8ff}.toolbar{display:flex;gap:10px;margin-bottom:9px}.toolbar .right{margin-left:auto}.round{border-radius:50%;width:32px;padding:0;color:#909399}table{width:100%;border-collapse:collapse;table-layout:fixed}th{height:44px;background:#f8f8f9;text-align:left;font-weight:bold;color:#515a6e}td{height:68px;border-bottom:1px solid #e6ebf5;line-height:25px}th,td{padding:10px}th:nth-child(1){width:29%}th:nth-child(2){width:8%}th:nth-child(3){width:8%}th:nth-child(4){width:22%}th:nth-child(5){width:16%;text-align:center}th:nth-child(6){width:17%;text-align:center}td:nth-child(5),td:nth-child(6){text-align:center}tbody tr:hover{background:#f5f7fa}.dept{padding-left:49px}.root{padding-left:16px}.chevron{border:0;background:none;color:#909399;padding:0 9px 0 0}.actions{white-space:nowrap}.link{border:0;background:none;color:#409eff;padding:0 5px;font-size:14px}.switch{width:40px;height:20px;border:0;border-radius:12px;padding:0;background:#c0c4cc;position:relative;vertical-align:middle;transition:background .15s}.switch:after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:white;left:2px;top:2px;transition:transform .15s}.switch[aria-checked=true]{background:#409eff}.switch[aria-checked=true]:after{transform:translateX(20px)}.switch:focus-visible{outline:3px solid #a6d2ff;outline-offset:3px}.state{display:inline-block;margin-left:10px;vertical-align:middle;width:28px;color:#909399}.on{color:#409eff}.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#f0f9eb;color:#67c23a;border:1px solid #e1f3d8;border-radius:4px;box-shadow:0 4px 15px #0001;display:none;z-index:5}.empty{text-align:center;height:100px}dialog{border:1px solid #ebeef5;border-radius:5px;padding:25px;width:450px;color:#606266}dialog::backdrop{background:#0005}dialog input{width:100%;height:36px;border:1px solid #dcdfe6;margin:20px 0;padding:8px}.dialog-actions{text-align:right}
</style></head><body><aside><div class="brand"><svg viewBox="0 0 32 32"><path fill="#edf3f9" stroke="#b7c9da" d="M2 13 16 4 30 13 16 23Z"/><path fill="#a8bacb" d="M2 13v6l14 9v-5Z"/><path fill="#409eff" d="m16 23 14-10v7l-14 8Z"/></svg>无纸化运营平台</div><div id="navigation"></div></aside><main><header><span style="font-size:23px">☰</span><div class="crumb"><b>首页</b>　/　系统管理　/　部门管理</div><div class="tools"><span>⌕</span><span>⛶</span><span>Ｔ</span><span style="color:#409eff">●</span></div></header><div class="tabs"><span class="tab">首页</span><span class="tab">企业管理 ×</span><span class="tab selected">● 部门管理 ×</span></div><section class="content"><form class="filters" id="filters"><label for="keyword">部门名称</label><input id="keyword" placeholder="请输入部门名称"><label for="status">状态</label><select id="status"><option value="">部门状态</option><option value="正常">正常</option><option value="停用">停用</option></select><button class="btn primary">⌕ 搜索</button><button class="btn" type="reset">⟳ 重置</button></form><div class="toolbar"><button class="btn pale" id="add">＋ 新增</button><button class="btn" id="collapse">⇵ 展开/折叠</button><button class="btn round right" id="searchToggle" aria-label="显示或隐藏搜索">⌕</button><button class="btn round" id="refresh" aria-label="刷新">⟳</button></div><table><thead><tr><th>部门名称</th><th>排序</th><th>状态</th><th>创建时间</th><th>是否允许创建合同</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main><div class="toast" role="status" id="toast"></div><dialog id="editor"><form method="dialog" id="editForm"><strong id="dialogTitle">新增部门</strong><input id="deptName" aria-label="部门名称" required placeholder="请输入部门名称"><div class="dialog-actions"><button class="btn" type="button" id="cancel">取消</button> <button class="btn primary">确定</button></div></form></dialog><script>
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>';
document.querySelector('#navigation').innerHTML=['首页','系统管理','用户管理','菜单管理','角色管理','部门管理','接口管理','字典管理','合同类型','通知公告','系统监控','日志管理','认证管理','合同管理','数据统计','材料证照'].map((x,i)=>'<div class="nav '+(i>1&&i<10?'sub ':'')+(x==='部门管理'?'active':'')+'">'+icon+x+'</div>').join('');
const prefix='中国农业银行股份有限公司';let departments=['四川省分行','成都双流支行','都江堰市支行','成都新津支行','成都西区支行','彭州市支行','简阳政府街支行','金堂县支行','成都青白江支行','成都锦江支行','简阳市支行','温江光华大道支行'].map((name,id)=>({id,name:prefix+name,date:id===0||id===9?'2024-05-09':id===1?'2025-03-13':id===6?'2025-12-23':id===11?'2025-01-14':'2024-07-31'}));
let permissions={};try{permissions=JSON.parse(localStorage.getItem('department-contract-permissions')||'{}')||{}}catch{}let collapsed=false,query='',filterStatus='',editing=null,timer;
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',2200)}
function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelector('#rows').innerHTML=departments.filter(d=>(!collapsed||d.id===0)&&d.name.includes(query)&&filterStatus!=='停用').map(d=>{const on=permissions[d.id]!==false;return '<tr><td class="'+(d.id===0?'root':'dept')+'">'+(d.id===0?'<button class="chevron" aria-label="展开或折叠部门">'+(collapsed?'›':'⌄')+'</button>':'')+escapeText(d.name)+'</td><td>0</td><td></td><td>'+d.date+' 00:00:00</td><td><button class="switch" role="switch" aria-label="'+escapeText(d.name)+'是否允许创建合同" aria-checked="'+on+'" data-toggle="'+d.id+'"></button><span class="state '+(on?'on':'')+'">'+(on?'允许':'禁止')+'</span></td><td class="actions"><button class="link" data-edit="'+d.id+'">♢修改</button><button class="link" data-add="'+d.id+'">＋新增</button>'+(d.id?'<button class="link" data-delete="'+d.id+'">♧删除</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty">暂无数据</td></tr>'}
document.querySelector('#rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-toggle')){const id=b.dataset.toggle;permissions[id]=permissions[id]===false;let saved=true;try{localStorage.setItem('department-contract-permissions',JSON.stringify(permissions))}catch{saved=false}render();notify((permissions[id]?'已允许该部门创建合同':'已禁止该部门创建合同')+(saved?'':'（仅本次页面有效）'))}else if(b.hasAttribute('data-edit'))openEditor(Number(b.dataset.edit));else if(b.hasAttribute('data-add'))openEditor(null);else if(b.hasAttribute('data-delete')){if(confirm('确定删除该部门？')){departments=departments.filter(d=>d.id!==Number(b.dataset.delete));render()}}else{collapsed=!collapsed;render()}};
document.querySelector('#filters').onsubmit=e=>{e.preventDefault();query=document.querySelector('#keyword').value.trim();filterStatus=document.querySelector('#status').value;render()};document.querySelector('#filters').onreset=()=>{query='';filterStatus='';render()};document.querySelector('#collapse').onclick=()=>{collapsed=!collapsed;render()};document.querySelector('#refresh').onclick=()=>{render();notify('已刷新')};document.querySelector('#searchToggle').onclick=()=>{const f=document.querySelector('#filters');f.hidden=!f.hidden;f.style.display=f.hidden?'none':'flex'};
function openEditor(id){editing=id;document.querySelector('#dialogTitle').textContent=id===null?'新增部门':'修改部门';document.querySelector('#deptName').value=id===null?'':departments.find(d=>d.id===id).name;document.querySelector('#editor').showModal()}document.querySelector('#add').onclick=()=>openEditor(null);document.querySelector('#cancel').onclick=()=>document.querySelector('#editor').close();document.querySelector('#editForm').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#deptName').value.trim();if(!name)return;if(editing===null)departments.push({id:Date.now(),name,date:'2026-10-26'});else departments.find(d=>d.id===editing).name=name;render();document.querySelector('#editor').close()};render();
</script></body></html>
