<main class="page"><div class="page-title">即将开盘</div><section class="filter-card"><div class="filter-fields"><label class="filter-item"><span class="filter-label">项目名称</span><input class="control-input" id="projectQuery" placeholder="请输入项目名称"></label><label class="filter-item"><span class="filter-label">分期名称</span><input class="control-input" id="phaseQuery" placeholder="请输入分期名称"></label></div><div class="filter-actions"><button class="btn btn-primary" id="search">查询</button><button class="btn" id="reset">重置</button></div></section><section class="list-card"><div class="toolbar"><button class="btn btn-primary btn-large" id="add">新增即将开盘</button></div><div class="table-wrap"><table><thead><tr><th>分期名称</th><th>开发企业名称</th><th>开盘楼栋</th><th>开盘栋数</th><th>预计开盘时间</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="openingRows"></tbody></table></div><div class="pagination" id="total"></div></section></main>
<dialog id="openingEditor" class="opening-dialog" aria-labelledby="editorTitle"><form id="openingForm"><div class="opening-title"><h2 id="editorTitle">新增即将开盘</h2><button class="icon-close" type="button" id="closeEditor" aria-label="关闭">×</button></div><div class="opening-body"><label class="opening-field"><span>开盘楼盘 <b>*</b></span><button class="estate-choice" id="chooseEstate" type="button">请选择楼盘 <span>⌄</span></button></label><label class="opening-field"><span>开盘楼栋 <b>*</b></span><input class="control-input" id="buildings" required maxlength="100" placeholder="请输入开盘楼栋，如1栋、2栋"></label><label class="opening-field"><span>开盘栋数 <b>*</b></span><input class="control-input" id="buildingCount" required type="number" min="1" step="1" placeholder="请输入开盘栋数"></label><label class="opening-field"><span>预计开盘时间 <b>*</b></span><input class="control-input" id="openingDate" type="date" required></label><p id="formError" role="alert"></p></div><footer class="opening-footer"><button class="btn" id="cancelEditor" type="button">取消</button><button class="btn btn-primary" type="submit">保存</button></footer></form></dialog>
<dialog id="estatePicker" class="opening-dialog estate-picker" aria-labelledby="pickerTitle"><div class="opening-title"><h2 id="pickerTitle">选择楼盘</h2><button class="icon-close" id="closePicker" aria-label="关闭">×</button></div><div class="opening-body"><div class="estate-filters"><label class="filter-item"><span class="filter-label">分期名称</span><input class="control-input" id="pickerPhase" placeholder="请输入分期名称"></label><label class="filter-item"><span class="filter-label">项目名称</span><input class="control-input" id="pickerProject" placeholder="请输入项目名称"></label><label class="filter-item"><span class="filter-label">开发企业</span><input class="control-input" id="pickerDeveloper" placeholder="请输入开发企业"></label><button class="btn btn-primary" id="pickerSearch">查询</button><button class="btn" id="pickerReset">重置</button></div><div class="estate-table-wrap"><table><thead><tr><th style="width:50px">选择</th><th>分期名称</th><th>项目名称</th><th>开发企业</th><th>区域</th></tr></thead><tbody id="pickerRows"></tbody></table></div><p class="picker-count" id="pickerCount"></p></div><footer class="opening-footer"><button class="btn" id="pickerCancel">取消</button><button class="btn btn-primary" id="pickerConfirm">确定</button></footer></dialog><div class="toast" id="toast" role="status"></div><script>
const estates=[
      { id: 1, phase: '绿城桂语兰庭', project: '绿城桂语兰庭', developer: '成都兴厦乐业置业有限公司', district: '温江区' },
      { id: 2, phase: '润百合园', project: '润百合园', developer: '成都丽景房地产开发有限公司', district: '成华区' },
      { id: 3, phase: '润百合轩', project: '润百合轩', developer: '成都丽景房地产开发有限公司', district: '成华区' },
      { id: 4, phase: '公园九号1期', project: '公园九号', developer: '成都九联科海健康科技有限公司', district: '温江区' },
      { id: 5, phase: '空港兴城·锦怡上院', project: '空港兴城·锦怡上院', developer: '成都荣浮置业有限公司', district: '双流区' },
      { id: 6, phase: '空港兴城·宸和府', project: '空港兴城·宸和府', developer: '成都棠楠置业有限公司', district: '双流区' },
      { id: 7, phase: '天投天成璞院', project: '天投天成璞院', developer: '成都朗瑜置业有限公司', district: '天府新区' },
      { id: 8, phase: '双楠樾院（备案名：铂悦楠园）', project: '双楠樾院（备案名：铂悦楠园）', developer: '成都瑞浩置业有限公司', district: '双流区' },
      { id: 9, phase: '富国上邦2期', project: '富国上邦', developer: '成都富强房地产开发有限公司', district: '武侯区' },
      { id: 10, phase: '天投·鑫辰', project: '天投·鑫辰', developer: '成都天投地产开发有限公司', district: '天府新区' },
      { id: 11, phase: '人居越秀和樾林语', project: '和樾林语', developer: '成都人居兴青置业有限公司', district: '青白江区' },
      { id: 12, phase: '龙湖焕城', project: '龙湖焕城', developer: '成都辰禧置业有限公司', district: '龙泉驿区' }
    ];
const $=id=>document.getElementById(id),storeKey='houseMarket.upcoming.admin.v1';let editing=null,selected=null,pending=null,query={project:'',phase:''},pickerQuery={project:'',phase:'',developer:''};
let items=[{id:1,estateId:1,buildings:'1栋、2栋',count:2,date:'2026-11-10',createdAt:'2026-11-02 09:30:00'},{id:2,estateId:4,buildings:'3栋、5栋',count:2,date:'2026-11-15',createdAt:'2026-11-02 10:00:00'},{id:3,estateId:9,buildings:'6栋',count:1,date:'2026-11-20',createdAt:'2026-11-02 10:30:00'}];try{const data=JSON.parse(localStorage.getItem(storeKey));if(Array.isArray(data))items=data}catch{}
function notify(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}
function persist(next){try{localStorage.setItem(storeKey,JSON.stringify(next));items=next;return true}catch{notify('保存失败，请重试');return false}}
function render(){const rows=items.filter(i=>{const e=estates.find(e=>e.id===i.estateId);return e&&e.project.includes(query.project)&&e.phase.includes(query.phase)}).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)||b.id-a.id);$('openingRows').replaceChildren();$('total').textContent='共 '+rows.length+' 条';if(!rows.length){const td=$('openingRows').insertRow().insertCell();td.colSpan=7;td.className='opening-empty';td.textContent='暂无符合条件的即将开盘项目';return}for(const item of rows){const e=estates.find(e=>e.id===item.estateId),row=$('openingRows').insertRow();for(const value of [e.phase,e.developer,item.buildings,item.count,item.date,item.createdAt])row.insertCell().textContent=value;const actions=row.insertCell();for(const [label,action] of [['编辑',()=>openEditor(item)],['删除',()=>{if(confirm('确定删除“'+e.phase+'”的即将开盘记录吗？')&&persist(items.filter(x=>x.id!==item.id))){render();notify('删除成功')}}]]){const button=document.createElement('button');button.className='opening-action';button.textContent=label;button.onclick=action;actions.append(button)}}}
function openEditor(item){editing=item||null;selected=item?.estateId||null;$('editorTitle').textContent=item?'编辑即将开盘':'新增即将开盘';$('buildings').value=item?.buildings||'';$('buildingCount').value=item?.count||'';$('openingDate').value=item?.date||'';$('formError').textContent='';updateChoice();$('openingEditor').showModal()}
function updateChoice(){const e=estates.find(x=>x.id===selected);$('chooseEstate').textContent=e?e.phase+'（'+e.project+'）':'请选择楼盘'}
$('add').onclick=()=>openEditor();$('closeEditor').onclick=$('cancelEditor').onclick=()=>$('openingEditor').close();$('search').onclick=()=>{query={project:$('projectQuery').value.trim(),phase:$('phaseQuery').value.trim()};render()};$('reset').onclick=()=>{$('projectQuery').value=$('phaseQuery').value='';query={project:'',phase:''};render()};for(const id of ['projectQuery','phaseQuery'])$(id).onkeydown=e=>{if(e.key==='Enter')$('search').click()};
function renderPicker(){const list=estates.filter(e=>e.phase.includes(pickerQuery.phase)&&e.project.includes(pickerQuery.project)&&e.developer.includes(pickerQuery.developer));$('pickerRows').replaceChildren();for(const e of list){const row=$('pickerRows').insertRow();row.classList.toggle('picker-selected',e.id===pending);const radio=document.createElement('input');radio.type='radio';radio.name='opening-estate';radio.value=e.id;radio.checked=e.id===pending;radio.setAttribute('aria-label','选择'+e.phase);radio.onchange=()=>{pending=e.id;renderPicker()};row.insertCell().append(radio);for(const value of [e.phase,e.project,e.developer,e.district])row.insertCell().textContent=value;row.onclick=event=>{if(event.target!==radio){pending=e.id;renderPicker()}}}if(!list.length){const td=$('pickerRows').insertRow().insertCell();td.colSpan=5;td.className='opening-empty';td.textContent='暂无符合条件的楼盘'}$('pickerCount').textContent='共 '+list.length+' 条，单次仅可选择1个楼盘';$('pickerConfirm').disabled=pending===null}
$('chooseEstate').onclick=()=>{pending=selected;pickerQuery={project:'',phase:'',developer:''};for(const id of ['pickerPhase','pickerProject','pickerDeveloper'])$(id).value='';renderPicker();$('estatePicker').showModal()};$('pickerSearch').onclick=()=>{pickerQuery={project:$('pickerProject').value.trim(),phase:$('pickerPhase').value.trim(),developer:$('pickerDeveloper').value.trim()};renderPicker()};$('pickerReset').onclick=()=>{for(const id of ['pickerPhase','pickerProject','pickerDeveloper'])$(id).value='';pickerQuery={project:'',phase:'',developer:''};renderPicker()};for(const id of ['pickerPhase','pickerProject','pickerDeveloper'])$(id).onkeydown=e=>{if(e.key==='Enter')$('pickerSearch').click()};$('closePicker').onclick=$('pickerCancel').onclick=()=>$('estatePicker').close();$('pickerConfirm').onclick=()=>{if(pending===null)return;selected=pending;updateChoice();$('formError').textContent='';$('estatePicker').close()};
$('openingForm').onsubmit=event=>{event.preventDefault();if(!selected){$('formError').textContent='请选择开盘楼盘';$('chooseEstate').focus();return}const buildings=$('buildings').value.trim(),count=Number($('buildingCount').value),date=$('openingDate').value;if(!buildings||!Number.isSafeInteger(count)||count<1||!date){$('formError').textContent='请填写开盘楼栋、正整数栋数和预计开盘时间';return}const next={id:editing?.id||Date.now(),estateId:selected,buildings,count,date,createdAt:editing?.createdAt||new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})};const data=editing?items.map(x=>x.id===editing.id?next:x):[next,...items];if(persist(data)){$('openingEditor').close();render();notify(editing?'修改成功':'新增成功')}};
document.getElementById('headerNav').onclick=event=>{const trigger=event.target.closest('.nav-trigger');if(!trigger)return;const parent=trigger.closest('[data-nav-menu]'),open=!parent.classList.contains('open');document.querySelectorAll('[data-nav-menu]').forEach(x=>x.classList.remove('open'));parent.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open))};document.addEventListener('click',event=>{if(!event.target.closest('#headerNav'))document.querySelectorAll('[data-nav-menu]').forEach(x=>x.classList.remove('open'))});render();
</script></body></html>
