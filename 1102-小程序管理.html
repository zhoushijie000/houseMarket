<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统 - 小程序管理</title><style>
*{box-sizing:border-box}body{margin:0;min-width:1120px;background:#f3f4f6;color:#606266;font:14px/1.5 "Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dcdfe6;border-radius:4px;background:white;color:#606266;padding:9px 18px}button.active,.primary{background:#4169e8;color:white;border-color:#4169e8}header{height:76px;display:flex;align-items:center;padding:0 24px;gap:20px;background:white;color:#222}header strong{font-size:20px}.logo{background:#4169e8;color:white;font-size:28px;padding:0 10px}header small{color:#909399;font-size:14px}nav{margin-left:auto;display:flex;gap:28px}nav span:last-child{color:#4169e8}.workspace-tabs{padding:12px 16px;display:flex;gap:6px}.workspace-tabs button:last-child{border-color:#4169e8;color:#4169e8}.tabs{margin:0 16px 14px;background:#fff;display:flex;gap:42px;padding:20px 24px 0;height:84px}.tabs span{padding:12px 0}.tabs .selected{color:#4169e8;border-bottom:2px solid #4169e8}.panel{margin:0 16px;padding:24px;min-height:calc(100vh - 238px);background:white}.row{display:flex;align-items:center;gap:12px;margin-bottom:20px}.row>label{width:80px;text-align:right}.segments{display:inline-flex}.segments button{border-radius:0;min-width:104px}.segments button+button{margin-left:-1px}.segments button:first-child{border-radius:4px 0 0 4px}.segments button:last-child{border-radius:0 4px 4px 0}.row input{width:480px;padding:9px 14px;border:1px solid #dcdfe6;border-radius:4px}.row input::placeholder{color:#c0c4cc}table{margin-top:22px;width:100%;border-collapse:collapse;text-align:left}th,td{border:1px solid #ebeef5;padding:16px 12px;font-weight:400}th{background:#f3f4f6}td{height:82px}td img{width:65px;height:28px;object-fit:contain}td button{border:0;padding:4px;color:#4169e8;font-size:13px}.empty{text-align:center;color:#909399;padding:60px}.note{font-size:12px;color:#909399;margin-left:8px}dialog{width:440px;border:0;border-radius:10px;padding:24px}dialog::backdrop{background:#0006}dialog h2{margin:0 0 20px;font-size:18px}dialog label{display:block;margin:14px 0}dialog input,dialog select{width:100%;padding:9px;border:1px solid #dcdfe6;border-radius:4px;margin-top:6px}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}[hidden]{display:none!important}.tabs [data-config-tab]{cursor:pointer}.module-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#edf4ff;color:#4169e8}.module-icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style></head><body>
<header><span class="logo">▥</span><strong>成都住建线上房产超市管理平台</strong><small>成都市住房和城乡建设局　⌄</small><nav><span>项目 ⌄</span><span>申请 ⌄</span><span>运营 ⌄</span><span>统计 ⌄</span><span>政务 ⌄</span><span>管理 ⌄</span><span>系统 ⌄</span></nav><span>周世杰</span></header><div class="workspace-tabs"><button>选择企业</button><button>项目管理</button><button>小程序管理　×</button></div><div class="tabs"><span class="selected" data-config-tab="images" role="tab" tabindex="0">图片配置</span><span>广告弹窗</span><span>企业专场</span><span>标签配置</span><span data-config-tab="modules" role="tab" tabindex="0">模块配置</span></div>
<main class="panel" id="imagesPanel"><div class="row"><label>业务类型：</label><div class="segments" id="business" role="group" aria-label="业务类型"><button class="active" data-value="新房" aria-pressed="true">新房</button><button data-value="二手房" aria-pressed="false">二手房</button></div></div><div class="row"><label>图片类型：</label><div class="segments" id="imageType" role="group" aria-label="图片类型"><button data-value="首页banner" aria-pressed="false">首页banner</button><button class="active" data-value="首页广告位" aria-pressed="true">首页广告位</button></div></div><div class="row"><label for="query">图片名称：</label><input id="query" placeholder="请输入图片名称"><button class="primary" id="search">查询</button><button id="reset">重置</button></div><button class="primary" id="add">新增图片</button><table><thead><tr><th>排序</th><th>图片名称</th><th>图片类型</th><th>图片</th><th>创建人</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></main>
<main class="panel" id="modulesPanel" hidden><div class="row"><label>业务类型：</label><div class="segments" id="moduleBusiness" role="group" aria-label="模块业务类型"><button class="active" data-value="新房" aria-pressed="true">新房</button><button data-value="二手房" aria-pressed="false">二手房</button></div></div><div class="row"><label>模块类型：</label><div class="segments" id="moduleType" role="group" aria-label="模块类型"><button class="active" data-value="首页模块" aria-pressed="true">首页模块</button><button data-value="底部导航" aria-pressed="false">底部导航</button></div></div><div class="row"><label for="moduleQuery">模块名称：</label><input id="moduleQuery" placeholder="请输入模块名称"><button class="primary" id="moduleSearch">查询</button><button id="moduleReset">重置</button></div><button class="primary" id="moduleAdd">新增模块</button><table><thead><tr><th>排序</th><th>模块名称</th><th>模块类型</th><th>跳转地址</th><th>图片</th><th>创建人</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="moduleRows"></tbody></table></main><dialog id="moduleEditor"><form id="moduleForm"><h2 id="moduleEditorTitle">新增模块</h2><label>业务类型<input id="moduleEditBusiness" readonly></label><label>模块类型<select id="moduleEditType"><option>首页模块</option><option>底部导航</option></select></label><label>模块名称<input id="moduleName" required maxlength="30"></label><label>跳转地址<input id="moduleTarget" required placeholder="如 propertyList/index"></label><label>排序<input id="moduleSort" required type="number" min="1" value="1"></label><footer><button type="button" id="moduleCancel">取消</button><button class="primary" type="submit">保存</button></footer></form></dialog><dialog id="editor"><form id="form"><h2 id="editorTitle">新增图片</h2><label>业务类型<input id="editBusiness" readonly></label><label>图片类型<select id="editType"><option>首页banner</option><option>首页广告位</option></select></label><label>图片名称<input id="name" required maxlength="50"></label><label>排序<input id="sort" type="number" min="1" required value="1"></label><label>图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><footer><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></footer></form></dialog>
<script>
const key='houseMarket.miniapp.images.v1';let business='新房',type='首页广告位',filter='',editing=null;
let items=[{id:1,business:'新房',type:'首页广告位',name:'工商银行',sort:1,image:'./assets/home-0918/bank-banner.svg',creator:'周世杰',date:'2025-12-12 13:30:46',enabled:true},{id:2,business:'新房',type:'首页广告位',name:'成都银行',sort:2,image:'./assets/home-0918/bank-banner.svg',creator:'周世杰',date:'2025-12-26 16:32:34',enabled:true}];try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))items=saved}catch{}
const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(items))}function render(){const list=items.filter(i=>i.business===business&&i.type===type&&i.name.includes(filter)).sort((a,b)=>a.sort-b.sort);$('rows').replaceChildren();if(!list.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent='暂无'+business+'的'+type+'图片，请点击“新增图片”配置';tr.append(td);$('rows').append(tr);return}for(const i of list){const tr=document.createElement('tr');for(const text of [i.sort,i.name,i.type]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const photo=document.createElement('td');const img=document.createElement('img');img.src=i.image;img.alt=i.name;photo.append(img);tr.append(photo);for(const text of [i.creator,i.date,i.enabled?'启用':'禁用']){const td=document.createElement('td');td.textContent=text;tr.append(td)}const actions=document.createElement('td');for(const [text,action] of [[i.enabled?'禁用':'启用',()=>{i.enabled=!i.enabled;save();render()}],['编辑',()=>open(i)],['删除',()=>{if(confirm('确认删除图片“'+i.name+'”？')){items=items.filter(x=>x.id!==i.id);save();render()}}]]){const b=document.createElement('button');b.textContent=text;b.onclick=action;actions.append(b)}tr.append(actions);$('rows').append(tr)}}
for(const [id,assign] of [['business',v=>business=v],['imageType',v=>type=v]])$(id).onclick=e=>{const b=e.target.closest('[data-value]');if(!b)return;assign(b.dataset.value);for(const x of $(id).children){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))}render()};$('search').onclick=()=>{filter=$('query').value.trim();render()};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click()};$('reset').onclick=()=>{$('query').value='';filter='';render()};function open(item){editing=item||null;$('editorTitle').textContent=item?'编辑图片':'新增图片';$('editBusiness').value=business;$('editType').value=item?.type||type;$('name').value=item?.name||'';$('sort').value=item?.sort||1;$('file').value='';$('editor').showModal()}$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=async e=>{e.preventDefault();let image=editing?.image||'';const file=$('file').files[0];if(file){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){alert('请选择不超过2MB的PNG、JPG或WebP图片');return}image=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}if(!image){alert('请上传图片');return}const item={id:editing?.id||Date.now(),business,type:$('editType').value,name:$('name').value.trim(),sort:Number($('sort').value),image,creator:editing?.creator||'周世杰',date:editing?.date||new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}),enabled:editing?.enabled??true};if(!item.name)return;const before=items;items=editing?items.map(i=>i.id===editing.id?item:i):[...items,item];try{save()}catch{items=before;alert('保存失败，请尝试更小的图片');return}$('editor').close();render()};render();
</script>
<script>
(()=>{
const el=id=>document.getElementById(id),key='houseMarket.miniapp.modules.v1';let business='新房',type='首页模块',query='',editing=null;
const seed=[['房产行情','realEstateMarket/index',1,false],['楼盘榜单','propertyList/index',2,true],['购房地图','platePic/index',3,true],['一键选房','onTouchHouseSelection/index',5,true],['土拍信息','landAnalysis/index',6,true],['地图找房','mapSearch/index',10,true]];
let modules=seed.map(([name,target,sort,enabled],index)=>({id:index+1,business:'新房',category:'首页模块',name,target,sort,enabled,creator:'周世杰',date:'2025-04-17 16:53:32'}));try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))modules=saved}catch{}
const icons=['<path d="m3 9 9-6 9 6v12H3zM7 17v-4m5 4v-7m5 7v-5"/>','<circle cx="12" cy="14" r="7"/><path d="m7 3 2 5m8-5-2 5m-3 2 1 3 3 .5-2 2 .5 3-2.5-1.5-2.5 1.5.5-3-2-2 3-.5z"/>','<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/>'];
function persist(){localStorage.setItem(key,JSON.stringify(modules))}
function render(){el('moduleRows').replaceChildren();const list=modules.filter(m=>m.business===business&&m.category===type&&m.name.includes(query)).sort((a,b)=>a.sort-b.sort);if(!list.length){const row=el('moduleRows').insertRow(),cell=row.insertCell();cell.colSpan=9;cell.className='empty';cell.textContent='暂无'+business+'的'+type+'配置，请点击“新增模块”配置';return}for(const m of list){const row=el('moduleRows').insertRow();for(const value of [m.sort,m.name,m.category==='首页模块'?'首页功能':'底部导航',m.target])row.insertCell().textContent=value;const icon=document.createElement('span');icon.className='module-icon';icon.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[(m.id-1)%icons.length]+'</svg>';row.insertCell().append(icon);for(const value of [m.creator,m.date,m.enabled?'启用':'禁用'])row.insertCell().textContent=value;const actions=row.insertCell();for(const [label,fn] of [[m.enabled?'禁用':'启用',()=>{m.enabled=!m.enabled;persist();render()}],['编辑',()=>open(m)],['删除',()=>{if(confirm('确认删除模块“'+m.name+'”？')){modules=modules.filter(x=>x.id!==m.id);persist();render()}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}}}
for(const [id,set] of [['moduleBusiness',v=>business=v],['moduleType',v=>type=v]])el(id).onclick=e=>{const b=e.target.closest('[data-value]');if(!b)return;set(b.dataset.value);for(const x of el(id).children){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))}render()};
function switchTab(name){el('imagesPanel').hidden=name!=='images';el('modulesPanel').hidden=name!=='modules';for(const tab of document.querySelectorAll('[data-config-tab]')){const active=tab.dataset.configTab===name;tab.classList.toggle('selected',active);tab.setAttribute('aria-selected',String(active))}history.replaceState(null,'',name==='modules'?'#modules':location.pathname);if(name==='modules')render()}
for(const tab of document.querySelectorAll('[data-config-tab]')){tab.onclick=()=>switchTab(tab.dataset.configTab);tab.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tab.click()}}}
el('moduleSearch').onclick=()=>{query=el('moduleQuery').value.trim();render()};el('moduleQuery').onkeydown=e=>{if(e.key==='Enter')el('moduleSearch').click()};el('moduleReset').onclick=()=>{query='';el('moduleQuery').value='';render()};
function open(item){editing=item||null;el('moduleEditorTitle').textContent=item?'编辑模块':'新增模块';el('moduleEditBusiness').value=business;el('moduleEditType').value=item?.category||type;el('moduleName').value=item?.name||'';el('moduleTarget').value=item?.target||'';el('moduleSort').value=item?.sort||1;el('moduleEditor').showModal()}
el('moduleAdd').onclick=()=>open();el('moduleCancel').onclick=()=>el('moduleEditor').close();el('moduleForm').onsubmit=e=>{e.preventDefault();const next={id:editing?.id||Date.now(),business,category:el('moduleEditType').value,name:el('moduleName').value.trim(),target:el('moduleTarget').value.trim(),sort:Number(el('moduleSort').value),enabled:editing?.enabled??true,creator:editing?.creator||'周世杰',date:editing?.date||new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})};if(!next.name||!next.target)return;const before=modules;modules=editing?modules.map(m=>m.id===editing.id?next:m):[...modules,next];try{persist()}catch{modules=before;alert('保存失败，请重试');return}el('moduleEditor').close();render()};switchTab(location.hash==='#modules'?'modules':'images');
})();
</script></body></html>
