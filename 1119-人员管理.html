const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let org=0,editing=null,editingOrg=0,projectPerson=null,assigningPhases=false,query=['','','',''],avatar='',qr='',pendingUploads=0;
let people=[{id:1,org:0,category:'advisor',name:'张顾问',phone:'13800138001',idNumber:'',wechat:'zhang_advisor',avatar:'',qr:'',role:'置业顾问',projects:[],phases:['津智·云境（一期）','津智·云境（二期）']},{id:2,org:0,category:'advisor',name:'李顾问',phone:'13900139002',idNumber:'',wechat:'li_advisor',avatar:'',qr:'',role:'置业顾问',projects:[],phases:[]},{id:3,org:0,category:'staff',name:'企业管理员',phone:'13700137003',idNumber:'',role:'企业管理员',projects:[]}];

 {id:111901,org:0,category:'advisor',role:'置业顾问',name:'林晓（示例）',phone:'13600001001',wechat:'demo_linxiao',idNumber:'',avatar:'assets/advisor-avatar.png',qr:'assets/advisor-wechat-demo.svg',projects:[],phases:['津智·云境（一期）','津智·云境（二期）']},
 {id:111902,org:0,category:'advisor',role:'置业顾问',name:'陈悦（示例）',phone:'13600001002',wechat:'demo_chenyue',idNumber:'',avatar:'assets/advisor-avatar.png',qr:'assets/advisor-wechat-demo.svg',projects:[],phases:['津智·锦悦府（一期）']},
 {id:111903,org:0,category:'advisor',role:'置业顾问',name:'赵宁（示例）',phone:'13600001003',wechat:'demo_zhaoning',idNumber:'',avatar:'assets/advisor-avatar.png',qr:'assets/advisor-wechat-demo.svg',projects:[],phases:['津智·云境（二期）']},

];
function addDemoAdvisors(){for(const sample of demoAdvisors)if(!people.some(p=>p.id===sample.id||p.phone===sample.phone))people.push({...sample})}
addDemoAdvisors();
const isAdvisor=p=>p.role==='置业顾问'||(!p.role&&p.category==='advisor');
const phases=p=>Array.isArray(p.phases)?p.phases:(p.category==='advisor'?p.projects||[]:[]);
try{const saved=JSON.parse(localStorage.getItem('house-personnel-v1'));if(Array.isArray(saved))people=saved}catch{}
const dbReady=new Promise((resolve,reject)=>{const req=indexedDB.open('house-personnel-prototype',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function persist(){try{const db=await dbReady;await new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(people,'people');tx.objectStore('data').put(true,'demo-advisors-v2');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});return true}catch{return false}}
async function restore(){try{const db=await dbReady;const read=key=>new Promise((resolve,reject)=>{const req=db.transaction('data').objectStore('data').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const saved=await read('people'),seeded=await read('demo-advisors-v2');if(Array.isArray(saved))people=saved;if(!seeded){addDemoAdvisors();await persist()}render()}catch{notify('本地存储不可用，保存时请检查浏览器权限')}}
function notify(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,2500)}
function renderOrgs(){const q=$('orgSearch').value.trim();$('organizations').innerHTML=orgs.map((name,i)=>name.includes(q)?`<button class="tree-item ${i===org?'chosen':''}" data-org="${i}" title="${esc(name)}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M4 2h8l4 4v12H4zM12 2v5h4M7 10h6"/></svg>${esc(name)}</button>`:'').join('')||'<p class="muted">暂无匹配机构</p>'}
function imageCell(p,type){return p[type]?`<button class="photo-button" data-image="${p.id}" data-type="${type}" aria-label="查看${esc(p.name)}的${type==='avatar'?'置业顾问照片':'微信二维码'}"><img class="table-photo ${type==='qr'?'table-qr':''}" src="${esc(p[type])}" alt="${type==='avatar'?'置业顾问照片':'微信二维码'}"></button>`:'-'}
function render(){
 if($('add'))$('add').hidden=advisorPage;$('currentOrg').textContent=advisorPage?'':orgs[org];
 $('head').innerHTML='<tr>'+(advisorPage?['姓名','手机号','微信号','置业顾问照片','微信二维码','负责分期','操作']:['姓名','手机号','身份证号','操作']).map(h=>'<th>'+h+'</th>').join('')+'</tr>';
 const list=people.filter(p=>(advisorPage?isAdvisor(p):p.org===org)&&p.name.includes(query[0])&&(advisorPage?phases(p).some(x=>x.includes(query[3]))||!query[3]:(p.idNumber||'').toUpperCase().includes(query[1].toUpperCase())&&p.phone.includes(query[2])));
 $('rows').innerHTML=list.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'))}</td>${advisorPage?`<td>${esc(p.wechat)||'—'}</td><td>${imageCell(p,'avatar')}</td><td>${imageCell(p,'qr')}</td><td>${esc(phases(p).join('、'))||'—'}</td>`:`<td>${p.idNumber?esc(p.idNumber.slice(0,3)+'***********'+p.idNumber.slice(-4)):'—'}</td>`}<td><button class="link" data-edit="${p.id}">编辑</button><button class="link" data-project="${p.id}">${advisorPage?'分配分期':'授权项目'}</button>${!advisorPage&&isAdvisor(p)?`<button class="link" data-phase="${p.id}">分配置业顾问分期</button>`:''}${!advisorPage?`<button class="link" data-delete="${p.id}">删除</button>`:''}</td></tr>`).join('')||`<tr><td class="empty" colspan="${advisorPage?7:4}">暂无${advisorPage?'置业顾问':'人员'}数据</td></tr>`;
 $('count').textContent='共 '+list.length+' 条';
}
function preview(type,value){$(type+'Preview').innerHTML=value?'<img src="'+esc(value)+'" alt="图片预览">':'＋'}
function syncRole(){const a=advisorPage||$('role').value==='置业顾问';$('advisorFields').hidden=!a;$('avatarFile').required=a&&!avatar;$('qrFile').required=a&&!qr;$('avatarFile').disabled=!a;$('qrFile').disabled=!a;$('wechatField').hidden=!advisorPage;$('wechat').required=advisorPage;$('wechat').disabled=!advisorPage;$('roleField').hidden=advisorPage;$('passwordNotice').hidden=a;if($('idNumber')){$('idNumber').required=!a;$('idLabel').classList.toggle('required',!a);$('idNumber').placeholder=a?'请输入身份证号（选填）':'请输入身份证号';}}
function openEditor(id=null){
 if(advisorPage&&id===null)return;
 editing=id;const p=people.find(p=>p.id===id);editingOrg=p?.org??org;$('personForm').reset();$('editorTitle').textContent=(p?'编辑':'新增')+(advisorPage?'置业顾问':'人员');
 ['phone','name','idNumber','wechat'].forEach(k=>{if($(k))$(k).value=p?.[k]||''});$('phone').readOnly=advisorPage;$('phone').setAttribute('aria-readonly',String(advisorPage));$('company').value=orgs[editingOrg];$('role').value=isAdvisor(p||{})?'置业顾问':p?.role||'企业管理员';avatar=p?.avatar||'';qr=p?.qr||'';preview('avatar',avatar);preview('qr',qr);$('formError').textContent='';syncRole();$('editor').showModal();
}
$('role').onchange=syncRole;if($('add'))$('add').onclick=()=>openEditor();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('orgSearch').oninput=renderOrgs;$('organizations').onclick=e=>{const b=e.target.closest('[data-org]');if(b){org=+b.dataset.org;renderOrgs();render()}};
$('filters').onsubmit=e=>{e.preventDefault();query=[$('queryName').value.trim(),$('queryId').value.trim(),$('queryPhone').value.trim(),$('queryPhase').value.trim()];render()};$('filters').onreset=()=>{query=['','','',''];render()};

$('personForm').onsubmit=async e=>{
