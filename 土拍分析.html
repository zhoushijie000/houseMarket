<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>土拍分析</title>
  <style>
    :root {
      --brand: #fd5d00;
      --brand-2: #ff8f2e;
      --brand-deep: #c74600;
      --red: #ff3b30;
      --text: #303133;
      --text-2: #606266;
      --muted: #909399;
      --line: #e4e7ed;
      --bg: #f3f5f6;
      --surface: #ffffff;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background: var(--bg);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 390px);
      min-height: 100vh;
      padding-bottom: calc(18px + var(--safe-bottom));
      background:
        radial-gradient(circle at right top, rgba(255, 255, 255, 0.16), transparent 28%),
        linear-gradient(180deg, #fd5d00 0, #ff8124 280px, var(--bg) 280px);
      overflow-x: hidden;
    }

    .statusbar {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 21px 6px;
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
    }

    .statusbar__right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      display: grid;
      grid-template-columns: repeat(4, 3px);
      align-items: end;
      gap: 2px;
      height: 12px;
    }

    .signal i {
      width: 3px;
      border-radius: 2px;
      background: currentColor;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 9px; }
    .signal i:nth-child(4) { height: 12px; }

    .battery {
      position: relative;
      width: 21px;
      height: 11px;
      border: 1.4px solid currentColor;
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -3px;
      top: 3px;
      width: 2px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .hero {
      padding: 6px 16px 16px;
      color: #fff;
    }

    .hero-top {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .hero-back {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .hero-back svg,
    .more-pill svg,
    .batch-cta svg,
    .filter-chip svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 700;
    }

    .more-pill {
      min-width: 86px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(161, 55, 0, 0.3);
      color: rgba(255, 255, 255, 0.9);
    }

    .more-pill__dots {
      display: flex;
      gap: 5px;
    }

    .more-pill__dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .search-card,
    .section,
    .batch-shell,
    .land-card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    .search-card {
      margin-top: 18px;
      padding: 17px 16px;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--muted);
    }

    .search-field svg {
      width: 22px;
      height: 22px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      font-size: 14px;
      background: transparent;
    }

    .search-field input::placeholder {
      color: #a4abb4;
    }

    .content {
      display: grid;
      gap: 12px;
      width: 100%;
      min-width: 0;
      padding: 0 14px 18px;
    }

    .section {
      padding: 14px 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      text-align: center;
    }

    .stat-pill strong {
      width: clamp(46px, 13vw, 54px);
      height: clamp(46px, 13vw, 54px);
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
    }

    .stat-pill span {
      display: block;
      color: #2f3338;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 700;
    }

    .stat-pill:nth-child(1) strong { background: linear-gradient(145deg, #ffae55, #ff8124); }
    .stat-pill:nth-child(2) strong { background: linear-gradient(145deg, #ff9a3c, #fd5d00); }
    .stat-pill:nth-child(3) strong { background: linear-gradient(145deg, #ff784f, #f04438); }
    .stat-pill:nth-child(4) strong { background: linear-gradient(145deg, #ffb43f, #ff7a00); }
    .stat-pill:nth-child(5) strong { background: linear-gradient(145deg, #ff7136, #d94b00); }

    .ranking {
      padding: 0;
      overflow: hidden;
    }

    .ranking-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 10px 0;
      background: linear-gradient(180deg, #fff4e7 0, #fff9f4 100%);
    }

    .ranking-tab {
      min-height: 46px;
      padding: 0 10px;
      border-radius: 14px 14px 0 0;
      color: #ad6a33;
      font-size: 13px;
      font-weight: 800;
    }

    .ranking-tab.is-active {
      color: #b65b1c;
      background: linear-gradient(180deg, #fffdf8 0, #fff4e6 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 167, 76, 0.2);
    }

    .ranking-panel {
      padding: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-head strong {
      color: #171a1f;
      font-size: 15px;
      font-weight: 800;
    }

    .section-link {
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
    }

    .ranking-list {
      display: grid;
      gap: 12px;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .medal {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff4d9, #ffd38f);
      color: #b97923;
      font-size: 13px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(191, 129, 45, 0.16);
    }

    .medal.silver {
      background: linear-gradient(145deg, #f1f4fb, #d7ddea);
      color: #73809a;
    }

    .medal.bronze {
      background: linear-gradient(145deg, #fff0e6, #f6c6af);
      color: #b46b4b;
    }

    .ranking-main {
      min-width: 0;
    }

    .ranking-main strong,
    .ranking-main span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-main strong {
      color: #171a1f;
      font-size: 13px;
      font-weight: 800;
    }

    .ranking-main span {
      margin-top: 4px;
      color: var(--text-2);
      font-size: 12px;
    }

    .ranking-value {
      color: var(--red);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .batch-shell {
      padding: 12px;
    }

    .batch-tabs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(124px, 1fr);
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .batch-tabs::-webkit-scrollbar {
      display: none;
    }

    .batch-tab {
      position: relative;
      min-height: 86px;
      padding: 14px 12px 12px;
      border-radius: 10px;
      color: #53616d;
      background: #eef2f3;
      text-align: left;
      box-shadow: inset 0 0 0 1px rgba(216, 223, 226, 0.9);
    }

    .batch-tab.is-active {
      color: var(--brand-deep);
      background: linear-gradient(180deg, #fff7f0 0, #ffeadb 100%);
      box-shadow: inset 0 0 0 2px rgba(253, 93, 0, 0.3);
    }

    .batch-tab.is-active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 12px;
      height: 12px;
      background: #ffeadb;
      border-right: 2px solid rgba(253, 93, 0, 0.3);
      border-bottom: 2px solid rgba(253, 93, 0, 0.3);
      transform: translateX(-50%) rotate(45deg);
    }

    .batch-tab.has-badge {
      padding-top: 28px;
    }

    .batch-badge {
      position: absolute;
      top: 6px;
      right: 7px;
      min-width: 38px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      padding: 0 6px;
      border-radius: 6px;
      color: #fff;
      background: linear-gradient(145deg, #ff9a3c, #fd5d00);
      font-size: 9px;
      font-weight: 800;
    }

    .batch-tab strong {
      display: block;
      overflow: hidden;
      color: currentColor;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .batch-tab span {
      display: block;
      margin-top: 7px;
      color: currentColor;
      font-size: 11px;
      opacity: 0.84;
    }

    .batch-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      background: linear-gradient(90deg, #fff5ed 0, #fff0e5 100%);
    }

    .batch-summary__meta {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 8px 14px;
      color: #4e5b67;
      font-size: 14px;
      font-weight: 700;
    }

    .batch-summary__meta strong {
      color: var(--brand);
      font-size: 16px;
      font-weight: 900;
    }

    .batch-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-width: 0;
      gap: 8px;
    }

    .filter-chip {
      min-width: 0;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 10px;
      color: #5e6874;
      background: #fff;
      box-shadow: 0 4px 16px rgba(16, 24, 40, 0.06);
      padding: 0 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-chip svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    .land-list {
      display: grid;
      min-width: 0;
      gap: 12px;
    }

    .land-card {
      overflow: hidden;
      padding: 13px 12px;
    }

    .land-title {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      gap: 8px;
    }

    .status-tag {
      min-width: 52px;
      min-height: 28px;
      display: inline-grid;
      place-items: center;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      flex: none;
    }

    .status-wait {
      color: var(--brand);
      background: #fff5ed;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.25);
    }

    .status-sold {
      color: #fd5d00;
      background: #fff4ec;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.24);
    }

    .status-failed {
      color: #6e7c90;
      background: #f2f5f8;
      box-shadow: inset 0 0 0 1px rgba(110, 124, 144, 0.2);
    }

    .land-title h3 {
      min-width: 0;
      margin: 0;
      color: #111827;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .price-line {
      margin-top: 10px;
      color: #171a1f;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .price-line strong {
      color: var(--brand);
      font-size: 17px;
      font-weight: 900;
    }

    .land-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: 0;
      gap: 7px 8px;
      margin-top: 12px;
      color: var(--text-2);
      font-size: 12px;
      line-height: 1.45;
    }

    .land-meta span {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .land-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-width: 0;
      gap: 7px;
      margin-top: 14px;
    }

    .land-actions button {
      min-width: 0;
      min-height: 44px;
      border-radius: 10px;
      color: var(--brand-deep);
      background: linear-gradient(180deg, #fff7f0 0, #ffeadb 100%);
      padding: 0 6px;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 360px) {
      .hero {
        padding-right: 12px;
        padding-left: 12px;
      }

      .content {
        padding-right: 10px;
        padding-left: 10px;
      }

      .section,
      .batch-shell {
        padding-right: 10px;
        padding-left: 10px;
      }

      .batch-summary {
        grid-template-columns: minmax(0, 1fr);
        padding: 12px;
      }

      .batch-cta {
        justify-self: start;
      }

      .land-meta {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .empty {
      padding: 26px 16px;
      border-radius: 12px;
      color: var(--muted);
      background: #fff;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    @media (min-width: 431px) {
      body {
        padding: 16px 0;
      }

      .page {
        min-height: calc(100vh - 32px);
        border-radius: 18px;
        box-shadow: 0 18px 44px rgba(30, 41, 59, 0.16);
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="土拍分析页面">
    <div class="statusbar" aria-hidden="true">
      <span>14:13</span>
      <div class="statusbar__right">
        <span>5GA</span>
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="battery"></span>
      </div>
    </div>

    <header class="hero">
      <div class="hero-top">
        <a class="hero-back" href="./安家成都-首页-扫码.html" aria-label="返回首页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </a>
        <h1 class="hero-title">土拍分析</h1>
        <button class="more-pill" type="button" aria-label="更多操作">
          <span class="more-pill__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2.4" /></svg>
        </button>
      </div>

      <div class="search-card" aria-label="搜索地块">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
          <input id="searchInput" type="search" placeholder="输入地块名 / 编号 / 竞得公司搜索" />
        </label>
      </div>
    </header>

    <div class="content">
      <section class="section" aria-label="土拍概览">
        <div class="stats-grid" id="statsGrid"></div>
      </section>

      <section class="section ranking" aria-label="成交榜单">
        <div class="ranking-tabs">
          <button class="ranking-tab is-active" type="button" data-ranking-tab="floor">成交楼面价</button>
          <button class="ranking-tab" type="button" data-ranking-tab="brand">品牌土地成交</button>
          <button class="ranking-tab" type="button" data-ranking-tab="premium">土拍溢价率榜</button>
        </div>
        <div class="ranking-panel">
          <div class="section-head">
            <strong id="rankingTitle">历史成交地块排行</strong>
            <a class="section-link" href="javascript:void(0)">完整榜单 &rsaquo;</a>
          </div>
          <div class="ranking-list" id="rankingList"></div>
        </div>
      </section>

      <section class="batch-shell" aria-label="批次与筛选">
        <div class="batch-tabs" id="batchTabs"></div>
        <div class="batch-summary">
          <div class="batch-summary__meta" id="batchSummary"></div>
          <button class="batch-cta" type="button">
            查看批次详情
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
      </section>

      <div class="filters" aria-label="地块筛选">
        <button class="filter-chip" type="button" data-filter-key="district"><span id="districtLabel">区域</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button>
        <button class="filter-chip" type="button" data-filter-key="usage"><span id="usageLabel">用途</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button>
        <button class="filter-chip" type="button" data-filter-key="status"><span id="statusLabel">状态</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button>
        <button class="filter-chip" type="button" data-filter-key="sort"><span id="sortLabel">排序</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button>
      </div>

      <section class="land-list" id="landList" aria-label="土拍地块列表"></section>
    </div>
  </main>

  <script>
    const stats = [
      { value: 138, label: "拟出让" },
      { value: 5, label: "即将拍卖" },
      { value: 627, label: "成交地块" },
      { value: 29, label: "流拍地块" },
      { value: 821, label: "全部地块" }
    ];

    const rankingData = {
      floor: {
        title: "历史成交地块排行",
        rows: [
          { district: "锦江区", company: "建发地产", value: "41200元/㎡" },
          { district: "锦江区", company: "国贸地产", value: "35500元/㎡" },
          { district: "高新区", company: "招商蛇口", value: "31700元/㎡" }
        ]
      },
      brand: {
        title: "品牌拿地热度排行",
        rows: [
          { district: "高新区", company: "招商蛇口", value: "18宗" },
          { district: "天府新区", company: "建发地产", value: "14宗" },
          { district: "锦江区", company: "华润置地", value: "12宗" }
        ]
      },
      premium: {
        title: "高溢价成交排行",
        rows: [
          { district: "成华区", company: "保利发展", value: "21.6%" },
          { district: "金牛区", company: "越秀地产", value: "19.8%" },
          { district: "高新区", company: "招商蛇口", value: "17.4%" }
        ]
      }
    };

    const batches = [
      { id: "all", name: "全部土拍", range: "全周期数据", badge: "", status: "all", lands: 821, sold: 627 },
      { id: "2026a", name: "土地出让清单", range: "2026.01.01-2026.12.31", badge: "进行中", status: "running", lands: 37, sold: 32 },
      { id: "2025m", name: "成都2025年中期批次", range: "2025.03.11-2025.12.31", badge: "", status: "ended", lands: 20, sold: 19 },
      { id: "2024w", name: "成都2024年尾批次", range: "2024.12.01-2024.12.31", badge: "", status: "ended", lands: 15, sold: 13 }
    ];

    const landRecords = [
      { batch: "2026a", status: "待出让", district: "金牛区", usage: "住宅", title: "金牛区高新西区3号地块30.30亩", company: "-", floorPrice: 11900, date: "2026-07-14", volumeRate: "2.0", area: "30.2955亩", zone: "金牛区-国宾" },
      { batch: "2026a", status: "待出让", district: "金牛区", usage: "住宅", title: "金牛区国宾片区1号地块27.05亩", company: "-", floorPrice: 13800, date: "2026-07-17", volumeRate: "2.2", area: "27.05亩", zone: "金牛区-国宾" },
      { batch: "2026a", status: "成交", district: "高新区", usage: "住宅", title: "高新区新川南组团42亩优质地块", company: "招商蛇口", floorPrice: 31700, date: "2026-06-30", volumeRate: "2.5", area: "42.18亩", zone: "高新区-新川" },
      { batch: "2026a", status: "成交", district: "天府新区", usage: "商住", title: "天府新区麓湖东侧综合地块58亩", company: "建发地产", floorPrice: 26800, date: "2026-05-26", volumeRate: "2.8", area: "58.02亩", zone: "天府新区-麓湖" },
      { batch: "2025m", status: "成交", district: "锦江区", usage: "住宅", title: "锦江区东大街沿线22亩纯住宅地块", company: "国贸地产", floorPrice: 35500, date: "2025-09-18", volumeRate: "2.1", area: "22.64亩", zone: "锦江区-东大街" },
      { batch: "2025m", status: "流拍", district: "成华区", usage: "商办", title: "成华区二仙桥创智产业地块36亩", company: "-", floorPrice: 9200, date: "2025-08-11", volumeRate: "3.0", area: "36.11亩", zone: "成华区-二仙桥" },
      { batch: "2024w", status: "成交", district: "武侯区", usage: "住宅", title: "武侯新城核心31亩住兼商地块", company: "华润置地", floorPrice: 24600, date: "2024-12-16", volumeRate: "2.3", area: "31.07亩", zone: "武侯区-武侯新城" }
    ];

    const filterOptions = {
      district: ["区域", "金牛区", "高新区", "天府新区", "锦江区", "成华区", "武侯区"],
      usage: ["用途", "住宅", "商住", "商办"],
      status: ["状态", "待出让", "成交", "流拍"],
      sort: ["排序", "最新出让", "楼面价从高到低", "地块面积从大到小"]
    };

    const filterLabels = {
      district: document.getElementById("districtLabel"),
      usage: document.getElementById("usageLabel"),
      status: document.getElementById("statusLabel"),
      sort: document.getElementById("sortLabel")
    };

    const statsGrid = document.getElementById("statsGrid");
    const rankingList = document.getElementById("rankingList");
    const rankingTitle = document.getElementById("rankingTitle");
    const batchTabs = document.getElementById("batchTabs");
    const batchSummary = document.getElementById("batchSummary");
    const landList = document.getElementById("landList");
    const searchInput = document.getElementById("searchInput");

    let activeRanking = "floor";
    let activeBatch = "2026a";
    let filters = {
      district: "区域",
      usage: "用途",
      status: "状态",
      sort: "最新出让"
    };

    function renderStats() {
      statsGrid.innerHTML = stats.map((item) => `
        <div class="stat-pill">
          <strong>${item.value}</strong>
          <span>${item.label}</span>
        </div>
      `).join("");
    }

    function renderRanking() {
      const current = rankingData[activeRanking];
      rankingTitle.textContent = current.title;
      rankingList.innerHTML = current.rows.map((row, index) => {
        const medalClass = index === 1 ? "silver" : index === 2 ? "bronze" : "";
        return `
          <div class="ranking-row">
            <span class="medal ${medalClass}">${index + 1}</span>
            <span class="ranking-main">
              <strong>${row.district}</strong>
              <span>${row.company}</span>
            </span>
            <span class="ranking-value">${row.value}</span>
          </div>
        `;
      }).join("");
    }

    function renderBatches() {
      batchTabs.innerHTML = batches.map((batch) => `
        <button class="batch-tab ${batch.id === activeBatch ? "is-active" : ""} ${batch.badge ? "has-badge" : ""}" type="button" data-batch-id="${batch.id}">
          ${batch.badge ? `<span class="batch-badge">${batch.badge}</span>` : ""}
          <strong>${batch.name}</strong>
          <span>${batch.range}</span>
        </button>
      `).join("");

      batchTabs.querySelectorAll("[data-batch-id]").forEach((button) => {
        button.addEventListener("click", () => {
          activeBatch = button.dataset.batchId;
          renderBatches();
          renderLandList();
        });
      });

      const current = batches.find((batch) => batch.id === activeBatch) || batches[0];
      batchSummary.innerHTML = `
        <span>出让地块 <strong>${current.lands}</strong></span>
        <span>成交地块 <strong>${current.sold}</strong></span>
      `;
    }

    function getFilteredRecords() {
      let rows = landRecords.filter((row) => activeBatch === "all" || row.batch === activeBatch);
      const keyword = searchInput.value.trim();
      if (keyword) {
        rows = rows.filter((row) => `${row.title}${row.district}${row.company}${row.zone}`.includes(keyword));
      }
      if (filters.district !== "区域") rows = rows.filter((row) => row.district === filters.district);
      if (filters.usage !== "用途") rows = rows.filter((row) => row.usage === filters.usage);
      if (filters.status !== "状态") rows = rows.filter((row) => row.status === filters.status);

      rows = [...rows];
      if (filters.sort === "楼面价从高到低") rows.sort((a, b) => b.floorPrice - a.floorPrice);
      else if (filters.sort === "地块面积从大到小") rows.sort((a, b) => parseFloat(b.area) - parseFloat(a.area));
      else rows.sort((a, b) => new Date(b.date) - new Date(a.date));
      return rows;
    }

    function getStatusClass(status) {
      if (status === "待出让") return "status-wait";
      if (status === "成交") return "status-sold";
      return "status-failed";
    }

    function renderLandList() {
      const rows = getFilteredRecords();
      if (!rows.length) {
        landList.innerHTML = '<div class="empty">当前筛选条件下暂无匹配地块</div>';
        return;
      }
      landList.innerHTML = rows.map((row) => `
        <article class="land-card">
          <div class="land-title">
            <span class="status-tag ${getStatusClass(row.status)}">${row.status}</span>
            <h3>${row.title}</h3>
          </div>
          <div class="price-line">起拍楼面价：<strong>${row.floorPrice}</strong>（元/平方米）</div>
          <div class="land-meta">
            <span>区域：${row.zone}</span>
            <span>${row.status === "成交" ? "成交时间" : "出让时间"}：${row.date}</span>
            <span>面积：${row.area}</span>
            <span>容积率：${row.volumeRate}</span>
          </div>
          <div class="land-actions">
            <button type="button">周边房价</button>
            <button type="button">周边配套</button>
            <button type="button">周边土拍</button>
          </div>
        </article>
      `).join("");
    }

    function cycleFilter(key) {
      const options = filterOptions[key];
      const index = options.indexOf(filters[key]);
      filters[key] = options[(index + 1) % options.length];
      filterLabels[key].textContent = filters[key];
      renderLandList();
    }

    document.querySelectorAll("[data-ranking-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        activeRanking = button.dataset.rankingTab;
        document.querySelectorAll("[data-ranking-tab]").forEach((tab) => {
          tab.classList.toggle("is-active", tab === button);
        });
        renderRanking();
      });
    });

    document.querySelectorAll("[data-filter-key]").forEach((button) => {
      button.addEventListener("click", () => cycleFilter(button.dataset.filterKey));
    });

    searchInput.addEventListener("input", renderLandList);

    renderStats();
    renderRanking();
    renderBatches();
    renderLandList();
  </script>
</body>
</html>
