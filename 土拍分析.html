<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>土拍分析</title>
  <style>
    :root {
      --brand: #fd5d00;
      --brand-2: #ff8f2e;
      --brand-deep: #c74600;
      --red: #ff3b30;
      --text: #303133;
      --text-2: #606266;
      --muted: #909399;
      --line: #e4e7ed;
      --bg: #f3f5f6;
      --surface: #ffffff;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background: var(--bg);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 390px);
      min-height: 100vh;
      padding-bottom: calc(18px + var(--safe-bottom));
      background:
        radial-gradient(circle at right top, rgba(255, 255, 255, 0.16), transparent 28%),
        linear-gradient(180deg, #fd5d00 0, #ff8124 280px, var(--bg) 280px);
      overflow-x: hidden;
    }

    .statusbar {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 21px 6px;
      color: #fff;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
    }

    .statusbar__right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      display: grid;
      grid-template-columns: repeat(4, 3px);
      align-items: end;
      gap: 2px;
      height: 12px;
    }

    .signal i {
      width: 3px;
      border-radius: 2px;
      background: currentColor;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 9px; }
    .signal i:nth-child(4) { height: 12px; }

    .battery {
      position: relative;
      width: 21px;
      height: 11px;
      border: 1.4px solid currentColor;
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -3px;
      top: 3px;
      width: 2px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .hero {
      padding: 6px 16px 16px;
      color: #fff;
    }

    .hero-top {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .hero-back {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .hero-back svg,
    .more-pill svg,
    .batch-cta svg,
    .filter-chip svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 700;
    }

    .more-pill {
      min-width: 86px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(161, 55, 0, 0.3);
      color: rgba(255, 255, 255, 0.9);
    }

    .more-pill__dots {
      display: flex;
      gap: 5px;
    }

    .more-pill__dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .search-card,
    .section,
    .batch-shell,
    .land-card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    .search-card {
      margin-top: 18px;
      padding: 17px 16px;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--muted);
    }

    .search-field svg {
      width: 22px;
      height: 22px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      font-size: 14px;
      background: transparent;
    }

    .search-field input::placeholder {
      color: #a4abb4;
    }

    .content {
      display: grid;
      gap: 12px;
      width: 100%;
      min-width: 0;
      padding: 0 14px 18px;
    }

    .section {
      padding: 14px 12px;
    }

    .ranking {
      padding: 0;
      overflow: hidden;
    }

    .ranking-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 10px 0;
      background: linear-gradient(180deg, #fff4e7 0, #fff9f4 100%);
    }

    .ranking-tab {
      min-height: 46px;
      padding: 0 10px;
      border-radius: 14px 14px 0 0;
      color: #ad6a33;
      font-size: 13px;
      font-weight: 800;
    }

    .ranking-tab.is-active {
      color: #b65b1c;
      background: linear-gradient(180deg, #fffdf8 0, #fff4e6 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 167, 76, 0.2);
    }

    .ranking-panel {
      padding: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-head strong {
      color: #171a1f;
      font-size: 15px;
      font-weight: 800;
    }

    .section-link {
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
    }

    .ranking-list {
      display: grid;
      gap: 12px;
    }

    .ranking-row {
      width: 100%;
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 3px 2px;
      border-radius: 8px;
      text-align: left;
      transition: background 0.18s ease;
    }

    .ranking-row:active {
      background: #fff5ed;
    }

    .medal {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(145deg, #fff4d9, #ffd38f);
      color: #b97923;
      font-size: 13px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(191, 129, 45, 0.16);
    }

    .medal.silver {
      background: linear-gradient(145deg, #f1f4fb, #d7ddea);
      color: #73809a;
    }

    .medal.bronze {
      background: linear-gradient(145deg, #fff0e6, #f6c6af);
      color: #b46b4b;
    }

    .ranking-main {
      min-width: 0;
    }

    .ranking-main strong,
    .ranking-main span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-main strong {
      color: #171a1f;
      font-size: 13px;
      font-weight: 800;
    }

    .ranking-main span {
      margin-top: 4px;
      color: var(--text-2);
      font-size: 12px;
    }

    .ranking-value {
      color: var(--red);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .ranking-detail-view {
      min-height: calc(100vh - 34px);
      padding-bottom: calc(20px + var(--safe-bottom));
      background: var(--bg);
    }

    .ranking-detail-hero {
      padding: 8px 16px 28px;
      color: #fff;
      background:
        radial-gradient(circle at 90% 6%, rgba(255, 255, 255, 0.22), transparent 30%),
        linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
    }

    .ranking-detail-nav {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      min-height: 44px;
    }

    .ranking-detail-back {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #fff;
      background: rgba(139, 51, 0, 0.18);
    }

    .ranking-detail-back svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ranking-detail-nav h2 {
      margin: 0;
      font-size: 18px;
      text-align: center;
    }

    .ranking-detail-nav__spacer {
      width: 40px;
      height: 40px;
    }

    .ranking-detail-heading {
      margin-top: 14px;
    }

    .ranking-detail-heading h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.35;
      font-weight: 900;
    }

    .ranking-detail-content {
      display: grid;
      gap: 12px;
      padding: 0 14px;
      margin-top: -14px;
      position: relative;
      z-index: 1;
    }

    .ranking-detail-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      padding: 5px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.09);
    }

    .ranking-detail-tab {
      min-height: 40px;
      padding: 0 5px;
      border-radius: 9px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 800;
    }

    .ranking-detail-tab.is-active {
      color: var(--brand);
      background: #fff1e7;
    }

    .ranking-detail-list {
      display: grid;
      gap: 10px;
    }

    .leaderboard-card {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 86px;
      padding: 12px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(16, 24, 40, 0.055);
    }

    .leaderboard-rank {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #7d8795;
      background: #f1f3f6;
      font-size: 13px;
      font-weight: 900;
    }

    .leaderboard-card:nth-child(1) .leaderboard-rank {
      color: #aa6818;
      background: linear-gradient(145deg, #fff3d4, #ffd083);
    }

    .leaderboard-card:nth-child(2) .leaderboard-rank {
      color: #6d7b93;
      background: linear-gradient(145deg, #f3f6fb, #d9dfeb);
    }

    .leaderboard-card:nth-child(3) .leaderboard-rank {
      color: #a96040;
      background: linear-gradient(145deg, #fff0e6, #f5c4ad);
    }

    .leaderboard-main {
      min-width: 0;
    }

    .leaderboard-main strong,
    .leaderboard-main span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaderboard-main strong {
      color: #242a31;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
    }

    .leaderboard-main span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .leaderboard-value {
      color: var(--brand);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
      text-align: right;
    }

    .leaderboard-value small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 500;
    }

    .batch-shell {
      padding: 12px;
    }

    .status-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(58px, 1fr));
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status-tabs::-webkit-scrollbar {
      display: none;
    }

    .status-tab {
      min-width: 58px;
      min-height: 54px;
      padding: 7px 6px 6px;
      border-radius: 9px;
      color: #53616d;
      background: #f1f3f5;
      white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(216, 223, 226, 0.9);
      transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .status-tab strong,
    .status-tab span {
      display: block;
    }

    .status-tab strong {
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
    }

    .status-tab span {
      margin-top: 4px;
      color: #8a939e;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
    }

    .status-tab.is-active {
      color: var(--brand);
      background: #fff1e7;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.34);
    }

    .status-tab.is-active span {
      color: var(--brand);
    }

    .batch-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      background: linear-gradient(90deg, #fff5ed 0, #fff0e5 100%);
    }

    .batch-summary__meta {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 8px 14px;
      color: #4e5b67;
      font-size: 14px;
      font-weight: 700;
    }

    .batch-summary__meta strong {
      color: var(--brand);
      font-size: 16px;
      font-weight: 900;
    }

    .batch-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-width: 0;
      gap: 8px;
    }

    .filter-chip {
      min-width: 0;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 10px;
      color: #5e6874;
      background: #fff;
      box-shadow: 0 4px 16px rgba(16, 24, 40, 0.06);
      padding: 0 7px;
      font-size: 12px;
      font-weight: 700;
      transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .filter-chip.is-active,
    .filter-chip.is-open {
      color: var(--brand);
      background: #fff7f1;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.26), 0 4px 16px rgba(16, 24, 40, 0.06);
    }

    .filter-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-chip svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      transition: transform 0.18s ease;
    }

    .filter-chip.is-open svg {
      transform: rotate(180deg);
    }

    body.is-filter-open {
      overflow: hidden;
    }

    .filter-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .filter-modal[hidden] {
      display: none;
    }

    .filter-modal__backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(17, 24, 39, 0.48);
      backdrop-filter: blur(1px);
    }

    .filter-sheet {
      position: relative;
      z-index: 1;
      width: min(100%, 390px);
      max-height: min(72vh, 560px);
      overflow-y: auto;
      padding: 18px 16px calc(14px + var(--safe-bottom));
      border-radius: 18px 18px 0 0;
      background: var(--surface);
      box-shadow: 0 -12px 36px rgba(15, 23, 42, 0.18);
      animation: filter-sheet-in 0.22s ease-out;
    }

    @keyframes filter-sheet-in {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .filter-sheet__handle {
      width: 36px;
      height: 4px;
      margin: -8px auto 12px;
      border-radius: 999px;
      background: #d8dce2;
    }

    .filter-sheet__head {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 36px;
      align-items: center;
    }

    .filter-sheet__head h2 {
      margin: 0;
      color: #20252c;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 800;
      text-align: center;
    }

    .filter-sheet__close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #66707c;
      background: #f3f5f7;
    }

    .filter-sheet__close svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .filter-sheet__hint {
      margin: 7px 0 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .filter-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .filter-options.is-list {
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .filter-option {
      position: relative;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 9px;
      color: #4d5764;
      background: #f4f6f8;
      box-shadow: inset 0 0 0 1px transparent;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .filter-options.is-list .filter-option {
      min-height: 48px;
      padding: 0 42px 0 14px;
      text-align: left;
    }

    .filter-option.is-selected {
      color: var(--brand);
      background: #fff3e9;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.34);
    }

    .filter-options.is-list .filter-option.is-selected::after {
      content: "";
      position: absolute;
      right: 17px;
      top: 15px;
      width: 13px;
      height: 7px;
      border-left: 2px solid var(--brand);
      border-bottom: 2px solid var(--brand);
      transform: rotate(-45deg);
    }

    .filter-sheet__actions {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .filter-sheet__reset,
    .filter-sheet__confirm {
      min-height: 46px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .filter-sheet__reset {
      color: #5d6672;
      background: #f1f3f5;
    }

    .filter-sheet__confirm {
      color: #fff;
      background: linear-gradient(135deg, var(--brand-2), var(--brand));
      box-shadow: 0 7px 16px rgba(253, 93, 0, 0.24);
    }

    .land-list {
      display: grid;
      min-width: 0;
      gap: 12px;
    }

    .land-card {
      position: relative;
      overflow: hidden;
      padding: 13px 12px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .land-card:active {
      transform: scale(0.985);
      box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08);
    }

    .land-card::after {
      content: "";
      position: absolute;
      right: 13px;
      bottom: 16px;
      width: 7px;
      height: 7px;
      border-top: 1.8px solid #b1b7c0;
      border-right: 1.8px solid #b1b7c0;
      transform: rotate(45deg);
    }

    .land-title {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      gap: 8px;
    }

    .status-tag {
      min-width: 52px;
      min-height: 28px;
      display: inline-grid;
      place-items: center;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      flex: none;
    }

    .status-wait {
      color: var(--brand);
      background: #fff5ed;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.25);
    }

    .status-sold {
      color: #fd5d00;
      background: #fff4ec;
      box-shadow: inset 0 0 0 1px rgba(253, 93, 0, 0.24);
    }

    .status-failed {
      color: #6e7c90;
      background: #f2f5f8;
      box-shadow: inset 0 0 0 1px rgba(110, 124, 144, 0.2);
    }

    .land-title h3 {
      min-width: 0;
      margin: 0;
      color: #111827;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .price-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      margin-top: 10px;
    }

    .price-line {
      color: #171a1f;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .price-line strong {
      color: var(--brand);
      font-size: 17px;
      font-weight: 900;
    }

    .land-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: 0;
      gap: 7px 8px;
      margin-top: 12px;

      sort: { title: "排序方式", hint: "选择地块列表的排序规则", defaultValue: "最新发布", defaultLabel: "最新发布", chipLabel: "排序" }
    };

    const filterLabels = {
      district: document.getElementById("districtLabel"),
      usage: document.getElementById("usageLabel"),
      sort: document.getElementById("sortLabel")
    };

    const rankingList = document.getElementById("rankingList");
    const rankingTitle = document.getElementById("rankingTitle");
    const rankingDetailOpen = document.getElementById("rankingDetailOpen");
    const rankingDetailView = document.getElementById("rankingDetailView");
    const rankingDetailBack = document.getElementById("rankingDetailBack");
    const rankingDetailTitle = document.getElementById("rankingDetailTitle");
    const rankingDetailList = document.getElementById("rankingDetailList");
    const statusTabs = document.getElementById("statusTabs");
    const landList = document.getElementById("landList");
    const searchInput = document.getElementById("searchInput");
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const detailBack = document.getElementById("detailBack");
    const detailTitle = document.getElementById("detailTitle");
    const dealHighlight = document.getElementById("dealHighlight");
    const basicInfo = document.getElementById("basicInfo");
    const dealInfo = document.getElementById("dealInfo");
    const filterModal = document.getElementById("filterModal");
    const filterBackdrop = document.getElementById("filterBackdrop");
    const filterSheetTitle = document.getElementById("filterSheetTitle");
    const filterSheetHint = document.getElementById("filterSheetHint");
    const filterSheetOptions = document.getElementById("filterSheetOptions");
    const filterSheetClose = document.getElementById("filterSheetClose");
    const filterSheetReset = document.getElementById("filterSheetReset");
    const filterSheetConfirm = document.getElementById("filterSheetConfirm");
    const filterButtons = [...document.querySelectorAll("[data-filter-key]")];

    let activeRanking = "floor";
    let activeStatus = "全部";
    let filters = {
      district: "区域",
      usage: "用途",
      sort: "最新发布"
    };
    let currentDetailRecord = null;
    let listScrollTop = 0;
    let activeFilterKey = null;
    let draftFilterValue = null;
    let lastFilterTrigger = null;

    function renderRanking() {
      const current = rankingData[activeRanking];
      rankingTitle.textContent = current.title;
      rankingList.innerHTML = current.rows.slice(0, 3).map((row, index) => {
        const medalClass = index === 1 ? "silver" : index === 2 ? "bronze" : "";
        const mainLabel = row.name;
        const subLabel = `${row.district} · ${row.company}`;
        return `
          <button class="ranking-row" type="button" data-open-ranking="${activeRanking}" aria-label="查看${current.title}完整榜单">
            <span class="medal ${medalClass}">${index + 1}</span>
            <span class="ranking-main">
              <strong>${mainLabel}</strong>
              <span>${subLabel}</span>
            </span>
            <span class="ranking-value">${row.value}</span>
          </button>
        `;
      }).join("");

      rankingList.querySelectorAll("[data-open-ranking]").forEach((button) => {
        button.addEventListener("click", () => openRankingDetail(button.dataset.openRanking));
      });
    }

    function syncRankingTabs() {
      document.querySelectorAll("[data-ranking-tab]").forEach((tab) => {
        tab.classList.toggle("is-active", tab.dataset.rankingTab === activeRanking);
      });
      document.querySelectorAll("[data-ranking-detail-tab]").forEach((tab) => {
        tab.classList.toggle("is-active", tab.dataset.rankingDetailTab === activeRanking);
      });
    }

    function renderRankingDetail() {
      const current = rankingData[activeRanking];
      const valueLabel = activeRanking === "floor" ? "成交楼面价" : "成交溢价率";
      rankingDetailTitle.textContent = current.title;
      rankingDetailList.innerHTML = current.rows.map((row, index) => {
        const primary = row.name;
        const secondary = `${row.district} · ${row.company}`;
        return `
          <article class="leaderboard-card">
            <span class="leaderboard-rank">${index + 1}</span>
            <span class="leaderboard-main">
              <strong>${primary}</strong>
              <span>${secondary}</span>
              <span>${row.meta}</span>
            </span>
            <span class="leaderboard-value">${row.value}<small>${valueLabel}</small></span>
          </article>
        `;
      }).join("");
      syncRankingTabs();
    }

    function openRankingDetail(type = activeRanking) {
      listScrollTop = window.scrollY;
      activeRanking = type;
      renderRanking();
      renderRankingDetail();
      listView.hidden = true;
      detailView.hidden = true;
      rankingDetailView.hidden = false;
      document.title = `${rankingData[activeRanking].title} - 土拍分析`;
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function closeRankingDetail() {
      rankingDetailView.hidden = true;
      listView.hidden = false;
      document.title = "土拍分析";
      requestAnimationFrame(() => window.scrollTo({ top: listScrollTop, behavior: "auto" }));
    }

    function renderStatusTabs() {
      statusTabs.innerHTML = statusOptions.map((status) => `
        <button class="status-tab ${status.label === activeStatus ? "is-active" : ""}" type="button" data-land-status="${status.label}" aria-pressed="${status.label === activeStatus}">
          <strong>${status.label}</strong>
          <span>${status.count}</span>
        </button>
      `).join("");

      statusTabs.querySelectorAll("[data-land-status]").forEach((button) => {
        button.addEventListener("click", () => {
          activeStatus = button.dataset.landStatus;
          renderStatusTabs();
          renderLandList();
        });
      });
    }

    function getFilteredRecords() {
      let rows = landRecords.filter((row) => activeStatus === "全部" || row.status === activeStatus);
      const keyword = searchInput.value.trim();
      if (keyword) {
        rows = rows.filter((row) => `${row.title}${row.district}${row.company}${row.zone}`.includes(keyword));
      }
      if (filters.district !== "区域") rows = rows.filter((row) => row.district === filters.district);
      if (filters.usage !== "用途") rows = rows.filter((row) => row.usage === filters.usage);

      rows = [...rows];
      if (filters.sort === "楼面价从高到低") rows.sort((a, b) => b.floorPrice - a.floorPrice);
      else if (filters.sort === "地块面积从大到小") rows.sort((a, b) => parseFloat(b.area) - parseFloat(a.area));
      else rows.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
      return rows;
    }

    function getStatusClass(status) {
      if (status === "待出让") return "status-wait";
      if (status === "成交") return "status-sold";
      return "status-failed";
    }

    function getDetailData(row) {
      return {
        ...row,
        landNo: row.landNo || `CD${row.district.slice(0, 1).toUpperCase()}-${row.publishDate.replaceAll("-", "")}`,
        location: row.location || row.title.replace(/\d+(?:\.\d+)?亩$/, ""),
        landTerm: row.landTerm || (row.usage === "商办" ? "40年" : "70年"),
        landNature: row.landNature || (row.usage === "住宅" ? "二类城镇住宅用地" : `${row.usage}用地`),
        landUsage: row.landUsage || `${row.usage}用地`,
        greenRate: row.greenRate || "不小于30%",
        buildingDensity: row.buildingDensity || "不大于30%",
        buildingHeight: row.buildingHeight || "建筑高度按规划条件执行",
        totalPrice: row.totalPrice || "-",
        pricePerMu: row.pricePerMu || "-",
        premiumRate: row.premiumRate || (row.status === "成交" ? "0.00%" : "—")
      };
    }

    function infoItem(label, value, wide = false, brand = false) {
      return `
        <div class="info-item ${wide ? "is-wide" : ""}">
          <dt>${label}</dt>
          <dd class="${brand ? "is-brand" : ""}">${value || "—"}</dd>
        </div>
      `;
    }

    function formatFloorPrice(value) {
      if (value === null || value === undefined || value === "") return "—";
      const price = Number(value);
      return Number.isFinite(price) ? price.toLocaleString("zh-CN") : "—";
    }

    function renderDetail(row) {
      currentDetailRecord = getDetailData(row);
      const detail = currentDetailRecord;
      const dealStatus = detail.status === "成交" ? "已成交" : detail.status === "流拍" ? "已流拍" : detail.status === "终止" ? "已终止" : "待出让";

      detailTitle.textContent = detail.title;

      dealHighlight.innerHTML = `
        <div class="deal-highlight__item"><strong>${formatFloorPrice(detail.floorPrice)}</strong><span>成交楼面价(元/㎡)</span></div>
        <div class="deal-highlight__item"><strong>${String(detail.totalPrice).replace("万元", "")}</strong><span>成交总价(万元)</span></div>
        <div class="deal-highlight__item"><strong>${detail.premiumRate}</strong><span>溢价率</span></div>
      `;

      basicInfo.innerHTML = [
        infoItem("土地宗号", detail.landNo, true),
        infoItem("宗地位置", detail.location, true),
        infoItem("净用地面积(亩)", detail.area.replace("亩", "")),
        infoItem("最大容积率", detail.volumeRate),
        infoItem("用途年限(年)", detail.landTerm.replace("年", "")),
        infoItem("用地使用性质", detail.landNature),
        infoItem("土地用途", detail.landUsage),
        infoItem("绿地率", detail.greenRate),
        infoItem("建筑密度", detail.buildingDensity),
        infoItem("建筑高度", detail.buildingHeight, true)
      ].join("");

      dealInfo.innerHTML = [
        infoItem("交易状况", dealStatus),
        infoItem("发布时间", detail.publishDate),
        infoItem("成交时间", detail.dealDate || "-"),
        infoItem("竞得方", detail.company, true),
        infoItem("成交总价(万元)", String(detail.totalPrice).replace("万元", ""), false, true),
        infoItem("成交价(万/亩)", String(detail.pricePerMu).replace("万元/亩", "")),
        infoItem("起拍楼面价(元/平方米)", formatFloorPrice(detail.floorPrice)),
        infoItem("成交楼面地价(元/平方米)", formatFloorPrice(detail.floorPrice), true),
        infoItem("溢价率", detail.premiumRate, false, true)
      ].join("");

    }

    function openDetail(row) {
      listScrollTop = window.scrollY;
      renderDetail(row);
      listView.hidden = true;
      detailView.hidden = false;
      document.title = `${row.title} - 土拍详情`;
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function closeDetail() {
      detailView.hidden = true;
      listView.hidden = false;
      currentDetailRecord = null;
      document.title = "土拍分析";
      requestAnimationFrame(() => window.scrollTo({ top: listScrollTop, behavior: "auto" }));
    }

    function renderLandList() {
      const rows = getFilteredRecords();
      if (!rows.length) {
        landList.innerHTML = '<div class="empty">当前筛选条件下暂无匹配地块</div>';
        return;
      }
      landList.innerHTML = rows.map((row) => {
        const detail = getDetailData(row);
        const displayTitle = row.title.replace(/\d+(?:\.\d+)?亩$/, "");
        const dealPrice = row.status === "成交"
          ? `<div class="price-line">成交楼面价：<strong>${formatFloorPrice(detail.floorPrice)}</strong>（元/㎡）</div>`
          : "";
        return `
        <article class="land-card" data-land-id="${row.id}" role="button" tabindex="0" aria-label="查看${displayTitle}详情">
          <div class="land-title">
            <span class="status-tag ${getStatusClass(row.status)}">${row.status}</span>
            <h3>${displayTitle}</h3>
          </div>
          <div class="price-group">
            <div class="price-line">起拍楼面价：<strong>${formatFloorPrice(row.floorPrice)}</strong>（元/㎡）</div>
            ${dealPrice}
          </div>
          <div class="land-meta">
            <span>区域：${row.zone}</span>
            <span>发布时间：${row.publishDate}</span>
            <span>成交时间：${row.dealDate || "-"}</span>
            <span>面积：${row.area}</span>
            <span>容积率：${row.volumeRate}</span>
          </div>
        </article>
      `;
      }).join("");

      landList.querySelectorAll("[data-land-id]").forEach((card) => {
        const openCard = () => {
          const row = landRecords.find((item) => item.id === card.dataset.landId);
          if (row) openDetail(row);
        };
        card.addEventListener("click", openCard);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCard();
          }
        });
      });
    }

    function getFilterOptionLabel(key, value) {
      return value === filterConfig[key].defaultValue ? filterConfig[key].defaultLabel : value;
    }

    function syncFilterChips() {
      filterButtons.forEach((button) => {
        const key = button.dataset.filterKey;
        const isActive = filters[key] !== filterConfig[key].defaultValue;
        filterLabels[key].textContent = isActive ? filters[key] : filterConfig[key].chipLabel;
        button.classList.toggle("is-active", isActive);
        button.classList.toggle("is-open", activeFilterKey === key && !filterModal.hidden);
        button.setAttribute("aria-expanded", String(activeFilterKey === key && !filterModal.hidden));
      });
    }

    function renderFilterOptions() {
      const options = filterOptions[activeFilterKey];
      filterSheetOptions.classList.toggle("is-list", activeFilterKey === "sort");
      filterSheetOptions.innerHTML = options.map((value) => `
        <button class="filter-option ${value === draftFilterValue ? "is-selected" : ""}" type="button" role="option" aria-selected="${value === draftFilterValue}" data-filter-value="${value}">
          ${getFilterOptionLabel(activeFilterKey, value)}
        </button>
      `).join("");
    }

    function openFilterSheet(key, trigger) {
      const config = filterConfig[key];
      activeFilterKey = key;
      draftFilterValue = filters[key];
      lastFilterTrigger = trigger;
      filterSheetTitle.textContent = config.title;
      filterSheetHint.textContent = config.hint;
      renderFilterOptions();
      filterModal.hidden = false;
      document.body.classList.add("is-filter-open");
      syncFilterChips();
      requestAnimationFrame(() => filterSheetClose.focus());
    }

    function closeFilterSheet(restoreFocus = true) {
      filterModal.hidden = true;
      document.body.classList.remove("is-filter-open");
      activeFilterKey = null;
      draftFilterValue = null;
      syncFilterChips();
      if (restoreFocus && lastFilterTrigger) lastFilterTrigger.focus();
    }

    function applyFilterSheet() {
      if (!activeFilterKey) return;
      filters[activeFilterKey] = draftFilterValue;
      syncFilterChips();
      renderLandList();
      closeFilterSheet();
    }

    document.querySelectorAll("[data-ranking-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        activeRanking = button.dataset.rankingTab;
        syncRankingTabs();
        renderRanking();
      });
    });

    document.querySelectorAll("[data-ranking-detail-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        activeRanking = button.dataset.rankingDetailTab;
        renderRanking();
        renderRankingDetail();
      });
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => openFilterSheet(button.dataset.filterKey, button));
    });

    filterSheetOptions.addEventListener("click", (event) => {
      const option = event.target.closest("[data-filter-value]");
      if (!option) return;
      draftFilterValue = option.dataset.filterValue;
      renderFilterOptions();
    });

    filterSheetReset.addEventListener("click", () => {
      if (!activeFilterKey) return;
      draftFilterValue = filterConfig[activeFilterKey].defaultValue;
      renderFilterOptions();
    });

    filterSheetConfirm.addEventListener("click", applyFilterSheet);
    filterSheetClose.addEventListener("click", () => closeFilterSheet());
    filterBackdrop.addEventListener("click", () => closeFilterSheet());
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !filterModal.hidden) closeFilterSheet();
    });

    searchInput.addEventListener("input", renderLandList);
    detailBack.addEventListener("click", closeDetail);
    rankingDetailOpen.addEventListener("click", () => openRankingDetail(activeRanking));
    rankingDetailBack.addEventListener("click", closeRankingDetail);

    renderRanking();
    renderStatusTabs();
    syncFilterChips();
    renderLandList();

    const requestedLandId = new URLSearchParams(window.location.search).get("land");
    const requestedRankingType = new URLSearchParams(window.location.search).get("ranking");
    const requestedLand = landRecords.find((row) => row.id === requestedLandId);
    if (requestedLand) openDetail(requestedLand);
    else if (rankingData[requestedRankingType]) openRankingDetail(requestedRankingType);
  </script>
</body>
</html>
