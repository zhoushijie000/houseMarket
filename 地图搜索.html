<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>地图搜索</title>
  <style>
    :root {
      --brand: #f1702b;
      --brand-dark: #df5f1d;
      --price: #e9363f;
      --text-main: #242424;
      --text-sub: #62656b;
      --text-light: #a8abb2;
      --line: #edf0f4;
      --map-bg: #f3f2ee;
      --road: #ffffff;
      --road-edge: #d9dde2;
      --road-main: #f4d37d;
      --water: #dcecf6;
      --park: #d7f3cd;
      --metro: #298fc3;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5f6f8;
      color: var(--text-main);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      position: relative;
      width: min(100vw, 425px);
      height: 100vh;
      min-height: 760px;
      overflow: hidden;
      background: var(--map-bg);
    }

    .statusbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 8px 20px 0 21px;
      background: #fff;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .statusbar__icons {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #202124;
      font-size: 12px;
      font-weight: 800;
    }

    .statusbar__signal {
      display: grid;
      grid-template-columns: repeat(4, 3px);
      align-items: end;
      gap: 2px;
      height: 16px;
    }

    .statusbar__signal i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: #202124;
    }

    .statusbar__signal i:nth-child(1) { height: 5px; }
    .statusbar__signal i:nth-child(2) { height: 8px; }
    .statusbar__signal i:nth-child(3) { height: 11px; }
    .statusbar__signal i:nth-child(4) { height: 15px; }

    .statusbar__battery {
      width: 25px;
      height: 13px;
      border-radius: 3px;
      background: #202124;
      box-shadow: 3px 3px 0 -2px #202124;
    }

    .statusbar__wifi {
      display: block;
      width: 18px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 1.7;
    }

    .header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      align-items: center;
      height: 44px;
      padding: 0 6px;
      background: #fff;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .back-button::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 15px;
      width: 11px;
      height: 11px;
      border-left: 2px solid #101114;
      border-bottom: 2px solid #101114;
      transform: rotate(45deg);
      border-radius: 1px;
    }

    .title {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .mini-actions {
      justify-self: end;
      display: grid;
      grid-template-columns: 1fr 1px 34px;
      align-items: center;
      width: 88px;
      height: 34px;
      padding: 0 5px 0 11px;
      border: 1px solid #eef0f3;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
    }

    .mini-actions__dots {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .mini-actions__dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #141414;
    }

    .mini-actions__line {
      width: 1px;
      height: 20px;
      background: #eef0f3;
    }

    .mini-actions__circle {
      justify-self: center;
      width: 18px;
      height: 18px;
      border: 2px solid #151515;
      border-radius: 50%;
      position: relative;
    }

    .mini-actions__circle::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #151515;
    }

    .search-panel {
      position: relative;
      z-index: 18;
      display: grid;
      grid-template-columns: 111px 1fr;
      align-items: center;
      gap: 9px;
      padding: 11px 19px 14px 32px;
      background: #fff;
    }

    .area-select {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 44px;
      color: #696d73;
      font-size: 18px;
      font-weight: 400;
    }

    .area-select::after {
      content: "";
      width: 10px;
      height: 10px;
      border-right: 2px solid #9ca0a6;
      border-bottom: 2px solid #9ca0a6;
      transform: rotate(45deg) translateY(-4px);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 13px;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #eef0f4;
      border-radius: 13px;
      background: #fff;
      color: #b2b5bc;
      box-shadow: 0 2px 8px rgba(26, 36, 52, 0.03);
    }

    .search-icon {
      width: 21px;
      height: 21px;
      border: 2px solid #c9ccd2;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      right: -7px;
      bottom: -5px;
      width: 9px;
      height: 2px;
      border-radius: 999px;
      background: #c9ccd2;
      transform: rotate(45deg);
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: none;
      color: #3a3d42;
      font-size: 18px;
      background: transparent;
    }

    .search-box input::placeholder {
      color: #b2b5bc;
    }

    .summary {
      position: relative;
      z-index: 18;
      margin: 0;
      padding: 11px 19px 20px;
      border-radius: 0 0 16px 16px;
      background: #fff;
      font-size: 22px;
      line-height: 1.45;
      font-weight: 400;
      letter-spacing: -0.6px;
      box-shadow: 0 5px 12px rgba(31, 41, 55, 0.04);
    }

    .summary strong {
      color: var(--brand);
      font-weight: 500;
    }

    .map-stage {
      position: absolute;
      inset: 185px 0 0;
      overflow: hidden;
      background: var(--map-bg);
      touch-action: manipulation;
    }

    .map-canvas {
      position: absolute;
      inset: 0;
      transform-origin: center;
    }

    .park,
    .water,
    .road,
    .road-main,
    .metro-line,
    .map-label,
    .poi,
    .subway-pill {
      position: absolute;
    }

    .park {
      background: var(--park);
      clip-path: polygon(0 0, 100% 9%, 84% 94%, 12% 100%);
    }

    .park--art {
      left: -18px;
      top: 9px;
      width: 136px;
      height: 107px;
    }

    .park--new {
      left: 130px;
      top: 307px;
      width: 82px;
      height: 115px;
      transform: rotate(-20deg);
    }

    .water {
      width: 70px;
      height: 120px;
      border-radius: 40% 60% 50% 50%;
      background: var(--water);
      opacity: 0.9;
    }

    .water--one {
      left: 240px;
      top: 88px;
      transform: rotate(-22deg);
    }

    .water--two {
      left: 245px;
      top: 365px;
      transform: rotate(68deg);
    }

    .road {
      height: 13px;
      border: 1px solid var(--road-edge);
      border-radius: 999px;
      background: var(--road);
      transform-origin: left center;
    }

    .road-main {
      height: 17px;
      border: 1px solid #efc067;
      border-radius: 999px;
      background: var(--road-main);
      transform-origin: left center;
    }

    .metro-line {
      height: 4px;
      border-radius: 999px;
      background: var(--metro);
      opacity: 0.78;
      transform-origin: left center;
    }

    .map-label {
      color: #63666a;
      font-size: 17px;
      line-height: 1.12;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.84);
      white-space: nowrap;
      transform-origin: center;
    }

    .map-label--small {
      font-size: 15px;
    }

    .map-label--green {
      color: #2b7132;
      font-weight: 500;
    }

    .poi {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #2f3338;
      font-size: 17px;
      white-space: nowrap;
    }

    .poi::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6aa0c8;
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.6);
    }

    .poi--park::before {
      background: #51aa45;
    }

    .poi--shop::before {
      background: #e7a23b;
    }

    .subway-pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: #3a9de7;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }

    .estate-marker {
      position: absolute;
      z-index: 5;
      max-width: 184px;
      padding: 8px 13px 9px;
      border-radius: 15px;
      background: linear-gradient(180deg, #f27b32 0%, #ef651f 100%);
      color: #fff;
      font-size: 17px;
      line-height: 1.05;
      white-space: nowrap;
      box-shadow: 0 4px 9px rgba(239, 97, 31, 0.22);
      transform: translate(-50%, -100%);
    }

    .estate-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 15px;
      height: 15px;
      background: #ef651f;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 0 0 3px 0;
    }

    .estate-marker.is-active {
      z-index: 7;
      background: linear-gradient(180deg, #ec6f2c 0%, #e95718 100%);
      box-shadow: 0 8px 16px rgba(227, 85, 21, 0.3);
    }

    .estate-marker--stack {
      display: grid;
      gap: 9px;
      padding: 9px 15px;
      border-radius: 16px;
    }

    .estate-marker--stack span {
      display: block;
    }

    .sheet {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 6px 12px calc(10px + var(--safe-bottom));
      border-radius: 16px 16px 0 0;
      background: #fff;
      box-shadow: 0 -8px 24px rgba(31, 41, 55, 0.08);
      transform: translateY(0);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .sheet.is-hidden {
      transform: translateY(calc(100% - 46px));
      box-shadow: 0 -3px 12px rgba(31, 41, 55, 0.04);
    }

    .sheet__bar {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 35px;
      padding: 0 2px;
    }

    .sheet__hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 29px;
      height: 5px;
      border-radius: 999px;
      background: #e5e5e5;
      transform: translate(-50%, -50%);
    }

    .sheet__close {
      justify-self: end;
      min-width: 56px;
      height: 27px;
      padding: 0 9px;
      border-radius: 999px;
      background: #f5f6f8;
      color: #777b82;
      font-size: 12px;
    }

    .estate-card {
      position: relative;
      display: grid;
      grid-template-columns: 136px 1fr 33px;
      gap: 14px;
      padding: 8px 0 17px;
      border-bottom: 1px solid #f2f3f5;
    }

    .estate-card__photo {
      width: 136px;
      height: 104px;
      overflow: hidden;
      border-radius: 4px;
      background: #d9dde3;
    }

    .estate-card__photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .estate-card__body {
      min-width: 0;
      padding-top: 2px;
    }

    .estate-card__title {
      margin: 0 0 7px;
      font-size: 21px;
      line-height: 1.1;
      font-weight: 800;
      color: #22252a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .estate-card__price {
      margin: 0 0 6px;
      color: var(--price);
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .estate-card__price small {
      font-size: 15px;
      font-weight: 700;
    }

    .estate-card__meta {
      margin: 0 0 13px;
      color: #3d4249;
      font-size: 17px;
      line-height: 1.12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .estate-card__tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .estate-card__tag {
      color: #a7abb2;
      font-size: 13px;
      line-height: 1;
    }

    .favorite {
      width: 26px;
      height: 26px;
      margin-top: 14px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .favorite svg {
      width: 23px;
      height: 23px;
      display: block;
      fill: none;
      stroke: #cfd2d6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-indicator {
      width: 178px;
      height: 5px;
      margin: 9px auto 0;
      border-radius: 999px;
      background: #b8b8b8;
    }

    @media (min-width: 431px) {
      body {
        padding: 16px 0;
      }

      .phone {
        height: calc(100vh - 32px);
        border-radius: 18px;
        box-shadow: 0 18px 44px rgba(30, 41, 59, 0.14);
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="地图搜索页面">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <div class="statusbar__icons">
        <span class="statusbar__signal"><i></i><i></i><i></i><i></i></span>
        <svg class="statusbar__wifi" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 4.5C5.3.6 12.7.6 17 4.5M4 7.8c2.8-2.5 7.2-2.5 10 0M7.2 11c1-1 2.6-1 3.6 0" /></svg>
        <span class="statusbar__battery"></span>
      </div>
    </div>

    <header class="header">
      <button class="back-button" id="mapBackButton" type="button" aria-label="返回"></button>
      <h1 class="title">地图搜索</h1>
      <div class="mini-actions" aria-hidden="true">
        <span class="mini-actions__dots"><i></i><i></i><i></i></span>
        <span class="mini-actions__line"></span>
        <span class="mini-actions__circle"></span>
      </div>
    </header>

    <section class="search-panel" aria-label="楼盘搜索">
      <button class="area-select" type="button">区域</button>
      <label class="search-box">
        <span class="search-icon"></span>
        <input type="search" placeholder="请输入您感兴趣的楼盘" aria-label="请输入您感兴趣的楼盘" />
      </label>
    </section>

    <p class="summary">截止目前全域成都在售楼盘<strong>443</strong>家</p>

    <section class="map-stage" id="mapStage" aria-label="楼盘地图">
      <div class="map-canvas">
        <span class="park park--art"></span>
        <span class="park park--new"></span>
        <span class="water water--one"></span>
        <span class="water water--two"></span>

        <i class="road-main" style="left:-27px;top:101px;width:278px;transform:rotate(-26deg);"></i>

        <i class="road-main" style="left:173px;top:451px;width:302px;transform:rotate(-56deg);"></i>
        <i class="road-main" style="left:236px;top:450px;width:288px;transform:rotate(17deg);"></i>
        <i class="road-main" style="left:-42px;top:624px;width:340px;transform:rotate(48deg);"></i>

        <i class="road" style="left:72px;top:148px;width:380px;transform:rotate(43deg);"></i>
        <i class="road" style="left:166px;top:22px;width:374px;transform:rotate(72deg);"></i>
        <i class="road" style="left:146px;top:89px;width:363px;transform:rotate(26deg);"></i>
        <i class="road" style="left:103px;top:129px;width:347px;transform:rotate(94deg);"></i>
        <i class="road" style="left:222px;top:2px;width:326px;transform:rotate(90deg);"></i>
        <i class="road" style="left:302px;top:33px;width:301px;transform:rotate(90deg);"></i>
        <i class="road" style="left:-8px;top:395px;width:442px;transform:rotate(-26deg);"></i>
        <i class="road" style="left:31px;top:486px;width:447px;transform:rotate(26deg);"></i>
        <i class="road" style="left:120px;top:334px;width:332px;transform:rotate(88deg);"></i>
        <i class="road" style="left:255px;top:271px;width:360px;transform:rotate(56deg);"></i>

        <i class="metro-line" style="left:127px;top:391px;width:262px;transform:rotate(-29deg);"></i>

        <span class="map-label map-label--green" style="left:73px;top:47px;">成都天府<br>艺术公园</span>

        <button class="estate-marker estate-marker--stack" type="button" data-estate-id="shanglin" style="left:37%;top:244px;">
          <span>金牛西派御府三批</span>

        </button>
      </div>
    </section>

    <section class="sheet" id="estateSheet" aria-label="楼盘信息卡片">
      <div class="sheet__bar">
        <span class="sheet__hint"></span>
        <button class="sheet__close" id="closeSheet" type="button">收起</button>
      </div>
      <article class="estate-card">
        <div class="estate-card__photo">
          <img id="estatePhoto" src="./assets/楼盘实景-社区楼景.png" alt="上林熙锦府1期效果图" />
        </div>
        <div class="estate-card__body">
          <h2 class="estate-card__title" id="estateTitle">上林熙锦府1期</h2>
          <p class="estate-card__price" id="estatePrice">29602~33699<small>元/㎡</small></p>
          <p class="estate-card__meta" id="estateMeta">金牛区/136.55~179.17㎡</p>
          <div class="estate-card__tags" id="estateTags">
            <span class="estate-card__tag">精装修</span>
            <span class="estate-card__tag">容积率3.16</span>
          </div>
        </div>
        <button class="favorite" type="button" aria-label="收藏楼盘">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.9c-2-2-5.1-1.9-7 .2L12 7l-1.8-1.9c-1.9-2.1-5-2.2-7-.2-2.2 2.2-2 5.8.3 8l7.1 6.8c.8.8 2.1.8 2.9 0l7.1-6.8c2.3-2.2 2.5-5.8.2-8Z" />
          </svg>
        </button>
      </article>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const estates = {
      shanglin: {
        title: "上林熙锦府1期",
        price: "29602~33699",
        meta: "金牛区/136.55~179.17㎡",
        photo: "./assets/楼盘实景-社区楼景.png",
        alt: "上林熙锦府1期效果图",
        tags: ["精装修", "容积率3.16"]
      },
      jinyu: {
        title: "能建·金誉颂玺",
        price: "31000~36500",
        meta: "金牛区/118~168㎡",
        photo: "./assets/楼盘实景-楼栋外立面.png",
        alt: "能建金誉颂玺效果图",
        tags: ["改善住宅", "近地铁"]
      }
    };

    const mapStage = document.getElementById("mapStage");
    const sheet = document.getElementById("estateSheet");
    const closeSheet = document.getElementById("closeSheet");
    const markerButtons = Array.from(document.querySelectorAll("[data-estate-id]"));
    const title = document.getElementById("estateTitle");
    const price = document.getElementById("estatePrice");
    const meta = document.getElementById("estateMeta");
    const photo = document.getElementById("estatePhoto");
    const tags = document.getElementById("estateTags");
    const mapBackButton = document.getElementById("mapBackButton");

    function openEstate(estateId) {
      const estate = estates[estateId] || estates.shanglin;
      title.textContent = estate.title;
      price.innerHTML = `${estate.price}<small>元/㎡</small>`;
      meta.textContent = estate.meta;
      photo.src = estate.photo;
      photo.alt = estate.alt;
      tags.innerHTML = estate.tags.map((tag) => `<span class="estate-card__tag">${tag}</span>`).join("");
      markerButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.estateId === estateId);
      });
      sheet.classList.remove("is-hidden");
      closeSheet.textContent = "收起";
    }

    function closeEstateSheet() {
      sheet.classList.add("is-hidden");
    }

    markerButtons.forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        openEstate(button.dataset.estateId);
      });
    });

    mapStage.addEventListener("click", (event) => {
      if (!event.target.closest("[data-estate-id]")) {
        closeEstateSheet();
      }
    });

    closeSheet.addEventListener("click", closeEstateSheet);

    mapBackButton.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./安家成都-首页-扫码.html";
      }
    });
  </script>
</body>
</html>
