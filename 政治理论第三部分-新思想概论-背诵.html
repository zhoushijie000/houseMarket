<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#a72d25" />
  <title>第三部分·新思想概论｜背诵版</title>
  <style>
    :root {
      --red: #a72d25;
      --red-deep: #7f1d1d;
      --red-soft: #f9e8e4;
      --gold: #c9973f;
      --ink: #27231f;
      --text: #433c35;
      --muted: #877d73;
      --line: #e9dfd2;
      --paper: #fffdf8;
      --bg: #f4efe7;
      --green: #287a59;
      --font-scale: 1;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-size: calc(16px * var(--font-scale));
    }
    button, input, select { font: inherit; }
    button { border: 0; color: inherit; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .app { width: min(100%, 480px); min-height: 100vh; margin: 0 auto; background: var(--bg); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 14px;
      color: #fff;
      background:
        radial-gradient(circle at 90% 0, rgba(255,255,255,.14), transparent 34%),
        linear-gradient(145deg, var(--red-deep), var(--red));
      box-shadow: 0 6px 20px rgba(80, 25, 20, .18);
    }
    .topbar__row { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 10px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: rgba(255,255,255,.12);
    }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .topbar__title { min-width: 0; }
    .topbar__title small, .topbar__title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar__title small { color: rgba(255,255,255,.7); font-size: 10px; letter-spacing: .12em; }
    .topbar__title strong { margin-top: 3px; font-size: 17px; }
    .font-tools { display: flex; gap: 5px; }
    .font-btn { min-width: 34px; height: 34px; border-radius: 10px; color: #fff; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 800; }

    .chapter-strip { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px -14px; padding: 0 16px 12px; scrollbar-width: none; }
    .chapter-strip::-webkit-scrollbar { display: none; }
    .chapter-chip { flex: none; min-height: 31px; padding: 0 12px; border-radius: 999px; color: rgba(255,255,255,.74); background: rgba(255,255,255,.09); font-size: 11px; white-space: nowrap; }
    .chapter-chip.is-active { color: var(--red-deep); background: #fff5e6; font-weight: 800; }

    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 14px 16px 12px; }
    .search-box { position: relative; }
    .search-box svg { position: absolute; left: 12px; top: 50%; width: 17px; height: 17px; fill: none; stroke: var(--muted); stroke-width: 2; transform: translateY(-50%); }
    .search-box input { width: 100%; height: 42px; padding: 0 12px 0 38px; border: 1px solid var(--line); border-radius: 12px; outline: 0; color: var(--ink); background: var(--paper); font-size: 12px; }
    .control-btn { min-width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 11px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: var(--paper); font-size: 11px; font-weight: 700; }
    .control-btn.is-active { color: var(--red); border-color: rgba(167,45,37,.28); background: var(--red-soft); }
    .control-btn.is-done { color: var(--green); border-color: rgba(40,122,89,.24); background: #eaf6f0; }
    .recall-float { position: fixed; right: max(16px, calc((100vw - 480px) / 2 + 16px)); bottom: calc(72px + var(--safe-bottom)); z-index: 19; min-width: 82px; height: 42px; padding: 0 14px; border: 1px solid rgba(167,45,37,.2); border-radius: 999px; color: #fff; background: var(--red); box-shadow: 0 10px 24px rgba(126, 35, 28, .22); font-size: 12px; font-weight: 800; }
    .recall-float.is-active { color: var(--red); background: #fff7f0; }

    .content { display: grid; gap: 12px; padding: 0 16px calc(92px + var(--safe-bottom)); }
    .knowledge-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 6px 18px rgba(69, 54, 39, .055); }
    .knowledge-card.is-filtered { display: none; }
    .card-head { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) 20px; align-items: center; gap: 10px; padding: 14px; text-align: left; }
    .card-index { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; color: var(--red); background: var(--red-soft); font-size: 11px; font-weight: 900; }
    .card-title { min-width: 0; color: var(--ink); font-size: 14px; line-height: 1.45; font-weight: 800; }
    .card-arrow { width: 8px; height: 8px; border-right: 2px solid #afa398; border-bottom: 2px solid #afa398; transform: rotate(45deg); transition: transform .2s ease; }
    .knowledge-card.is-collapsed .card-arrow { transform: rotate(-45deg); }
    .card-body { position: relative; display: grid; gap: 9px; padding: 0 14px 15px 58px; }
    .knowledge-card.is-collapsed .card-body { display: none; }
    .card-body p { margin: 0; color: var(--text); font-size: .91em; line-height: 1.8; text-align: justify; overflow-wrap: anywhere; }
    .card-body p[data-key="true"] { color: var(--text); font-weight: inherit; }
    .recall-cover { display: none; position: absolute; inset: 0 12px 12px 56px; min-height: 82px; place-items: center; padding: 18px; border: 1px dashed rgba(167,45,37,.28); border-radius: 11px; color: var(--red); background: repeating-linear-gradient(-45deg, #fff8f3, #fff8f3 8px, #fdf2ec 8px, #fdf2ec 16px); font-size: 12px; font-weight: 800; text-align: center; }
    body.recall-mode .knowledge-card:not(.is-revealed) .card-body p { visibility: hidden; }
    body.recall-mode .knowledge-card:not(.is-revealed) .recall-cover { display: grid; }
    .empty-state { padding: 36px 20px; border-radius: 16px; color: var(--muted); background: var(--paper); text-align: center; font-size: 13px; }

    .bottom-nav { position: fixed; left: 50%; bottom: 0; z-index: 18; width: min(100%, 480px); display: grid; grid-template-columns: 92px auto 92px; align-items: center; justify-content: center; justify-items: center; gap: 10px; padding: 10px 16px calc(10px + var(--safe-bottom)); border-top: 1px solid rgba(223,211,198,.9); background: rgba(255,253,248,.94); box-shadow: 0 -8px 24px rgba(72, 54, 37, .08); backdrop-filter: blur(14px); transform: translateX(-50%); }
    .nav-btn { width: 100%; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 12px; color: var(--text); background: #f2eae0; font-size: 12px; font-weight: 800; text-align: center; }
    .nav-btn:last-child { color: #fff; background: var(--red); }
    .nav-btn:disabled { opacity: .38; cursor: default; }
    .chapter-count { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(37,29,23,.42); }
    .drawer-backdrop.is-open { display: block; }
    .drawer { position: absolute; left: 0; top: 0; bottom: 0; width: min(86vw, 360px); display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 18px; background: var(--paper); box-shadow: 16px 0 38px rgba(42,31,24,.18); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 14px; }
    .drawer-head strong { color: var(--ink); font-size: 18px; }
    .drawer-close { width: 36px; height: 36px; border-radius: 10px; color: var(--muted); background: #f2ebe2; font-size: 22px; }
    .drawer-progress { margin-bottom: 12px; padding: 12px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--red-deep), var(--red)); }
    .drawer-progress span { display: block; color: rgba(255,255,255,.7); font-size: 10px; }
    .drawer-progress strong { display: block; margin-top: 5px; font-size: 20px; }
    .drawer-list { display: grid; gap: 7px; overflow-y: auto; padding-bottom: 20px; }
    .drawer-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) 10px; align-items: center; gap: 8px; min-height: 48px; padding: 7px 9px; border-radius: 11px; color: var(--text); background: #f8f3ec; text-align: left; }
    .drawer-item.is-active { color: var(--red); background: var(--red-soft); }
    .drawer-item__num { color: var(--muted); font-size: 10px; font-weight: 800; }
    .drawer-item__title { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-item__dot { width: 8px; height: 8px; border-radius: 50%; background: #d7cdc2; }
    .drawer-item.is-done .drawer-item__dot { background: var(--green); }

    @media (min-width: 481px) {
      body { padding: 18px 0; }
      .app { overflow: hidden; border-radius: 22px; box-shadow: 0 22px 60px rgba(46,34,26,.16); }
      .topbar { top: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar__row">
        <button class="icon-btn" id="menuButton" type="button" aria-label="打开章节目录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="topbar__title">
          <small>政治理论冲刺 · 第三部分</small>
          <strong id="topChapterTitle">新思想概论</strong>
        </div>
        <div class="font-tools" aria-label="字号调整">
          <button class="font-btn" id="fontDown" type="button">A−</button>
          <button class="font-btn" id="fontUp" type="button">A+</button>
        </div>
      </div>
      <nav class="chapter-strip" id="chapterStrip" aria-label="章节快速切换"></nav>
    </header>

    <section class="controls" aria-label="背诵工具">
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
        <input id="searchInput" type="search" placeholder="搜索本章关键词" />
      </label>
      <button class="control-btn" id="doneButton" type="button">已背</button>
    </section>
    <button class="recall-float" id="recallButton" type="button">背诵</button>

    <section class="content" id="content" aria-live="polite"></section>

    <nav class="bottom-nav" aria-label="章节翻页">
      <button class="nav-btn" id="prevButton" type="button">上一章</button>
      <span class="chapter-count" id="chapterCount"></span>
      <button class="nav-btn" id="nextButton" type="button">下一章</button>
    </nav>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true">
    <aside class="drawer" aria-label="章节目录">
      <div class="drawer-head"><strong>章节目录</strong><button class="drawer-close" id="drawerClose" type="button" aria-label="关闭目录">×</button></div>
      <div class="drawer-progress"><span>整体背诵进度</span><strong id="drawerProgress"></strong></div>
      <nav class="drawer-list" id="drawerList"></nav>
    </aside>
  </div>

  <script>
    const BOOK_DATA = [{"title":"导论","id":"chapter-1","index":1,"source":"讲义第 32–42 页","blocks":[{"title":"（一）习近平新时代中国特色社会主义思想创立的时代背景","paragraphs":["①世界百年未有之大变局加速演进。","②中华民族伟大复兴进入关键时期。","③中国式现代化全面推进拓展。","④科学社会主义在 21 世纪的中国焕发新的蓬勃生机。","⑤中国共产党自我革命开辟新的境界。"]},{"title":"（二）习近平新时代中国特色社会主义思想是“两个结合”的重大成果","paragraphs":["①【内容】马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。","②【地位】 “两个结合”是我们党在探索中国特色社会主义道路中得出的规律性认识，是我","们取得成功的最大法宝。","【补充】深刻理解“两个结合”的重大意义","第一， “结合”的前提是彼此契合。“结合”不是硬凑在一起的。马克思主义和中华优","秀传统文化来源不同，但彼此存在高度的契合性。","第二， “结合”的结果是互相成就。“结合”不是“拼盘”，不是简单的“物理反应”，","而是深刻的“化学反应”，造就了一个有机统一的新的文化生命体。","第三， “结合” 筑牢了道路根基。我们的社会主义为什么不一样？为什么能够生机勃勃、","充满活力？关键就在于中国特色。 中国特色的关键就在于 “两个结合”。“第二个结合” 让中国特色社会主义道路有了更加宏阔深远的历史纵深，拓展了中国特色社会主义道路的文化根基。","第四， “结合”打开了创新空间。“结合”本身就是创新，同时又开启了广阔的理论和","实践创新空间。 “第二个结合”让我们掌握了思想和文化主动，并有力地作用于道路、理论和制度。","第五， “结合” 巩固了文化主体性。任何文化要立得住、 行得远， 要有引领力、 凝聚力、","塑造力、 辐射力， 就必须有自己的主体性。 中国共产党历来重视文化， 新时代我们在道路自信、理论自信、制度自信的基础上增加了文化自信。 文化自信就来自我们的文化主体性。","创立新时代中国特色社会主义思想就是这一文化主体性的最有力体现。","“第二个结合”， 是我们党对马克思主义中国化时代化历史经验的深刻总结， 是对中华文明发展规律的深刻把握，表明 我们党对中国道路、理论、制度的认识 达到了新高度，表明我们党的历史自信、文化自信 达到了新高度，表明我们党在传承中华优秀传统文化中推进文化创新的自觉性达到了新高度。"]},{"title":"1.【回答的时代课题】","paragraphs":["①建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党","②新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义","③建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国"]},{"title":"2.【主要内容】","paragraphs":["党的十九大、十九届六中全会 提出的“十个明确” “十四个坚持” “十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容。","（1） 【十个明确】“十个明确”是习近平新时代中国特色社会主义思想的 主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。","①明确中国特色社会主义最本质的特征是 中国共产党领导，中国特色社会主义制度的最大","优势是中国共产党领导，中国共产党是最高政治领导力量，全党必须增强“四个意识”、坚定“四个自信”、做到“两个维护”；","②明确坚持和发展中国特色社会主义， 总任务是实现社会主义现代化和中华民族伟大复兴，","在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴；","③明确新时代我国社会主要矛盾是 人民日益增长的美好生活需要和不平衡不充分的发展之","间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主， 推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展；","④明确中国特色社会主义事业 总体布局是经济建设、政治建设、文化建设、社会建设、生","态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面；","⑤明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治","理能力现代化；","⑥明确全面推进依法治国总目标是建设中国特色社会主义 法治体系、建设社会主义法治国","家；","⑦明确必须坚持和完善 社会主义基本经济制度，使市场在资源配置中起决定性作用，更好","发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享 的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进 的新发展格局，推动高质量发展，统筹发展和安全；","⑧明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良 的人民军队，把","人民军队建设成为世界一流军队；","⑨明确中国特色大国外交要服务民族复兴、促进人类进步，推动建设新型国际关系，推动","构建人类命运共同体；","⑩明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、","思想建设、 组织建设、 作风建设、 纪律建设， 把制度建设贯穿其中， 深入推进反腐败斗争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命。","（2） 【十四个坚持】","①坚持党对一切工作的领导，②坚持以人民为中心，③坚持全面深化改革；","④坚持新发展理念，⑤坚持人民当家作主，⑥坚持全面依法治国，⑦坚持社会主义核心价","值体系，⑧坚持在发展中保障和改善民生，⑨坚持人与自然和谐共生；","⑩坚持总体国家安全观， ○11 坚持党对人民军队的绝对领导，○12 坚持“一国两制”和推进祖","国统一，○13 坚持推动构建人类命运共同体，○14 坚持全面从严治党。","（3） 【十三个成就】“十三个方面成就”对新时代伟大实践进行了科学总结，全景式地展示了习近平新时代中国特色社会主义思想的理论与实践成果。"]},{"title":"3.【世界观、方法论和贯穿其中的立场观点方法】","paragraphs":["党的二十大提出的“六个必须坚持”,是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。","①必须坚持人民至上","【分析】坚持人民至上是根本价值立场，体现了历史唯物主义群众史观。","②必须坚持自信自立","【分析】坚持自信自立是内在精神特质，体现了客观规律性和主观能动性的有机结合。","③必须坚持守正创新","【分析】坚持守正创新是鲜明理论品格，体现了变与不变、继承与发展的内在联系。","④必须坚持问题导向","【分析】坚持问题导向是重要实践要求，体现了矛盾的普遍性和客观性。","⑤必须坚持系统观念","【分析】坚持系统观念是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理。","⑥必须坚持胸怀天下","【分析】坚持胸怀天下是中国共产党人的 境界格局，体现了马克思主义追求人类进步和解","放的崇高理想。"]},{"title":"（四）习近平新时代中国特色社会主义思想的历史地位","paragraphs":["习近平新时代中国特色社会主义思想是当代中国马克思主义、 二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。","①马克思主义在当代中国发展的最新理论成果，开辟了马克思主义中国化时代化新境界。","②使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族","的文化主体性最有力的体现，是中华文化和中国精神的时代精华。","③全党全国各族人民为实现中华民族伟大复兴而奋斗的 行动指南，是新时代党和国家事业","发展的根本遵循。","【注意】 【其他相关表述】","①【两大奇迹】续写了经济快速发展和社会长期稳定两大奇迹。","②全面建成社会主义现代化强国、 以中国式现代化全面推进中华民族伟大复兴的科学指引，","③我们应对各种风险挑战、战胜一切艰难险阻的根本指针，","④全党全国各族人民团结奋斗、勇毅前行创造新的历史伟业的精神旗帜。"]},{"title":"（五）深刻领悟“两个确立”的决定性意义","paragraphs":["①【两个确立】党的十九届六中全会指出，党确立习近平同志党中央的核心、全党的核心","地位，确立习近平新时代中国特色社会主义思想的指导地位。","②【决定性意义】新时代的伟大实践充分证明，“两个确立”是新时代党和国家事业取得历","史性成就、发生历史性变革的 决定性因素，是党和人民应对一切不确定性的 最大确定性、最大底气、最大保证。"]}]},{"title":"一、 新时代坚持和发展中国特色社会主义","id":"chapter-2","index":2,"source":"讲义第 42–45 页","blocks":[{"title":"（一）四个自信","paragraphs":["中国特色社会主义是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是实现中华民族伟大复兴的必由之路。","改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是： 开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。","新时代坚持和发展中国特色社会主义，必须坚定 道路自信、理论自信、制度自信、文化自信。","道路问题是关系党的事业兴衰成败第一位的问题。坚定道路自信，就是坚信中国特色社会主义道路是我国实现社会主义现代化、创造人民美好生活的必由之路，是实现中华民族伟大复兴的必由之路。","坚定理论自信，就是坚信中国特色社会主义理论体系 是指导党和人民实现中华民族伟大复兴的正确理论，是立足时代前沿、与时俱进的科学理论。","坚定制度自信，就是坚信中国特色社会主义制度是当代中国发展进步的根本制度保障，是具有明显制度优势、强大自我完善能力的先进制度。","坚定文化自信，就是坚信中国特色社会主义文化 积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识， 是激励全党全国各族人民奋勇前进的强大精神力量。这一文化，源自于中华民族 5000 多年文明历史所孕育的中华优秀传统文化，熔铸于党领导人民在革命、建设、改革中创造的革命文化和社会主义先进文化， 植根于中国特色社会主义伟大实践。"]},{"title":"1、中国特色社会主义新时代是我国发展新的历史方位","paragraphs":["中国特色社会主义进入新时代，是我国 社会主要矛盾发生新变化的反映。社会主要矛盾已转化为人民日益增长的美好生活需要 和不平衡不充分的发展之间的矛盾。这是我们党作出中国特色社会主义进入新时代重大判断的基本依据。","中国特色社会主义新时代，是承前启后、 继往开来、 在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代，是决胜全面建成小康社会、 进而全面建设社会主义现代化强国的时代，是全国各族人民团结奋斗、 不断创造美好生活、 逐步实现全体人民共同富裕的时代，是全体中华儿女勤力同心、 奋力实现中华民族伟大复兴中国梦的时代，是我国不断为人类作出更大贡献的时代。","中国特色社会主义进入新时代，意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃， 迎来了实现中华民族伟大复兴的光明前景；意味着科学社会主义在21 世纪的中国焕发出强大生机活力， 在世界上高高举起了中国特色社会主义伟大旗帜；","意味着中国特色社会主义道路、 理论、 制度、 文化不断发展， 拓展了发展中国家走向现代化的途径，给世界上那些既希望 加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。"]},{"title":"2、社会主要矛盾变化是关系全局的历史性变化","paragraphs":["新时代我国社会主要矛盾的变化， 是在社会主义初级阶段中发生的变化，没有改变对我国社会主义所处历史阶段的判断。我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。"]},{"title":"1、全面贯彻党的基本理论、基本路线、基本方略","paragraphs":["（1）党的基本理论是坚持和发展中国特色社会主义的行动指南。","中国共产党为什么能，中国特色社会主义为什么好，归根到底是 马克思主义行，是中国化时代化的马克思主义行。","（2）党的基本路线是国家的生命线、人民的幸福线。","（3）党的十九大概括的以“十四个坚持”为主要内容的基本方略，反映了我们党对建设中国特色社会主义的规律性认识。"]},{"title":"2、统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局","paragraphs":["要按照 “五位一体” 总体布局的整体性目标要求， 坚持以经济建设为中心， 努力推动社会主义物质文明、政治文明、精神文明、社会文明、生态文明协调发展。","全面建设社会主义现代化国家 是战略目标，在“四个全面”中居于引领地位；全面深化改革、全面依法治国、全面从严治党 是三大战略举措，为全面建设社会主义现代化国家提供重要保障。"]}]},{"title":"二、以中国式现代化全面推进中华民族伟大复兴","id":"chapter-3","index":3,"source":"讲义第 45–50 页","blocks":[{"title":"核心内容","paragraphs":["新时代新征程中国共产党的 中心任务，就是团结带领全国各族人民 全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"]},{"title":"（一）中华民族近代以来最伟大的梦想","paragraphs":["实现中华民族伟大复兴，是近代以来中国人民的共同梦想，是中国共产党矢志不渝的奋斗目标。"]},{"title":"1、实现中华民族伟大复兴的中国梦","paragraphs":["一百多年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：实现中华民族伟大复兴。"]},{"title":"2、在中华大地上全面建成小康社会","paragraphs":["全面建成小康社会是实现中华民族伟大复兴中国梦的关键一步。","全面建成小康社会，高质量完成了社会主义现代化建设“三步走”战略的 第二步，使中华民族伟大复兴向前迈出新的一大步。"]},{"title":"3、全面建成社会主义现代化强国","paragraphs":["党的二十大进一步明确，全面建成社会主义现代化强国总的战略安排是分两步走： 从2020 年到2035 年基本实现社会主义现代化；从2035 年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","【2035 年远景目标】","到 2035 年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，①达到中等发达国家水平； 实现高水平科技自立自强，②进入创新型国家前列；建成现代化经济体系，形成新发展格局，③基本实现新型工业化、信息化、城镇化、农业现代化；④基本实现国家治理体系和治理能力现代化，全过程人民民主制度更加健全，⑤基本建成法治国家、法治政府、法治社会；⑥建成教育强国、科技强国、人才强国、文化强国、体育强国、健康中国，国家文化软实力显著增强；人民生活更加幸福美好， 居民人均可支配收入再上新台阶，中等收入群体比重明显提高， 基本公共服务实现均等化， 农村基本具备现代生活条件， 社会保持长期稳定， 人的全面发展、⑦全体人民共同富裕取得更为明显的实质性进展；广泛形成绿色生产生活方式，碳排放达峰后稳中有降，生态环境根本好转，⑧美丽中国目标 基本实现；国家安全体系和能力全面加强，⑨基本实现国防和军队现代化。","【本世纪中叶目标】","到本世纪中叶， 把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。 到那时，我国物质文明、政治文明、精神文明、社会文明、 生态文明将全面提升，①实现国家治理体系和治理能力现代化，成为综合国力和国际影响力领先的国家， ②全体人民共同富裕基本实现，我国人民将享有更加幸福安康的生活， 中华民族将以更加昂扬的姿态屹立于世界民族之林。"]},{"title":"1、中国式现代化是中国共产党领导人民长期探索和实践的重大成果","paragraphs":["孙中山先生的《建国方略》被称为近代中国谋求现代化的第一份蓝图。","新民主主义革命时期， 我们党团结带领人民进行革命斗争， 取得新民主主义革命的胜利，为实现现代化创造了根本社会条件。","社会主义革命和建设时期，我们党带领人民完成了社会主义革命、推进了社会主义建设，为现代化建设奠定了根本政治前提和制度基础。","改革开放和社会主义现代化建设新时期，我们党大力推进实践基础上的理论创新、制度创新、文化创新以及其他各方面创新， 为中国式现代化提供了充满 新的活力的体制保证和快速发展的物质条件。","进入新时代， 我们党围绕解决现代化建设中存在的突出矛盾和问题， 不断实现理论和实践上的创新突破，成功推进和拓展了中国式现代化， 为中国式现代化提供了 更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量。"]},{"title":"2、中国式现代化的特征","paragraphs":["中国式现代化，是中国共产党领导的社会主义现代化， 既有各国现代化的共同特征，更有基于自己国情的中国特色。","①中国式现代化是人口规模巨大的现代化。","②中国式现代化是全体人民共同富裕的现代化。这是中国式现代化 区别于西方现代化的显","著标志。","③中国式现代化是物质文明和精神文明相协调 的现代化。物质富足、精神富有是社会主义","现代化的根本要求。","④中国式现代化是人与自然和谐共生的现代化。","⑤中国式现代化是走和平发展道路的现代化。"]},{"title":"3、中国式现代化的本质要求","paragraphs":["中国式现代化的本质要求是： 坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","中国式现代化是中国共产党领导的社会主义现代化，这是对中国式现代化的定性，是管总、管根本的。","党的领导直接关系中国式现代化的 根本方向、前途命运、最终成败。党的领导决定中国式现代化的根本性质；党的领导确保中国式现代化锚定奋斗目标行稳致远；党的领导激发建设中国式现代化的强劲动力；党的领导凝聚建设中国式现代化的磅礴力量。"]},{"title":"4、中国式现代化创造了人类文明新形态","paragraphs":["中国式现代化提供了一种全新的现代化模式。中国式现代化， 打破了 “现代化=西方化”的迷思，展现了不同于西方现代化的新图景。","中国式现代化是对西方式现代化理论和实践的重大超越。","中国式现代化为广大发展中国家提供了全新选择。"]},{"title":"1、推进中国式现代化需要牢牢把握的重大原则","paragraphs":["①坚持和加强党的全面领导。","②坚持中国特色社会主义道路。","③坚持以人民为中心的发展思想。","④坚持深化改革开放。","⑤坚持发扬斗争精神。"]},{"title":"2、推进中国式现代化需要正确处理的重大关系","paragraphs":["推进中国式现代化， 需要统筹兼顾、 系统谋划、 整体推进，正确处理顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放 等一系列重大关系。"]},{"title":"3、推进中国式现代化必须坚持团结奋斗","paragraphs":["团结奋斗是中国共产党和中国人民最显著的精神标识，是中国人民创造历史伟业的必由之路。"]}]},{"title":"三、坚持党的全面领导","id":"chapter-4","index":4,"source":"讲义第 50–51 页","blocks":[{"title":"（一）坚持党对一切工作的领导","paragraphs":["1.党的领导是全面的、系统的、整体的。","坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。","中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。"]},{"title":"2.维护党中央权威和集中统一领导","paragraphs":["中国共产党是最高政治领导力量，党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在。","维护党中央权威和集中统一领导， 最关键的是坚决维护习近平同志党中央的核心、全党的核心地位。","维护党中央权威和集中统一领导， 同坚持党的民主集中制是完全一致的。中国共产党是以民主集中制为根本组织原则和领导制度的马克思主义政党。"]},{"title":"（二）健全和完善党的领导制度体系","paragraphs":["中国最大的国情就是中国共产党的领导。中国共产党领导是国家治理体系的核心。","党的领导制度是我国的根本领导制度。党的领导制度是中国特色社会主义制度体系的核心，是国家治理体系和治理能力现代化的关键。","党的领导制度是一个系统完备、 内涵丰富的制度体系， 主要涵盖六个方面的制度。建立不忘初心、牢记使命的制度；完善坚定维护党中央权威和集中统一领导 的各项制度；健全党的全面领导制度；健全为人民执政、靠人民执政 各项制度；健全提高党的执政能力和领导水平制度；完善全面从严治党制度。"]}]},{"title":"四、坚持以人民为中心","id":"chapter-5","index":5,"source":"讲义第 51–55 页","blocks":[{"title":"1、人民是历史的创造者，是真正的英雄","paragraphs":["人民性是马克思主义的本质属性和鲜明品格。","人民是创造历史的真正动力，是历史发展和社会进步的主体力量。"]},{"title":"2、打江山、守江山，守的是人民的心","paragraphs":["民心是最大的政治，决定事业兴衰成败。","人民是党执政的最大底气，也是党执政最深厚的根基。"]},{"title":"3、人民立场是中国共产党的根本政治立场","paragraphs":["坚持人民立场， 就要始终保持党同人民群众的血肉联系。我们党的最大政治优势是密切联系群众，党执政后的最大危险是脱离群众。"]},{"title":"（二）坚持人民至上","paragraphs":["坚持人民至上，是我们党百年奋斗的宝贵历史经验， 也是新时代党治国理政的 根本价值取向。"]},{"title":"2、依靠人民创造历史伟业","paragraphs":["人民是我们党的生命之根、执政之基、力量之源。"]},{"title":"1、坚持和贯彻党的群众路线","paragraphs":["群众路线是我们党的生命线和根本工作路线， 是我们党永葆青春活力和战斗力的重要传家宝。","群众路线是我们党始终坚持的根本工作方法。","调查研究是获得真知灼见的源头活水，是贯彻群众路线的有效途径。"]},{"title":"2、推动全体人民共同富裕取得更为明显的实质性进展","paragraphs":["共同富裕是中国特色社会主义的本质要求， 是中国式现代化的重要特征。实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题。","扎实推进共同富裕，必须坚持正确的原则和科学的思路。 促进共同富裕，要把握好鼓励勤劳创新致富、坚持基本经济制度、尽力而为量力而行、坚持循序渐进的原则。"]}]},{"title":"五、全面深化改革开放","id":"chapter-6","index":6,"source":"讲义第 55–60 页","blocks":[{"title":"（一）改革开放是决定当代中国命运的关键一招","paragraphs":["改革开放是决定当代中国命运的关键一招， 是当代中国最显著的特征、 最壮丽的气象，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。","改革开放是党和人民大踏步赶上时代的重要法宝。 只有社会主义才能救中国，只有改革开放才能发展中国、发展社会主义、发展马克思主义。","全面深化改革开放，是新时代坚持和发展中国特色社会主义的根本动力。"]},{"title":"1、坚持全面深化改革总目标","paragraphs":["全面深化改革总目标是： 完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。","全面深化改革必须牢牢把握总目标，实施好 “六个紧紧围绕” 的路线图。紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革；紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一，深化政治体制改革；紧紧围绕建设社会主义核心价值体系、 社会主义文化强国， 深化文化体制改革；紧紧围绕更好保障和改善民生、促进社会公平正义， 深化社会体制改革；紧紧围绕建设美丽中国，深化生态文明体制改革；","紧紧围绕提高科学执政、民主执政、依法执政水平，深化党的建设制度改革。","统筹推进各领域各方面改革开放， 必须以全面深化改革总目标为引领，以制度建设为主线，以经济体制改革为重点，以重要领域和关键环节改革为突破口，使各方面改革协同推进、环环相扣、形成合力。"]},{"title":"2、推进国家治理体系和治理能力现代化","paragraphs":["推进国家治理体系和治理能力现代化，必须坚定中国特色社会主义制度自信。中国特色社会主义制度是当代中国发展进步的根本制度保障。"]},{"title":"3、全面深化改革开放要坚持正确方法论","paragraphs":["①增强全面深化改革的系统性、整体性、协同性。","②加强顶层设计和摸着石头过河相结合。","③统筹改革发展稳定改革发展稳定是我国社会主义现代化建设的三个重要支点。","改革是经济社会发展的强大动力， 发展是解决一切经济社会问题的关键， 稳定是改革发展的前提。","④胆子要大，步子要稳。","⑤坚持重大改革于法有据。"]}]},{"title":"六、推动高质量发展","id":"chapter-7","index":7,"source":"讲义第 60–69 页","blocks":[{"title":"核心内容","paragraphs":["高质量发展是新时代我国经济社会发展的 鲜明主题，是全面建设社会主义现代化国家的首要任务。"]},{"title":"1、我国进入新发展阶段","paragraphs":["新发展阶段是我国社会主义初级阶段历史进程中的一个重要阶段，是中国共产党带领人民迎来从站起来、富起来到强起来历史性跨越 的新阶段，是全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段。"]},{"title":"2、贯彻新发展理念是关系我国发展全局的一场深刻变革","paragraphs":["贯彻新发展理念是新时代我国发展壮大的必由之路， 坚定不移贯彻创新、 协调、 绿色、开放、共享的新发展理念。","创新是引领发展的第一动力，创新发展注重的是解决发展动力问题，必须坚持创新在我国现代化建设全局中的核心地位。","协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题。","绿色是永续发展的必要条件 和人民对美好生活追求的重要体现， 绿色发展注重的是解决人与自然和谐共生问题。","开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题。","共享是中国特色社会主义的本质要求，共享发展注重的是解决社会公平正义问题。"]},{"title":"3.加快构建新发展格局","paragraphs":["构建以国内大循环为主体、国内国际双循环相互促进 的新发展格局，是推动高质量发展的战略基点，是关系我国发展全局的重大战略任务。","（1）把握未来发展主动权的战略部署构建新发展格局是把握未来发展主动权的先手棋，不是被迫之举和权宜之计。","构建新发展格局是开放的国内国际双循环，不是封闭的国内单循环。","构建新发展格局是以全国统一大市场基础上的国内大循环为主体，不是各地都搞自我小循环。","（2）以国内大循环为主体、国内国际双循环相互促进构建新发展格局必须具备强大的国内经济循环体系和稳固的基本盘， 保持国内经济持续健康发展，巩固和发展我国经济的强大竞争力。","构建新发展格局必须发挥比较优势，以国内大循环吸引全球资源要素。","构建新发展格局必须保证 经济循环的畅通无阻，实现生产、分配、流通、消费各环节有机衔接。","（3）大力推动构建新发展格局着力推动实施扩大内需战略同深化供给侧结构性改革有机结合。","着力发展实体经济。 实体经济是一国经济的立身之本、财富之源， 是构筑未来发展战略优势的重要支撑。要坚持把发展经济的着力点放在实体经济上。","着力加快科技自立自强。构建新发展格局最本质的特征是实现高水平的自立自强。"]},{"title":"（二）坚持和完善社会主义基本经济制度","paragraphs":["社会主义基本经济制度 是中国特色社会主义制度的重要支柱，是新时代推动实现高质量发展的制度基础。"]},{"title":"1、坚持和完善社会主义基本经济制度是实现高质量发展的保障","paragraphs":["党的十八大以来，以习近平同志为核心的党中央着眼于更好发挥社会主义制度优越性、推动高质量发展，对社会主义基本经济制度作出新概括， 将公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等共同作为社会主义基本经济制度。"]},{"title":"2、坚持“两个毫不动摇”","paragraphs":["公有制经济和非公有制经济都是 社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。要毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。"]},{"title":"3、坚持按劳分配为主体、多种分配方式并存","paragraphs":["健全工资决定和正常增长机制，提高劳动报酬在初次分配中的比重。"]},{"title":"4、构建高水平社会主义市场经济体制","paragraphs":["构建高水平社会主义市场经济体制，关键是要处理好政府和市场的关系。","加快建设高标准市场体系。当今世界，最稀缺的资源是市场。建设统一开放、竞争有序、制度完备、治理完善 的高标准市场体系， 是充分发挥我国超大规模市场优势的现实需要和必然选择。","推进宏观经济治理体系和治理能力现代化。","依法规范和引导资本健康发展。在社会主义市场经济体制下，资本是带动各类生产要素集聚配置的重要纽带。"]},{"title":"1、建设现代化产业体系","paragraphs":["加快建设以实体经济为支撑的现代化产业体系， 关系我们在未来发展和国际竞争中赢得战略主动。","巩固优势产业领先地位。保持优势产业的领先地位，是支撑我国国际竞争力的基石。","大力发展战略性新兴产业。 战略性新兴产业具有先导性，是引领国家未来产业发展的决定性力量。"]},{"title":"2、全面推进乡村振兴","paragraphs":["农业强国是社会主义现代化强国的根基。","实施乡村振兴战略，农业农村现代化是总目标，坚持农业农村优先发展是总方针，产业兴旺、生态宜居、乡风文明、治理有效、生活富裕 是总要求，建立健全城乡融合发展体制机制和政策体系是制度保障。要坚持乡村全面振兴， 实现乡村产业振兴、人才振兴、文化振兴、生态振兴、组织振兴。","全面推进乡村振兴、 建设农业强国， 必须立足我国国情， 扎实稳步推进。要把保障粮食和重要农产品稳定安全供给 作为头等大事。依托双层经营体制发展农业，以家庭经营为基础，坚持统分结合，积极培育新型农业经营主体，形成中国特色的农业适度规模经营。"]},{"title":"3、促进区域协调发展","paragraphs":["要深入实施区域协调发展战略、区域重大战略、主体功能区战略。","要推进以人为核心的新型城镇化，加快农业转移人口市民化。城镇化最基本的趋势是农村富余劳动力和农村人口向城镇转移， 要把促进有能力在城镇稳定就业和生活的常住人口有序实现市民化作为首要任务。 以城市群、 都市圈为依托构建大中小城市协调发展格局，","③推进以县城为重要载体的城镇化建设。","【总结】习近平经济思想","明确加强党对经济工作的全面领导是我国经济发展的根本保证明确坚持以人民为中心的发展思想是我国经济发展的根本立场明确进入新发展阶段是我国经济发展的历史方位明确坚持新发展理念是我国经济发展的指导原则明确构建新发展格局是我国经济发展的路径选择明确推动高质量发展是我国经济发展的鲜明主题明确坚持和完善社会主义基本经济制度是我国经济发展的制度基础明确坚持问题导向部署实施国家重大发展战略是我国经济发展的战略举措明确坚持创新驱动发展是我国经济发展的第一动力明确大力发展制造业和实体经济是我国经济发展的主要着力点明确坚定不移全面扩大开放是我国经济发展的重要法宝明确统筹发展和安全是我国经济发展的重要保障明确坚持正确工作策略和方法是做好经济工作的方法论","【拓展】新质生产力","中共中央政治局就扎实推进高质量发展进行第十一次集体学习。 习近平总书记强调，必须牢记高质量发展是新时代的硬道理，发展新质生产力是推动高质量发展的内在要求和重要着力点，必须继续做好创新这篇大文章，推动新质生产力加快发展。","高质量发展需要新的生产力理论来指导。概括地说，新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。它由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵，以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先进生产力。","科技创新能够催生新产业、新模式、新动能，是发展新质生产力的核心要素。","要及时将科技创新成果应用到具体产业和产业链上，改造提升传统产业，培育壮大新兴产业，布局建设未来产业，完善现代化产业体系。要大力发展数字经济，促进数字经济和实体经济深度融合，打造具有国际竞争力的数字产业集群。","绿色发展是高质量发展的底色，新质生产力本身就是绿色生产力。必须加快发展方式绿色转型，助力碳达峰碳中和。","生产关系必须与生产力发展要求相适应。 发展新质生产力， 必须进一步全面深化改革，形成与之相适应的新型生产关系。 同时，要扩大高水平对外开放，为发展新质生产力营造良好国际环境。"]}]},{"title":"七、社会主义现代化建设的教育、科技、人才战略","id":"chapter-8","index":8,"source":"讲义第 69–73 页","blocks":[{"title":"（一）全面建设社会主义现代化国家的基础性、战略性支撑","paragraphs":["教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义现代化国家，教育是根本，科技是关键，人才是基础。必须坚持科技是第一生产力、人才是第一资源、创新是第一动力，坚持教育优先发展、科技自立自强、人才引领驱动，加快教育强国、科技强国、人才强国建设。"]},{"title":"（二）加快建设教育强国","paragraphs":["建设教育强国是全面建成社会主义现代化强国的战略先导，是实现高水平科技自立自强的重要支撑，是促进全体人民共同富裕的有效途径，是以中国式现代化全面推进中华民族伟大复兴的基础工程。","育人的根本在于立德。落实立德树人根本任务，必须着力解决好 培养什么人、怎样培养人、为谁培养人的问题，这是教育的根本问题，也是建设教育强国的核心课题。","人民满意是发展教育的根本尺度。加快建设教育强国，最终是办好人民满意的教育。"]},{"title":"（三）加快建设科技强国","paragraphs":["实现高水平科技自立自强 是国家强盛和民族复兴的战略基石。全面建成社会主义现代化强国关键看科技自立自强，这是促进发展大局的根本支撑。"]},{"title":"（四）加快建设人才强国","paragraphs":["信息化、知识经济和创新驱动的时代， 人才已经成为推动社会发展最活跃、最积极的因素。"]}]},{"title":"八、发展全过程人民民主","id":"chapter-9","index":9,"source":"讲义第 73–80 页","blocks":[{"title":"（一）坚定中国特色社会主义政治制度自信","paragraphs":["制度优势是一个政党、一个国家的最大优势。坚定中国特色社会主义制度自信， 首先要坚定对中国特色社会主义政治制度的自信。"]},{"title":"2、坚定不移走中国特色社会主义政治发展道路","paragraphs":["走中国特色社会主义政治发展道路，必须坚持 党的领导、人民当家作主、依法治国 有机统一。"]},{"title":"1、全过程人民民主是社会主义民主政治的伟大创造","paragraphs":["全过程人民民主的实现了 过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一。"]},{"title":"1、加强人民当家作主制度保障","paragraphs":["人民代表大会制度作为实现全过程人民民主的重要制度载体。","中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度构成了我国的基本政治制度。基层群众自治制度是社会主义民主政治建设的基础。"]},{"title":"2、全面发展协商民主","paragraphs":["协商民主是中国社会主义民主政治中独特的、独有的、独到的民主形式。"]},{"title":"3、积极发展基层民主","paragraphs":["基层民主是全过程人民民主的重要体现。我国基层民主有多种多样的形式， 如以村民委员会为组织形态的农村村民自治、以社区居民委员会为组织形态的 城市居民自治、以职工代表大会为组织依托的企事业单位职工自治等。","发展基层民主，是社会主义民主最广泛的实践。"]},{"title":"1、统一战线是凝聚人心、汇聚力量的强大法宝","paragraphs":["统战工作的本质要求是大团结大联合，解决的就是人心和力量问题。","统一战线工作范围包括： 民主党派成员， 无党派人士，党外知识分子， 少数民族人士，宗教界人士，非公有制经济人士，新的社会阶层人士，出国和归国留学人员，香港同胞、澳门同胞， 台湾同胞及其在大陆的亲属， 华侨、 归侨及侨眷， 其他需要联系和团结的人员。","统一战线的工作对象为党外人士，重点是其中的代表人士。","统战工作的关键是要坚持 求同存异，发扬“团结一批评一团结”的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆。","统一战线是党领导的统一战线。党的领导是统一战线最鲜明的特征，坚持党的领导是统一战线最核心最根本的问题。党对统一战线的领导主要是政治领导，即政治原则、政治方向、 重大方针政策的领导， 主要体现为党委领导而不是部门领导、 集体领导而不是个人领导。"]},{"title":"2、铸牢中华民族共同体意识","paragraphs":["民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。","铸牢中华民族共同体意识，就是要 引导各族人民牢固树立 休戚与共、荣辱与共、生死与共、命运与共的共同体理念。","【拓展1：人大工作】在庆祝全国人民代表大会成立70 周年大会上的讲话","在党的领导下， 人民代表大会制度有效保证了我国始终沿着社会主义道路前进， 为创造经济快速发展和社会长期稳定两大奇迹提供了重要制度保障，展现出显著政治优势。","——人民代表大会制度具有坚持中国共产党领导、保证党领导人民依法有效治理国家的显著优势。 这有效克服了旧中国那种群龙无首、 一盘散沙和党争纷沓、 相互攻讦的现象。","——人民代表大会制度具有践行全过程人民民主、保障人民当家作主 的显著优势。这有效克服了一些国家那种人民形式上有权、实际上无权和选举时漫天许诺、选举后无人过问的现象。","——人民代表大会制度具有贯彻民主集中制、保证国家政治生活既充满活力又安定有序的显著优势。这有效克服了一些国家那种相互掣肘、内耗严重和议而不决、决而不行的现象。","——人民代表大会制度具有保障全面依法治国、实现国家各方面工作法治化 的显著优势。这有效克服了一些国家那种无法可依、有法不依和以权代法、以权压法的现象。","——人民代表大会制度具有维护国家统一、保障国家长治久安 的显著优势。这有效克服了一些国家那种各自为政、尾大不掉和民族隔阂、民族冲突的现象。","我们坚持把马克思主义基本原理同中国具体实际相结合、 同中华优秀传统文化相结合，深刻把握社会主义民主政治发展规律，系统总结党加强社会主义民主政治建设的实践经验，持续推进人民代表大会制度理论和实践创新。 我们提出全过程人民民主的重大理念，强调人民代表大会制度是实现我国全过程人民民主的重要制度载体，必须坚持中国共产党领导，必须坚持用制度体系保障人民当家作主，必须坚持全面依法治国，必须坚持民主集中制，必须坚持走中国特色社会主义政治发展道路，必须坚持推进国家治理体系和治理能力现代化， 必须坚持充分发挥人大代表作用， 必须坚持按照“四个机关”要求加强各级人大建设。","我们要围绕发展全过程人民民主， 坚持好、完善好、运行好 人民代表大会制度， 为实现新时代新征程党和人民的奋斗目标提供坚实制度保障。","第一，充分发挥人大保证全面有效实施宪法法律的重要作用。","第二， 充分发挥人大在立法工作中的主导作用。 推进科学立法、 民主立法、 依法立法，","必须坚持和完善党委领导、人大主导、政府依托、各方参与的立法工作格局。","第三，充分发挥人大监督在党和国家监督体系中的重要作用。 各级人大及其常委会要","担负起宪法法律赋予的监督职责，健全人大对“一府一委两院”监督制度。","第四，充分发挥人大在密切同人民群众联系中的带头作用。","【拓展2：政协工作】在庆祝中国人民政治协商会议成立75 周年大会上的讲话","1949 年 9 月，在中国人民争取民族独立和人民解放运动取得历史性伟大胜利之际，中国人民政治协商会议第一届全体会议 召开，标志着中国共产党领导的多党合作和政治协商制度正式确立。75 年来，在中国共产党领导下，人民政协始终坚持团结和民主两大主题，服务党和国家中心任务， 在各个历史时期都做了大量卓有成效的工作， 发挥了十分重要的作用。","75 年来的实践充分证明，人民政协是中国共产党把马克思列宁主义统一战线理论、政党理论、民主政治理论同中国具体实际相结合、同中华优秀传统文化相结合的伟大成果，是科学、有效、管用的制度安排，在人类政治制度发展史上具有独特政治价值。","人民政协作为中国共产党领导的政治组织，由具有共同政治基础和奋斗目标的各党派团体和各族各界人士参加，开展 政治协商、民主监督、参政议政，有利于完善人民当家作主的制度体系， 更好保障最广大人民整体利益、 根本利益、 长远利益。人民政协作为最广泛的爱国统一战线组织，坚持大团结大联合，坚持正确处理一致性和多样性的关系，有利于最大限度把全体中华儿女智慧和力量汇聚起来，形成心往一处想、劲往一处使的生动局面。","人民政协作为社会主义协商民主的重要渠道和专门协商机构，秉持有事好商量、众人的事情由众人商量的理念， 为各党派团体和各族各界人士有序政治参与和利益表达提供了制度化平台，有利于促进科学决策、有效施策，提升国家治理效能。","中共十八大以来， 我们适应中国特色社会主义新时代的形势任务， 坚持把马克思主义基本原理同中国具体实际相结合、 同中华优秀传统文化相结合， 在实践创新基础上推进人民政协理论创新，不断深化规律性认识。主要是： 坚持中国共产党对人民政协的全面领导，坚持人民政协性质定位，坚持发挥 人民政协作为专门协商机构作用，坚持和完善我国社会主义新型政党制度，坚持大团结大联合，坚持把 加强思想政治引领、广泛凝聚共识 作为中心环节，坚持聚焦党和国家中心任务履职尽责，坚持人民政协为人民，坚持强化委员责任担当，坚持以改革创新精神推进履职能力建设。这10 条，构成了我们党关于加强和改进人民政协工作的重要思想。","协商民主是全过程人民民主的重要组成部分，是我国社会主义民主政治的特有形式和独特优势，是党的群众路线在政治领域的重要体现。","希望人民政协发扬优良传统，牢记政治责任， 坚持党的领导、统一战线、协商民主 有机结合，充分发挥专门协商机构作用，为推进中国式现代化广泛凝聚人心、凝聚共识、凝聚智慧、凝聚力量。","不断巩固团结奋斗的共同思想政治基础。 坚持和发展中国特色社会主义 是巩固共同思想政治基础的主轴，新时代中国特色社会主义思想是统揽政协工作的总纲。"]}]},{"title":"九、全面依法治国","id":"chapter-10","index":10,"source":"讲义第 80–86 页","blocks":[{"title":"（一）坚持中国特色社会主义法治道路","paragraphs":["全面依法治国，是坚持和发展中国特色社会主义的本质要求和重要保障。"]},{"title":"1、全面依法治国的唯一正确道路","paragraphs":["（1）核心要义中国特色社会主义法治道路的核心要义，就是要 坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。","（2）坚持的原则坚持和拓展中国特色社会主义法治道路必须牢牢把握核心要义，毫不动摇坚持以下原则。","①坚持中国共产党的领导。","党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。","②坚持以人民为中心。推进全面依法治国，根本目的是依法保障人民权益。","③坚持法律面前人人平等。平等是社会主义法律的基本属性。","④坚持依法治国和以德治国相结合。","⑤坚持从中国实际出发。"]},{"title":"2、统筹处理全面依法治国的重大关系","paragraphs":["①正确处理政治和法治的关系。党和法的关系是政治和法治关系的集中反映，是全面依法","治国的一个根本问题。","②正确处理改革和法治的关系。","③正确处理依法治国和以德治国的关系。法律是成文的道德，道德是内心的法律。","④正确处理依法治国和依规治党的关系。党的政策是国家法律的先导和指引，是立法的依","据和执法司法的重要指导，要通过法律保障党的政策有效实施。"]},{"title":"1、中国特色社会主义法治体系的地位","paragraphs":["全面推进依法治国的总抓手就是建设中国特色社会主义法治体系。"]},{"title":"2、中国特色社会主义法治体系的内容","paragraphs":["法治体系是国家治理体系的骨干工程。更好推进中国特色社会主义法治体系建设，必须加快形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形成完善的党内法规体系。"]},{"title":"1、法治中国建设的总体目标","paragraphs":["到 2035 年，法治国家、法治政府、法治社会基本建成，中国特色社会主义法治体系基本形成，人民平等参与、平等发展权利得到充分保障， 国家治理体系和治理能力现代化基本实现。"]},{"title":"2、法治中国建设的工作布局","paragraphs":["坚持依法治国、依法执政、依法行政共同推进。依法行政的基本要求是 合法行政，法定职责必须为、法无授权不可为，做到严格规范公正文明执法。","坚持法治国家、法治政府、法治社会一体建设。 法治国家是法治建设的目标。法治政府建设是全面依法治国的重点任务和主体工程。","建设社会主义法治国家，把全面贯彻实施宪法作为首要任务。宪法的生命在于 实施，宪法的权威也在于实施。"]},{"title":"3、建设更高水平的法治中国","paragraphs":["全面推进科学立法、严格执法、公正司法、全民守法。","【总结】习近平法治思想","习近平法治思想的核心要义集中体现为： “十一个坚持”。","（1）坚持党对全面依法治国的领导；","（2）坚持以人民为中心；","（3）坚持中国特色社会主义法治道路；","（4）坚持在法治轨道上推进国家治理体系和治理能力现代化；","（5）坚持依法治国、依法执政、依法行政，共同推进法治国家、法治政府、法治社会一体建设；","（6）坚持建设中国特色社会主义法治体系（7）坚持依宪治国、依宪执政；","（8）坚持全面推进科学立法、严格执法、公正司法、全民守法；","（9）坚持统筹推进国内法治和涉外法治；","（10）坚持建设德才兼备的高素质法制工作队伍；","（11）坚持抓住领导干部这个“关键少数”。"]}]},{"title":"十、建设社会主义文化强国","id":"chapter-11","index":11,"source":"讲义第 86–94 页","blocks":[{"title":"1、坚定中国特色社会主义文化自信","paragraphs":["文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","①中华优秀传统文化是我们坚定文化自信的深厚基础。","②党带领人民在伟大斗争中孕育的 革命文化和社会主义先进文化 是我们坚定文化自信的坚","强基石。","③中国特色社会主义伟大实践是我们坚定文化自信的现实基础。"]},{"title":"2、坚持中国特色社会主义文化发展道路","paragraphs":["坚持举旗帜、聚民心、育新人、兴文化、展形象。","坚持“二为”方向、 “双百”方针。坚持为人民服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。","激发全民族文化创新创造活力。创新创造是文化的生命所在，是文化的本质特征。"]},{"title":"1、坚持马克思主义在意识形态领域指导地位的根本制度","paragraphs":["马克思主义是我们立党立国、兴党兴国的根本指导思想。"]},{"title":"2、积极塑造主流舆论新格局","paragraphs":["坚持正确的政治方向是做好新闻舆论工作的第一位要求。","党性原则是新闻舆论工作的根本原则。坚持党性原则最根本的是 坚持党对新闻舆论工作的领导。"]},{"title":"（三）以社会主义核心价值观引领文化建设","paragraphs":["核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。"]},{"title":"1、广泛践行社会主义核心价值观","paragraphs":["社会主义核心价值观的基本内容： 富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善。"]},{"title":"2、弘扬以伟大建党精神为源头的中国共产党人精神谱系","paragraphs":["以伟大建党精神为源头的中国共产党人精神谱系， 是党带领人民战胜艰难险阻、取得一个又一个伟大胜利的精神丰碑，是中华民族的宝贵精神财富。","新民主主义革命时期，铸就了井冈山精神、 苏区精神、 长征精神、 遵义会议精神、 延安精神、抗战精神、红岩精神、西柏坡精神等；","社会主义革命和建设时期，铸就了抗美援朝精神、 “两弹一星”精神、雷锋精神、焦裕禄精神、大庆精神、红旗渠精神等；","改革开放和社会主义现代化建设新时期，铸就了改革开放精神、 特区精神、 抗洪精神、抗击“非典”精神、抗震救灾精神、载人航天精神等；","中国特色社会主义 新时代，铸就了脱贫攻坚精神、抗疫精神、探月精神、新时代北斗精神等。"]},{"title":"1、传承发展中华优秀传统文化","paragraphs":["中华优秀传统文化是中华文明的智慧结晶和精华所在，是中华民族的 根和魂。要推动中华优秀传统文化创造性转化、创新性发展，让中华文明展现出永久魅力和时代风采。","深刻把握中华文明的突出特性。 中华优秀传统文化有很多重要元素，共同塑造出 中华文明连续性、创新性、统一性、包容性、和平性的突出特性。","A、中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明，连续性从根本上决定了中华民族必然走自己的路。","B、中华文明强调苟日新日日新又日新、革故鼎新、与时俱进的思想，创新性从根本上决定了中华民族守正不守旧、尊古不复古的进取精神，决定了中华民族不惧新挑战、勇于接受新事物的无畏品格。","C、中华文明在长期历史演进中形成多元一体的格局，统一性从根本上决定了中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚，决定了国土不可分、国家不可乱、民族不可散、 文明不可断的共同信念， 决定了国家统一永远是中国核心利益的核心， 决定了一个坚强统一的国家是各族人民的命运所系。","D、中华文明是由多元文化汇聚成的共同文化，具有无与伦比的包容性和吸纳力，包容性从根本上决定了中华民族交往交流交融的历史取向，决定了中国各宗教信仰多元并存的和谐格局，决定了中华文化对世界文明兼收并蓄的开放胸怀。","E、中华文明历来崇尚 “以和邦国” “和而不同” “以和为贵”， 中华民族的血液中没有侵略他人、称王称霸的基因，和平性从根本上决定了中国始终是世界和平的建设者、全球发展的贡献者、 国际秩序的维护者， 决定了中国不断追求文明交流互鉴而不搞文化霸权， 决定了中国不会把自己的价值观念与政治体制强加于人， 决定了中国坚持合作、 不搞对抗， 决不搞 “党同伐异”的小圈子。"]},{"title":"2、繁荣发展文化事业和文化产业","paragraphs":["要牢固树立马克思主义文艺观，坚持 以人民为中心的创作导向，生产出无愧于我们这个伟大民族、伟大时代的优秀作品。","社会主义文艺是人民的文艺，要把满足人民精神文化需求 作为文艺和文艺工作的出发点和落脚点，把人民作为文艺表现的主体， 把人民作为文艺审美的鉴赏家和评判者，把为人民服务作为文艺工作者的天职。","中国精神是社会主义文艺的灵魂。","要坚持把社会效益放在首位、社会效益和经济效益相统一。"]},{"title":"3、不断提升国家文化软实力和中华文化影响力","paragraphs":["一个国家的文化软实力， 从根本上说取决于其核心价值观的生命力、 凝聚力、 感召力。","【拓展1】宣传思想文化工作重要指示","近日， 习近平总书记对宣传思想文化工作作出重要指示指出， 宣传思想文化工作事关党的前途命运，事关国家长治久安，事关民族凝聚力和向心力，是一项极端重要的工作。","要坚持以新时代中国特色社会主义思想为指导， 全面贯彻党的二十大精神， 聚焦用党的创新理论武装全党、教育人民 这个首要政治任务，围绕在新的历史起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明 这一新的文化使命，坚定文化自信，秉持开放包容，坚持守正创新，着力加强党对宣传思想文化工作的领导，着力建设具有强大凝聚力和引领力的社会主义意识形态，着力培育和践行社会主义核心价值观，着力提升新闻舆论传播力引导力影响力公信力，着力赓续中华文脉、推动中华优秀传统文化创造性转化和创新性发展，着力推动文化事业和文化产业繁荣发展，着力加强国际传播能力建设、促进文明交流互鉴， 充分激发全民族文化创新创造活力， 不断巩固全党全国各族人民团结奋斗的共同思想基础， 不断提升国家文化软实力和中华文化影响力， 为全面建设社会主义现代化国家、全面推进中华民族伟大复兴提供坚强思想保证、强大精神力量、有利文化条件。","【拓展2】中央政治局第十七次集体学习","10 月28 日，中共中央政治局就建设文化强国进行第十七次集体学习。","习近平总书记在主持学习时强调，要锚定2035 年建成文化强国的战略目标，坚持马克思主义这一根本指导思想，植根博大精深的中华文明， 顺应信息技术发展潮流，不断发展具有强大思想引领力、精神凝聚力、价值感召力、国际影响力 的新时代中国特色社会主义文化，不断增强人民精神力量，筑牢强国建设、民族复兴的文化根基。","要坚定不移走中国特色社会主义文化发展道路。 坚持党的领导，提升信息化条件下文化领域治理能力， 在思想上、 精神上、 文化上筑牢党的执政基础和群众基础。坚持马克思主义在意识形态领域指导地位的根本制度，全面贯彻新时代中国特色社会主义文化思想，发展面向现代化、面向世界、面向未来 的，民族的科学的大众的社会主义文化。坚持以社会主义核心价值观为引领，不断构筑中国精神、中国价值、中国力量，发展壮大主流价值、主流舆论、主流文化。","要着力激发全民族文化创新创造活力。坚持 以人民为中心的创作导向，坚持把社会效益放在首位、社会效益与经济效益相统一，把激发创新创造活力作为深化文化体制机制改革的中心环节，加快完善文化管理体制和生产经营机制。","要始终坚持文化建设着眼于人、落脚于人。着眼满足人民群众多样化、多层次、多方面的精神文化需求，提升文化服务和文化产品供给能力， 增强人民群众文化获得感、 幸福感。","要在创造性转化和创新性发展 中赓续中华文脉。深入挖掘和阐发中华优秀传统文化的精神内涵，用马克思主义激活中华传统文化中的优秀因子并赋予其新的时代内涵， 发展新时代中国特色社会主义文化。 秉持敬畏历史、 热爱文化之心，坚持保护第一、 合理利用和最小干预原则，推动文化遗产系统性保护和统一监管。"]}]},{"title":"十一、以保障和改善民生为重点加强社会建设","id":"chapter-12","index":12,"source":"讲义第 94–99 页","blocks":[{"title":"1、民生是人民幸福之基","paragraphs":["①增进民生福祉是坚持立党为公、执政为民的本质要求。","②增进民生福祉是社会主义生产的根本目的。","③增进民生福祉是全面建设社会主义现代化国家的应有之义。"]},{"title":"2、人民获得感幸福感安全感更加充实、更有保障、更可持续","paragraphs":["打赢脱贫攻坚战，消除绝对贫困，是全面建成小康社会的 底线任务，是必须抓紧抓好的第一民生工程。","经过接续奋斗， 我国社会建设全面加强，幼有所育、 学有所教、 劳有所得、 病有所医、老有所养、住有所居、弱有所扶得到更好实现。"]},{"title":"3、坚持在发展中增进民生福祉","paragraphs":["发展是解决民生问题的“总钥匙”,民生是发展的“指南针”。","正确把握民生和发展的关系， 是保障和改善民生的重要前提。发展是改善民生的物质基础，离开发展谈改善民生是无源之水、无本之木。","解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的重中之重。","坚持尽力而为、量力而行，是保障和改善民生的重要方针。","坚持人人尽责、 人人享有， 让所有劳动者在推动发展中分享发展成果， 是保障和改善民生的重要原则。"]},{"title":"1、完善分配制度","paragraphs":["收入分配是民生之源，是改善民生、实现发展成果由人民共享 最重要最直接的方式。","分配制度是促进共同富裕的基础性制度。","要继续深化收入分配制度改革， 进一步优化收入分配结构，构建初次分配、 再分配、 第三次分配协调配套的制度体系。发挥初次分配的基础性作用。发挥再分配的调节作用。建立健全第三次分配机制。"]},{"title":"2、实施就业优先战略","paragraphs":["就业是最基本的民生，是劳动者赖以生存和发展的基础、共享经济发展成果的基本条件。","解决好就业问题，是民生改善的“温度计”,对国家长治久安具有重要支撑作用。"]},{"title":"3、健全社会保障体系","paragraphs":["社会保障发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用。","健全和完善社会保障体系 是新时代加强社会建设的重要着力点。 要全面深化社会保障制度改革， 完善覆盖全民、 统筹城乡、 公平统一、 安全规范、 可持续的多层次社会保障体系。","社会保障体系主要涉及社会保险、社会救助、社会福利、社会优抚等方面。"]},{"title":"4、推进健康中国建设","paragraphs":["人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求。"]},{"title":"1、加强和创新社会治理","paragraphs":["加强和创新社会治理，就是要在 党的领导下，以政府为主导，以社会多元主体参与为基础，以维护人民群众根本利益 为核心，通过合作、对话、协商、沟通等方式，依法对社会事务、社会组织和社会生活进行引导和规范， 协调社会利益，化解社会矛盾，促进社会公平，推动社会稳定有序发展。","新时代加强和创新社会治理，要求坚持 系统治理、依法治理、综合治理、源头治理，探索一条符合中国社会发展实际、更可持续的中国特色社会主义社会治理之路。"]},{"title":"2、完善社会治理体系","paragraphs":["社会治理体系是进行社会治理的基础， 也是提高社会治理效能的保障。党的十九届四中全会提出，要完善党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑的社会治理体系。","理念是完善社会治理体系的先导，必须坚持共建共治共享的社会治理理念。","制度是完善社会治理体系的保障，必须健全社会治理制度，提升社会治理效能。","方式方法是完善社会治理体系的重要内容， 必须不断创新社会治理方式、 途径和手段。"]},{"title":"3、加强城乡社区治理","paragraphs":["基层治理是国家治理的基石，城乡社区是社会治理最基本的单元，是党和政府联系、服务居民群众的“最后一公里”。","健全党组织领导的城乡基层治理体系，实现政府治理和社会调节、居民自治良性互动。","充分发挥基层党组织领导核心作用，把党的领导贯穿社会治理全过程各环节。 有效发挥基层政府主导作用，健全社区管理和服务机制。注重发挥基层群众性自治组织基础作用，加强基层群众性自治组织规范化建设，促进基层群众自治与网格化服务管理有效衔接。","坚持和发展新时代“枫桥经验” “浦江经验”,完善正确处理新形势下人民内部矛盾机制。","加快推进市域社会治理现代化，提高市域社会治理能力。 市域是将风险隐患解决在基层、化解在萌芽状态的最直接、最有效力的治理层级，处于推进基层治理现代化的前线位置。"]}]},{"title":"十二、建设社会主义生态文明","id":"chapter-13","index":13,"source":"讲义第 99–103 页","blocks":[{"title":"核心内容","paragraphs":["生态环境是人类生存最为基础的条件， 生态文明建设是关系中华民族永续发展的根本大计。"]},{"title":"1.绿水青山就是金山银山","paragraphs":["生态环境问题归根到底是经济发展方式和生活方式问题。"]},{"title":"2、把生态文明建设摆在全局工作的突出位置","paragraphs":["生态文明建设是重大经济问题，也是关系党的使命宗旨的 重大政治问题、关系民生福祉的重大社会问题。良好的生态环境是最公平的公共产品，是最普惠的民生福祉。","党的十八大以来， 我们党把生态文明建设摆在全局工作的突出位置， 谋划开展了一系列根本性、开创性、长远性工作。","①实现由重点整治到系统治理的重大转变；","②实现由被动应对到主动作为的重大转变；","③实现由全球环境治理参与者到引领者的重大转变；","④实现由实践探索到科学理论指导的重大转变。","生态文明建设战略地位更加凸显。党的十九大把 “增强绿水青山就是金山银山的意识”等写入党章。","污染防治和生态保护更加有力。 优化国土空间开发布局，严守生态保护红线、环境质量底线、资源利用上线三条红线。"]},{"title":"1、加快形成绿色生产方式和生活方式","paragraphs":["要加快推动发展方式绿色低碳转型，坚持把绿色低碳发展作为解决生态环境问题的治本之策。"]},{"title":"2、坚持山水林田湖草沙一体化保护和系统治理","paragraphs":["山水林田湖草沙是一个生命共同体，是不可分割的生态系统。","加快实施重要生态系统保护和修复重大工程。 强化国土空间规划和用途管控，划定落实生态保护红线、永久基本农田、城镇开发边界三条控制线以及各类海域保护线。","推进自然保护地体系建设。构建以国家公园为主体、自然保护区为基础、各类自然公园为补充的自然保护地体系。"]},{"title":"3、用最严格制度最严密法治保护生态环境","paragraphs":["保护生态环境必须依靠制度、依靠法治。 必须把制度建设作为生态文明建设的重中之重。","实行最严格的生态环境保护制度。 完善生态文明领域统筹协调机制，健全党委领导、政府主导、企业主体、社会组织和公众共同参与的现代环境治理体系。"]}]},{"title":"十三、维护和塑造国家安全","id":"chapter-14","index":14,"source":"讲义第 103–106 页","blocks":[{"title":"（一）总体国家安全观是新时代国家安全工作的基本遵循","paragraphs":["总体国家安全观以人民安全为宗旨；以政治安全为根本，坚持把政治安全放在首要位置；以经济安全为基础；以军事、 科技、 文化、 社会安全为保障；以促进国际安全为依托，推动树立共同、综合、合作、可持续的全球安全观。","总体国家安全观的关键是“总体”。加强科学统筹，做到统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，统筹维护国家安全和塑造国家安全，着力解决国家安全工作不平衡不充分的问题。"]},{"title":"1、统筹发展和安全","paragraphs":["发展和安全是两件大事。发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑；安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石。","以新安全格局保障新发展格局。 牢牢守住安全发展这条底线 是构建新发展格局的重要前提和保障。"]},{"title":"2、把维护政治安全放在首要位置","paragraphs":["构建统筹各领域安全的新安全格局，必须把 维护政治安全作为应对各领域安全风险挑战的首要任务。政治安全是国家安全的根本。","维护政权安全，就是要毫不动摇坚持和巩固 党的领导和长期执政地位。党的领导是做好党和国家各项工作的根本保证，是我国政治稳定、经济发展、民族团结、社会稳定的根本点。","维护制度安全，就是要毫不动摇坚持和完善中国特色社会主义制度。","维护意识形态安全，就是要毫不动摇坚持和巩固 马克思主义在意识形态领域的指导地位，不断巩固全党全国人民团结奋斗的共同思想基础。","政治安全与人民安全、国家利益至上是有机统一的。 政治安全是维护人民安全和国家利益的根本保证；人民安全居于中心地位，国家安全归根到底是保障人民利益；国家利益至上是实现政治安全和人民安全的要求和原则。"]},{"title":"3、维护重点领域国家安全","paragraphs":["维护重点领域国家安全是主阵地、主战场。","维护国土安全。国土安全是立国之基。","维护经济安全。经济安全是国家安全的基础。","维护社会安全。社会安全是人民群众安全感的晴雨表，是社会安定的风向标。"]},{"title":"（三）开创新时代国家安全工作新局面","paragraphs":["健全完善国家安全体系。健全国家安全体系、加强国家安全制度建设，是保障国家安全的治本之策，是维护和塑造国家安全的重要支撑。"]}]},{"title":"十四、建设巩固国防和强大人民军队","id":"chapter-15","index":15,"source":"讲义第 106–110 页","blocks":[{"title":"（一）新时代人民军队使命任务","paragraphs":["进入新时代， 以习近平同志为核心的党中央着眼实现中华民族伟大复兴这个国家和民族最高利益， 对人民军队使命任务作出新定位、 提出新要求，概括起来就是 “四个战略支撑”。","为巩固中国共产党领导和我国社会主义制度 提供战略支撑。为捍卫国家主权、统一和领土完整提供战略支撑。为维护我国海外利益提供战略支撑。为促进世界和平与发展提供战略支撑。"]},{"title":"1、强军目标的科学内涵","paragraphs":["党的十九大明确提出，党在新时代的强军目标是建设一支 听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。","听党指挥是灵魂，决定军队建设的政治方向。","能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。 人民军队必须牢固树立战斗力这个唯一的根本的标准。能打仗、打胜仗是军队的根本价值所在。","作风优良是保证，关系军队的性质、宗旨、本色。"]},{"title":"2、全面推进国防和军队现代化的战略安排","paragraphs":["党的十九大提出，确保到2020 年基本实现机械化，信息化建设取得重大进展，战略能力有大的提升，力争到 2035 年基本实现国防和军队现代化，到本世纪中叶把人民军队全面建成世界一流军队。","党的十九届五中全会进一步充实了国防和军队现代化的目标任务和发展步骤，明确提出确保 2027 年实现建军一百年奋斗目标。力争到 2035 年基本实现国防和军队现代化，到本世纪中叶把人民军队全面建成世界一流军队。 这形成了国防和军队现代化新“三步走”战略安排。"]},{"title":"1、坚持党对人民军队的绝对领导","paragraphs":["党对人民军队的绝对领导，是建军之本、强军之魂。","军委主席负责制是坚持党对人民军队绝对领导的根本制度和根本实现形式，在党领导军队的一整套制度体系中处于最高层次、居于统领地位。"]},{"title":"2、坚持政治建军、改革强军、科技强军、人才强军、依法治军","paragraphs":["政治建军是人民军队的立军之本。政治工作永远是人民军队的生命线。","改革是决定人民军队发展壮大、制胜未来的关键一招。","科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。","强军之道，要在得人。坚持政治标准是人民军队人才第一位的标准，坚持把 能打仗、打胜仗作为人才工作出发点和落脚点。","依法治军是我们党建军治军基本方式。","【总结】习近平强军思想","习近平强军思想的主要内容集中体现为“十一个明确”：明确党对人民军队的绝对领导是人民军队建军之本、强军之魂；","明确强国必须强军；","明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队；","明确军队是要准备打仗的；","明确推进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治军；","明确改革是强军的必由之路；","明确科技是核心战斗力；","明确强军之道要在得人；","明确依法治军是我们党建军治军基本方式；","明确军民融合发展是兴国之举、强军之策；","明确作风优良是我军鲜明特色和政治优势。","【拓展】中央军委政治工作会议","党的十八大以来， 我们深入推进政治建军理论探索和实践创造，形成了新时代政治建军方略，明确政治建军是人民军队立军之本，明确政治工作永远是我军的生命线，明确政治整训要突出政治上的正本清源，明确掌握思想领导是掌握一切领导的基础，明确党的力量来自组织、 部队凝聚力战斗力来自组织， 明确枪杆子要始终掌握在对党忠诚可靠的人手中，明确严才能正纲纪、严才能肃军威、严才能出战斗力，明确军中绝不能有腐败分子藏身之地，明确作风优良才能塑造英雄部队，明确军政军民团结是我军胜利法宝。 对新时代政治建军方略，要全面准确学习领会，毫不动摇贯彻落实，并在实践中不断丰富发展。"]}]},{"title":"十五、坚持“一国两制”和推进祖国完全统一","id":"chapter-16","index":16,"source":"讲义第 110–112 页","blocks":[{"title":"（一）全面准确理解和贯彻“一国两制”方针","paragraphs":["“一国两制”的根本宗旨是 维护国家主权、安全、发展利益，保持香港、澳门长期繁荣稳定。","维护国家主权、安全、发展利益是“一国两制”方针的最高原则，“一国”是实行“两制”的前提和基础， “两制”从属和派生于“一国”,并统一于“一国”之内。","坚持中央全面管治权和保障特别行政区高度自治权相统一。","坚定落实“爱国者治港” “爱国者治澳”原则。","坚持依法治港治澳。宪法和基本法共同构成特别行政区的宪制基础。"]},{"title":"1、坚持贯彻新时代党解决台湾问题的总体方略","paragraphs":["①必须坚持党中央对对台工作的集中统一领导，这是统一的根本保证；","②坚持在中华民族伟大复兴进程中推进祖国统一，这是统一的历史方位；","③坚持在祖国大陆发展进步基础上解决台湾问题，这是统一的战略思路；","④坚持“和平统一、一国两制”基本方针，这是统一的大政方针；","⑤坚持一个中国原则和“九二共识”,这是统一的政治基础；","⑥坚持推动两岸关系和平发展、融合发展，这是统一的实践途径；","⑦坚持团结台湾同胞、争取台湾民心，这是统一的根本动力；","⑧坚持粉碎“台独”分裂图谋，这是统一的必然要求；","⑨坚持反对外部势力干涉，这是统一的外部条件；","⑩坚持决不承诺放弃使用武力，这是统一的战略支撑。"]},{"title":"2、牢牢把握两岸关系主导权和主动权","paragraphs":["“和平统一、一国两制”方针是实现两岸统一的最佳方式。"]}]},{"title":"十六、中国特色大国外交和推动构建人类命运共同体","id":"chapter-17","index":17,"source":"讲义第 112–116 页","blocks":[{"title":"1、中国必须有自己特色的大国外交","paragraphs":["中国特色大国外交牢牢把握 服务民族复兴、促进人类进步 这条主线。中国特色大国外交以推动构建人类命运共同体为总目标，始终坚持维护世界和平、促进共同发展 的宗旨，为建设更加美好的世界贡献智慧和力量。"]},{"title":"2、我国国际影响力、感召力、塑造力显著提升","paragraphs":["中国始终高举和平、发展、合作、共赢 旗帜。不断拓展全方位、多层次、立体化 外交布局，打造遍布全球的朋友圈。","积极推动全球治理，倡导共商共建共享的全球治理观。"]},{"title":"1、坚持走和平发展道路","paragraphs":["坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择，是新时代中国外交的基本原则。"]},{"title":"2、推动构建新型国际关系","paragraphs":["推动构建新型国际关系，就是要 秉持相互尊重、公平正义、合作共赢 原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路。"]},{"title":"3、坚决维护国家主权、安全、发展利益","paragraphs":["维护国家主权、安全、发展利益 是我国对外工作的出发点和落脚点， 是中国外交的神圣使命。"]},{"title":"4、坚持外交为民","paragraphs":["人民外交是中国共产党的一个创举，也是中国外交的力量源泉。"]},{"title":"（三）推动构建人类命运共同体","paragraphs":["推动构建人类命运共同体，是当代中国共产党人回答和解决关乎人类前途命运的时代之问的中国方案， 是应对人类共同挑战、建设更加繁荣美好世界的人间正道， 也是新时代对外工作的总目标。"]},{"title":"1、构建人类命运共同体是世界各国人民前途所在","paragraphs":["构建人类命运共同体，就是要携手世界各国人民 共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。"]},{"title":"2、推动构建人类命运共同体的价值基础和重要依托","paragraphs":["推动构建人类命运共同体，必须弘扬全人类共同价值。和平、发展、 公平、正义、民主、自由，是全人类的共同价值，也是联合国的崇高目标。","2021 年 9 月，习近平总书记在第七十六届联合国大会上提出全球发展倡议。全球发展倡议，倡导各国坚持发展优先，坚持以人民为中心，坚持普惠包容，坚持创新驱动，坚持人与自然和谐共生，坚持行动导向，共同推动全球发展迈向平衡协调包容新阶段。","2022 年4 月， 习近平总书记在博鳌亚洲论坛年会上提出全球安全倡议。 全球安全倡议，倡导各国坚持共同、综合、合作、可持续的安全观，坚持尊重各国主权和领土完整、不干涉别国内政，坚持遵守联合国宪章宗旨和原则，坚持重视各国合理安全关切，坚持通过对话协商以和平方式解决国家间的分歧和争端，坚持统筹维护传统领域和非传统领域安全。","2023 年3 月， 习近平总书记在中国共产党与世界政党高层对话会上提出全球文明倡议。","全球文明倡议，倡导尊重世界文明多样性，倡导弘扬全人类共同价值，倡导重视文明传承和创新，倡导加强国际人文交流合作。","2025 年 9 月 1 日，习近平总书记在天津举办的“上海合作组织+”会议上首次提出全球治理倡议，奉行主权平等； 遵守国际法治； 践行多边主义； 倡导以人为本； 注重行动导向。"]},{"title":"3、积极参与全球治理体系改革和建设","paragraphs":["多边主义符合各国人民利益，是维护和平、促进发展的有效路径。"]},{"title":"4、高质量共建“一带一路”","paragraphs":["2013 年，习近平提出了共同建设“丝绸之路经济带”和“21 世纪海上丝绸之路”的倡议，受到国际社会普遍欢迎。","共建“一带一路”,秉持共商共建共享原则，坚持开放、绿色、廉洁理念，以高标准、可持续、惠民生为目标， 全面推进政策沟通、设施联通、贸易畅通、资金融通、民心相通，努力建设和平之路、繁荣之路、开放之路、绿色之路、创新之路、文明之路。","这一倡议的核心内涵，是促进 基础设施建设和互联互通，加强经济政策协调和发展战略对接，促进协同联动发展，实现共同繁荣。","我们推动把基础设施“硬联通”作为重要方向，把规则标准“软联通”作为重要支撑，把同共建国家人民“心联通”作为重要基础，取得实打实、沉甸甸的成就。","【总结】习近平外交思想","坚持以维护党中央权威为统领加强党对对外工作的集中统一领导坚持以实现中华民族伟大复兴为使命推进中国特色大国外交坚持以维护世界和平、促进共同发展为宗旨推动构建人类命运共同体坚持以中国特色社会主义为根本增强战略自信坚持以共商共建共享为原则推动“一带一路”建设坚持以相互尊重、合作共赢为基础走和平发展道路坚持以深化外交布局为依托打造全球伙伴关系坚持以公平正义为理念引领全球治理体系改革坚持以国家核心利益为底线维护国家主权、安全、发展利益坚持以对外工作优良传统和时代特征相结合为方向塑造中国外交独特风范","【拓展】中央外事工作会议","党的十八大以来， 在推进新时代中国特色社会主义事业的伟大征程中， 对外工作取得历史性成就、发生历史性变革。一是创立和发展了习近平外交思想，开辟了中国外交理论和实践的新境界，为推进中国特色大国外交提供了根本遵循。 二是彰显了我国外交鲜明的中国特色、中国风格、中国气派，树立了自信自立、胸怀天下、开放包容的大国形象。三是倡导构建人类命运共同体， 指明了人类社会共同发展、 长治久安、 文明互鉴的正确方向。四是坚持元首外交战略引领，在国际事务中日益发挥重要和建设性作用。五是全面运筹同各方关系，推动构建和平共处、总体稳定、均衡发展的大国关系格局。 六是拓展全方位战略布局，形成了范围广、质量高的全球伙伴关系网络。七是推动高质量共建“一带一路”，搭建了世界上范围最广、规模最大的国际合作平台。八是统筹发展和安全，以坚定意志和顽强斗争有效维护国家主权、 安全、 发展利益。 九是积极参与全球治理， 引领国际体系和秩序变革方向。十是加强党中央集中统一领导，巩固了对外工作大协同格局。","会议指出，在新时代外交工作实践中，我们积累了一系列宝贵经验。","必须做到坚持原则。 必须体现大国担当， 坚持弘扬独立自主精神， 坚持引领和平发展，坚持促进世界稳定和繁荣。必须树立系统观念。必须坚持守正创新。必须发扬斗争精神。","必须发挥制度优势。","构建人类命运共同体是习近平外交思想的核心理念，是我们不断深化对人类社会发展规律认识，对建设一个什么样的世界、怎样建设这个世界给出的中国方案，体现了中国共产党人的世界观、 秩序观、 价值观， 顺应了各国人民的普遍愿望， 指明了世界文明进步的方向，是新时代中国特色大国外交追求的崇高目标。 新时代以来，构建人类命运共同体从中国倡议扩大为国际共识， 从美好愿景转化为丰富实践， 从理念主张发展为科学体系， 成为引领时代前进的光辉旗帜。概括地讲， 构建人类命运共同体， 是以建设持久和平、 普遍安全、共同繁荣、开放包容、清洁美丽的世界为努力目标，以推动共商共建共享的全球治理为实现路径，以践行全人类共同价值为普遍遵循，以推动构建新型国际关系为基本支撑，以落实全球发展倡议、全球安全倡议、全球文明倡议为战略引领，以高质量共建“一带一路”为实践平台，推动各国携手应对挑战、实现共同繁荣， 推动世界走向和平、安全、繁荣、进步的光明前景。","针对当今世界面临的一系列重大问题重大挑战， 我们倡导平等有序的世界多极化和普惠包容的经济全球化。","外交守正创新是新征程上开创中国特色大国外交新局面的必然要求，是更好支撑中国式现代化的必然要求。"]}]},{"title":"十七、全面从严治党","id":"chapter-18","index":18,"source":"讲义第 116–122 页","blocks":[{"title":"（一）全面从严治党是新时代党的建设的鲜明主题","paragraphs":["全面建设社会主义现代化国家、 全面推进中华民族伟大复兴，关键在党， 关键在全面从严治党。","全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明主题。"]},{"title":"1、打铁必须自身硬","paragraphs":["加强党的自身建设是新形势下 推进伟大事业、进行伟大斗争、实现伟大梦想 的必然要求。","加强党的自身建设是把党锻造成为坚强有力的马克思主义执政党的迫切需要。 党面临的执政考验、改革开放考验、市场经济考验、外部环境考验将长期存在，精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险将长期存在。"]},{"title":"2、坚定不移全面从严治党","paragraphs":["全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。","全面从严治党是一项管党治党的系统工程， 要落实新时代党的建设总要求，把全的要求、严的基调、治的理念落实到全面从严治党全过程。"]},{"title":"1、把党的政治建设摆在首位","paragraphs":["党的政治建设是党的根本性建设。","旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求。","保证全党服从中央，维护党中央权威和集中统一领导，是党的政治建设的首要任务。","团结统一是党的生命，是党的力量所在。","要坚决维护习近平同志党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导，始终在思想上政治上行动上同党中央保持高度一致。"]},{"title":"2、思想建设是党的基础性建设","paragraphs":["加强思想建设是坚守理想信念、坚定革命意志的前提。"]},{"title":"3、贯彻新时代党的组织路线","paragraphs":["党的力量来自组织，党的全面领导、党的全部工作要靠党的坚强组织体系去实现。","严密党的组织体系是重点。我们党建立了包括党的中央组织、地方组织、基层组织在内的上下贯通、执行有力的严密组织体系。","建设高素质专业化干部队伍是关键。忠诚干净担当是党对领导干部提出的政治要求。"]},{"title":"4、以严的基调强化正风肃纪","paragraphs":["党的作风就是党的形象，关系人心向背，关系党的生死存亡。","作风问题核心是党同人民群众的关系问题。","加强纪律建设是全面从严治党的治本之策， 纪律严明是加强和规范党内政治生活的内在要求和重要保证。"]},{"title":"5、把制度建设贯穿到党的各项建设之中","paragraphs":["坚持制度治党、依规治党，就是靠制度管权、管事、管人。党内法规是全面从严治党的重要制度支撑。要坚持以党章为根本，以民主集中制为核心，以党的建设新形势新任务新要求为牵引，与时俱进制定和修订党内法规制度。","党内监督是永葆党的肌体健康的生命之源，在党和国家各种监督形式中是最根本的、第一位的。"]},{"title":"（三）坚定不移推进反腐败斗争","paragraphs":["腐败是危害党的生命力和战斗力的最大毒瘤，是党长期执政面临的最大威胁。反腐败是最彻底的自我革命，是全面从严治党的“必答题”。","坚持不敢腐、不能腐、不想腐一体推进。"]},{"title":"1、党的自我革命是跳出历史周期率的第二个答案","paragraphs":["毛泽东在延安的窑洞里给出了第一个答案，这就是“让人民来监督政府”。经过百年奋斗特别是党的十八大以来新的实践，党又给出了第二个答案，这就是自我革命。"]},{"title":"2、时刻保持解决大党独有难题的清醒和坚定","paragraphs":["如何始终不忘初心、牢记使命，如何始终统一思想、统一意志、统一行动，如何始终具备强大的执政能力和领导水平，如何始终保持干事创业精神状态，如何始终能够及时发现和解决自身存在的问题，如何始终保持风清气正的政治生态，都是我们这个大党必须解决的独有难题。","时刻保持解决大党独有难题的清醒和坚定， 展现了我们党历经百年沧桑依然风华正茂的精神状态。全党同志务必不忘初心、 牢记使命，务必谦虚谨慎、 艰苦奋斗，务必敢于斗争、善于斗争。"]}]}];
    const STORAGE_KEY = "political-theory-part3-progress-v1";
    const FONT_KEY = "political-theory-part3-font-v1";
    const state = {
      chapterIndex: 0,
      recallMode: false,
      completed: new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")),
      fontScale: Number(localStorage.getItem(FONT_KEY) || "1")
    };

    const elements = {
      chapterStrip: document.getElementById("chapterStrip"),
      topChapterTitle: document.getElementById("topChapterTitle"),
      content: document.getElementById("content"),
      searchInput: document.getElementById("searchInput"),
      recallButton: document.getElementById("recallButton"),
      doneButton: document.getElementById("doneButton"),
      prevButton: document.getElementById("prevButton"),
      nextButton: document.getElementById("nextButton"),
      chapterCount: document.getElementById("chapterCount"),
      menuButton: document.getElementById("menuButton"),
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      drawerClose: document.getElementById("drawerClose"),
      drawerList: document.getElementById("drawerList"),
      drawerProgress: document.getElementById("drawerProgress"),
      fontDown: document.getElementById("fontDown"),
      fontUp: document.getElementById("fontUp")
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }

    function isKeyParagraph(text) {
      return /【.+?】|是指|是.*的|核心|根本|本质|关键|目标|原则|必须|地位|意义|总任务|总目标/.test(text);
    }

    function renderChapterStrip() {
      elements.chapterStrip.innerHTML = BOOK_DATA.map((chapter, index) => `
        <button class="chapter-chip ${index === state.chapterIndex ? "is-active" : ""}" type="button" data-chapter="${index}">${index === 0 ? "导论" : `第${index}章`}</button>
      `).join("");
      elements.chapterStrip.querySelectorAll("[data-chapter]").forEach((button) => {
        button.addEventListener("click", () => switchChapter(Number(button.dataset.chapter)));
      });
      requestAnimationFrame(() => elements.chapterStrip.querySelector(".is-active")?.scrollIntoView({ block: "nearest", inline: "center" }));
    }

    function renderDrawer() {
      const done = state.completed.size;
      elements.drawerProgress.textContent = `${done} / ${BOOK_DATA.length} 章`;
      elements.drawerList.innerHTML = BOOK_DATA.map((chapter, index) => `
        <button class="drawer-item ${index === state.chapterIndex ? "is-active" : ""} ${state.completed.has(chapter.id) ? "is-done" : ""}" type="button" data-drawer-chapter="${index}">
          <span class="drawer-item__num">${String(index + 1).padStart(2, "0")}</span>
          <span class="drawer-item__title">${escapeHtml(chapter.title)}</span>
          <span class="drawer-item__dot"></span>
        </button>
      `).join("");
      elements.drawerList.querySelectorAll("[data-drawer-chapter]").forEach((button) => {
        button.addEventListener("click", () => { switchChapter(Number(button.dataset.drawerChapter)); closeDrawer(); });
      });
    }

    function renderContent() {
      const chapter = BOOK_DATA[state.chapterIndex];
      elements.content.innerHTML = chapter.blocks.map((block, index) => `
        <article class="knowledge-card" data-search-text="${escapeHtml(`${block.title} ${block.paragraphs.join(" ")}`.toLowerCase())}">
          <button class="card-head" type="button" aria-expanded="true">
            <span class="card-index">${String(index + 1).padStart(2, "0")}</span>
            <span class="card-title">${escapeHtml(block.title)}</span>
            <span class="card-arrow" aria-hidden="true"></span>
          </button>
          <div class="card-body">
            ${block.paragraphs.map((paragraph) => `<p data-key="${isKeyParagraph(paragraph)}">${escapeHtml(paragraph)}</p>`).join("")}
            <button class="recall-cover" type="button">先在心里复述，再点此查看</button>
          </div>
        </article>
      `).join("");

      elements.content.querySelectorAll(".knowledge-card").forEach((card) => {
        const head = card.querySelector(".card-head");
        head.addEventListener("click", () => {
          card.classList.toggle("is-collapsed");
          head.setAttribute("aria-expanded", String(!card.classList.contains("is-collapsed")));
        });
        card.querySelector(".recall-cover").addEventListener("click", () => card.classList.add("is-revealed"));
      });
    }

    function renderChapter() {
      const chapter = BOOK_DATA[state.chapterIndex];
      elements.topChapterTitle.textContent = chapter.title;
      elements.chapterCount.textContent = `${state.chapterIndex + 1} / ${BOOK_DATA.length}`;
      elements.prevButton.disabled = state.chapterIndex === 0;
      elements.nextButton.disabled = state.chapterIndex === BOOK_DATA.length - 1;
      elements.doneButton.classList.toggle("is-done", state.completed.has(chapter.id));
      elements.doneButton.textContent = state.completed.has(chapter.id) ? "已完成" : "已背";
      elements.searchInput.value = "";
      renderChapterStrip();
      renderContent();
      renderDrawer();
      document.title = `${chapter.title}｜新思想概论背诵版`;
    }

    function switchChapter(index) {
      if (index < 0 || index >= BOOK_DATA.length) return;
      state.chapterIndex = index;
      renderChapter();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function filterCurrentChapter() {
      const keyword = elements.searchInput.value.trim().toLowerCase();
      let visible = 0;
      elements.content.querySelectorAll(".knowledge-card").forEach((card) => {
        const matched = !keyword || card.dataset.searchText.includes(keyword);
        card.classList.toggle("is-filtered", !matched);
        if (matched) visible += 1;
      });
      let empty = elements.content.querySelector(".empty-state");
      if (!visible && !empty) {
        empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "本章没有匹配内容";
        elements.content.appendChild(empty);
      } else if (visible && empty) {
        empty.remove();
      }
    }

    function toggleRecallMode() {
      state.recallMode = !state.recallMode;
      document.body.classList.toggle("recall-mode", state.recallMode);
      elements.recallButton.classList.toggle("is-active", state.recallMode);
      elements.recallButton.textContent = state.recallMode ? "退出背诵" : "背诵";
      elements.content.querySelectorAll(".knowledge-card").forEach((card) => card.classList.remove("is-revealed"));
    }

    function toggleCompleted() {
      const id = BOOK_DATA[state.chapterIndex].id;
      state.completed.has(id) ? state.completed.delete(id) : state.completed.add(id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.completed]));
      renderChapter();
    }

    function setFontScale(next) {
      state.fontScale = Math.min(1.22, Math.max(.88, Number(next.toFixed(2))));
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
      localStorage.setItem(FONT_KEY, String(state.fontScale));
    }

    function openDrawer() {
      elements.drawerBackdrop.classList.add("is-open");
      elements.drawerBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      elements.drawerBackdrop.classList.remove("is-open");
      elements.drawerBackdrop.setAttribute("aria-hidden", "true");
    }

    elements.searchInput.addEventListener("input", filterCurrentChapter);
    elements.recallButton.addEventListener("click", toggleRecallMode);
    elements.doneButton.addEventListener("click", toggleCompleted);
    elements.prevButton.addEventListener("click", () => switchChapter(state.chapterIndex - 1));
    elements.nextButton.addEventListener("click", () => switchChapter(state.chapterIndex + 1));
    elements.menuButton.addEventListener("click", openDrawer);
    elements.drawerClose.addEventListener("click", closeDrawer);
    elements.drawerBackdrop.addEventListener("click", (event) => { if (event.target === elements.drawerBackdrop) closeDrawer(); });
    elements.fontDown.addEventListener("click", () => setFontScale(state.fontScale - .06));
    elements.fontUp.addEventListener("click", () => setFontScale(state.fontScale + .06));
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDrawer(); });

    setFontScale(state.fontScale);
    renderChapter();
  </script>
</body>
</html>
