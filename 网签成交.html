<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>网签成交</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f5f5f5; }
    body { display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    .page {
      position: relative;
      width: min(100vw, 375px);
      min-height: 982px;
      overflow: hidden;
      background: #f5f5f5;
    }
    .ui-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 2;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      outline: none;
    }
    .hotspot:focus-visible {
      border-radius: 10px;
      box-shadow: inset 0 0 0 2px #fd5d00;
    }
    .hotspot--back { left: 7px; top: 51px; width: 85px; height: 32px; }
    .hotspot--home { left: 50px; top: 51px; width: 42px; height: 32px; }
    .hotspot--prev { left: 24px; top: 174px; width: 32px; height: 32px; }
    .hotspot--next { left: 162px; top: 174px; width: 32px; height: 32px; }
    .hotspot--day3 { left: 165px; top: 243px; width: 45px; height: 44px; }
    .hotspot--day17 { left: 166px; top: 331px; width: 43px; height: 40px; }
    .hotspot--heat { left: 12px; right: 12px; top: 893px; height: 65px; }
    .notice {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      z-index: 8;
      max-width: calc(100vw - 32px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(48, 49, 51, 0.9);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }
    .notice.is-visible { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 431px) {
      body { padding: 16px 0; background: #f5f5f5; }
      .page { box-shadow: 0 18px 44px rgba(17, 24, 39, 0.18); }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="网签成交页面">
    <img class="ui-image" src="./assets/signing-transaction-ui.svg" alt="网签成交：2026年7月网签日历、当日成交概览、区域排行与网签热度入口" />
    <a class="hotspot hotspot--back" href="./安家成都-首页-扫码.html" aria-label="返回首页"></a>
    <a class="hotspot hotspot--home" href="./安家成都-首页-扫码.html" aria-label="回到首页"></a>
    <button class="hotspot hotspot--prev" type="button" data-notice="已切换到2026年6月" aria-label="查看上个月"></button>
    <button class="hotspot hotspot--next" type="button" data-notice="已切换到2026年8月" aria-label="查看下个月"></button>
    <button class="hotspot hotspot--day3" type="button" data-notice="7月3日：网签122套" aria-label="查看7月3日网签数据"></button>
    <button class="hotspot hotspot--day17" type="button" data-notice="7月17日：网签1322套" aria-label="查看7月17日网签数据"></button>
    <a class="hotspot hotspot--heat" href="./网签热力图.html" aria-label="查看网签热度地图"></a>
  </main>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <script>
    const notice = document.getElementById("notice");
    let noticeTimer = 0;
    document.querySelectorAll("[data-notice]").forEach((button) => {
      button.addEventListener("click", () => {
        window.clearTimeout(noticeTimer);
        notice.textContent = button.dataset.notice;
        notice.classList.add("is-visible");
        noticeTimer = window.setTimeout(() => notice.classList.remove("is-visible"), 1400);
      });
    });
  </script>
</body>
</html>
