<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>置业顾问登录</title><style>
:root{--brand:#fd5d00;--text:#303133;--muted:#909399}*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}main{max-width:430px;min-height:100dvh;margin:auto;background:linear-gradient(155deg,#fff0e3 0,white 39%);padding:24px 28px;display:flex;flex-direction:column}header{font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}.logo{background:var(--brand);color:white;border-radius:11px;width:34px;height:34px;display:grid;place-items:center;font-size:24px}.intro{padding:65px 0 35px}.tag{font-size:12px;color:var(--brand);letter-spacing:3px}h1{font-size:30px;margin:14px 0 12px;letter-spacing:1px}.intro p{font-size:14px;color:var(--muted)}label.field{display:block;font-size:14px;margin:22px 0 10px;font-weight:600}.input-row{display:flex;align-items:center;border-bottom:1px solid #e4e7ed;height:52px;gap:12px}.input-row:focus-within{border-color:var(--brand)}input[type=tel],input[type=text]{width:100%;min-width:0;border:0;background:transparent;font-size:17px;outline:0;padding:12px 0}input::placeholder{font-size:15px;color:#b2b5bb}.prefix{font-size:15px;border-right:1px solid #ddd;padding-right:12px}button{font-family:inherit;cursor:pointer}.code{border:0;background:none;color:var(--brand);white-space:nowrap;font-size:14px;padding:10px 0}.code:disabled{color:var(--muted);cursor:default}.primary{border:0;background:var(--brand);color:white;font-size:16px;font-weight:600;width:100%;height:50px;border-radius:10px;margin-top:17px}.legal{font-size:12px;color:#909399;line-height:1.9;display:flex;align-items:flex-start;gap:7px;margin-top:20px}.legal input{accent-color:var(--brand);margin:5px 0;width:16px;height:16px;flex-shrink:0}.link{border:0;background:none;color:#606266;font-size:12px;padding:0}.feedback{min-height:22px;font-size:12px;color:#d64715;margin-top:12px}footer{margin-top:auto;text-align:center;color:#aaa;font-size:11px;padding-top:70px;padding-bottom:15px;letter-spacing:2px}dialog{border:0;border-radius:16px;width:calc(100% - 40px);max-width:380px;padding:25px;color:var(--text)}dialog::backdrop{background:#0006}dialog h2{font-size:20px}dialog p{line-height:1.9;font-size:14px;color:#606266}button:focus-visible,a:focus-visible{outline:2px solid #303133;outline-offset:4px}
.mini-nav{height:44px;position:relative;justify-content:center;background:#fff;margin:-24px -28px 0;padding:0 95px;font-size:16px;flex-shrink:0}.mini-nav strong{white-space:nowrap}.mini-capsule{position:absolute;right:12px;top:6px;height:32px;width:84px;border:1px solid #e4e7ed;border-radius:20px;display:flex;align-items:center;justify-content:space-evenly;font-size:18px}.mini-capsule i{height:17px;width:1px;background:#ddd}</style></head><body><main><header class="mini-nav"><strong>置业顾问登录</strong><span class="mini-capsule" aria-hidden="true"><span>•••</span><i></i><span>◉</span></span></header><section class="intro"><span class="tag">连接客户 · 用心服务</span><h1>欢迎回来</h1><p>登录置业顾问工作台，开启高效服务</p></section><form id="login" novalidate><label class="field" for="phone">手机号</label><div class="input-row" data-annotation-id="phone"><span class="prefix">+86</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="11" placeholder="请输入手机号"></div><label class="field" for="code">验证码</label><div class="input-row" data-annotation-id="code"><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入短信验证码"><button class="code" id="send" type="button">获取验证码</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="primary" type="submit">登录</button><div class="legal" data-annotation-id="agreement"><input id="agree" type="checkbox" aria-label="同意用户协议和隐私协议"><span><label for="agree">我已阅读并同意</label><button type="button" class="link" data-policy="用户协议">《用户协议》</button>和<button type="button" class="link" data-policy="隐私协议">《隐私协议》</button></span></div></form><footer>专业服务，让安家更简单</footer></main><dialog id="policy" aria-labelledby="policyTitle"><h2 id="policyTitle"></h2><p>此处为原型展示占位，正式上线前需替换为平台审核通过的完整协议内容。</p><p id="policyText"></p><button class="primary" onclick="document.getElementById('policy').close()">关闭</button></dialog><script src="./assets/axhub-annotation.global.js"></script><script src="./assets/advisor-login.js"></script></body></html>
