<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>购房政策</title>
  <style>
    :root {
      --brand: #3478e5;
      --brand-deep: #173e78;
      --brand-soft: #edf5ff;
      --brand-pale: #f5f9ff;
      --text-primary: #14213a;
      --text-regular: #5f6570;
      --text-muted: #8a9099;
      --line: #dbe5f2;
      --page: #eef4fb;
      --surface: #ffffff;
      --phone-width: 425px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f2;
      color: var(--text-primary);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button {
      border: 0;
      margin: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid rgba(253, 93, 0, 0.5);
      outline-offset: 2px;
    }

    .policy-app {
      position: relative;
      width: min(100%, var(--phone-width));
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 96% 8%, rgba(127, 178, 235, 0.24), transparent 25%),
        linear-gradient(180deg, #fbfdff 0, var(--page) 260px, #f6f8fb 100%);
      box-shadow: 0 18px 52px rgba(31, 36, 48, 0.12);
    }

    /* 小程序顶部栏 */
    .mini-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 88px;
      background: #ffffff;
      box-shadow: 0 1px 0 rgba(231, 225, 220, 0.65);
    }

    .status-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 44px;
      padding: 0 19px 8px 21px;
      color: #000000;
      font-size: 15px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.2px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      display: block;
      width: auto;
      height: 13px;
    }

    .nav-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }

    .nav-title {
      margin: 0;
      color: #000000;
      font-size: 18px;
      line-height: 1;
      font-weight: 650;
    }

    .nav-back {
      position: absolute;
      left: 18px;
      top: 50%;
      display: grid;
      width: 32px;
      height: 36px;
      place-items: center;
      transform: translateY(-50%);
    }

    .nav-back svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: #000000;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .mini-actions {
      position: absolute;
      right: 6px;
      top: 50%;
      display: flex;
      align-items: center;
      width: 88px;
      height: 34px;
      transform: translateY(-50%);
      overflow: hidden;
      border: 1px solid #eceef1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
    }

    .mini-actions button {
      position: relative;
      display: grid;
      width: 44px;
      height: 100%;
      place-items: center;
    }

    .mini-actions button + button::before {
      position: absolute;
      left: 0;
      top: 7px;
      width: 1px;
      height: 20px;
      background: #e0e2e5;
      content: "";
    }

    .more-dots {
      display: flex;
      gap: 3px;
    }

    .more-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000000;
    }

    .mini-target {
      position: relative;
      width: 17px;
      height: 17px;
      border: 2px solid #000000;
      border-radius: 50%;
    }

    .mini-target::after {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000000;
      content: "";
      transform: translate(-50%, -50%);
    }

    /* 页面 Tab 与内容 */
    .policy-tabs {
      position: sticky;
      top: 88px;
      z-index: 19;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(236, 229, 223, 0.9);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
    }

    .policy-tab {
      position: relative;
      color: #4d535d;
      font-size: 14px;
      line-height: 42px;
      text-align: center;
    }

    .policy-tab::after {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 24px;
      height: 3px;
      border-radius: 2px 2px 0 0;
      background: var(--brand);
      content: "";
      opacity: 0;
      transform: translateX(-50%) scaleX(0.5);
      transition: 0.18s ease;
    }

    .policy-tab.is-active {
      color: var(--brand);
      font-weight: 600;
    }

    .policy-tab.is-active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    .policy-content {
      min-height: calc(100vh - 130px);
      padding: 12px 14px 32px;
      background: transparent;
    }

    .tab-panel[hidden] {
      display: none;
    }

    .policy-hero {
      position: relative;
      min-height: 154px;
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid rgba(116, 164, 221, 0.38);
      border-radius: 18px;
      color: var(--brand-deep);
      background:
        radial-gradient(circle at 84% 18%, rgba(255, 255, 255, 0.9), transparent 24%),
        linear-gradient(135deg, #fafdff 0%, #e9f3ff 56%, #d8eaff 100%);
      box-shadow: 0 12px 28px rgba(54, 107, 174, 0.15);
    }

    .policy-hero__content {
      position: relative;
      z-index: 2;
      padding: 18px 18px 15px;
    }

    .policy-hero__eyebrow {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      border: 1px solid rgba(52, 120, 229, 0.25);
      border-radius: 999px;
      color: #4776b1;
      background: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .policy-hero h2 {
      margin: 9px 0 3px;
      font-size: 22px;
      line-height: 30px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .policy-hero p {
      margin: 0;
      color: #667b98;
      font-size: 12px;
      line-height: 18px;
    }

    .policy-hero__stats {
      display: flex;
      gap: 18px;
      margin-top: 13px;
    }

    .policy-hero__stat {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-size: 11px;
      color: #71829a;
    }

    .policy-hero__stat strong {
      color: var(--brand);
      font-size: 18px;
      line-height: 22px;
    }

    .policy-hero__art {
      position: absolute;
      right: -6px;
      bottom: -2px;
      z-index: 1;
      width: 188px;
      height: 120px;
      color: #78a9e5;
    }

    .policy-sections {
      display: grid;
      gap: 10px;
      padding: 8px;
      border: 1px solid #7fa9dc;
      border-radius: 19px;
      background: linear-gradient(145deg, #bcd5f3, #3d72b6 96%);
      box-shadow:
        0 12px 26px rgba(31, 76, 133, 0.2),
        inset 0 0 0 3px rgba(255, 255, 255, 0.2);
    }

    .recent-section,
    .region-section {
      position: relative;
      padding: 14px;
      border: 1px solid #e4e9f0;
      border-radius: 16px;
      background:
        linear-gradient(90deg, rgba(228, 218, 201, 0.16) 0, transparent 8%, transparent 92%, rgba(228, 218, 201, 0.14) 100%),
        var(--surface);
      box-shadow:
        0 7px 18px rgba(31, 59, 93, 0.08),
        inset 0 0 18px rgba(220, 210, 193, 0.14);
    }

    .recent-section {
      min-height: 96px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      margin: 0;
      color: #11151c;
      font-size: 16px;
      line-height: 20px;
      font-weight: 650;
    }

    .section-heading--region::before {
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--section-accent, var(--brand));
      content: "";
    }

    .section-heading-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .section-kicker {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 16px;
    }

    .section-count {
      flex: 0 0 auto;
      min-width: 46px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--section-accent, var(--brand));
      background: var(--section-soft, var(--brand-soft));
      font-size: 11px;
      line-height: 24px;
      text-align: center;
    }

    .recent-clock {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--brand);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 44px;
      margin-top: 12px;
    }

    .recent-chip {
      display: grid;
      min-width: 0;
      min-height: 44px;
      padding: 6px 11px;
      border: 1px solid #dfe7f1;
      border-radius: 10px;
      color: var(--text-primary);
      background: linear-gradient(135deg, #ffffff, #f6f9fd);
      font-size: 13px;
      line-height: 18px;
      text-align: left;
      white-space: nowrap;
    }

    .recent-chip__feature {
      color: var(--text-muted);
      font-size: 9px;
      line-height: 13px;
    }

    .recent-chip.is-active {
      border-color: rgba(52, 120, 229, 0.42);
      color: var(--brand);
      background: var(--brand-soft);
    }

    .region-section {
      --section-accent: var(--brand);
      --section-soft: var(--brand-soft);
    }

    .district-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .district-button {
      position: relative;
      display: grid;
      align-content: center;
      min-width: 0;
      min-height: 62px;
      padding: 8px 8px 7px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--text-primary);
      background: linear-gradient(145deg, var(--section-soft), #ffffff 84%);
      text-align: left;
    }

    .district-button::after {
      position: absolute;
      right: -7px;
      bottom: -7px;
      width: 30px;
      height: 30px;
      border: 1px solid color-mix(in srgb, var(--section-accent) 30%, transparent);
      border-radius: 50%;
      content: "";
    }

    .district-button__name {
      position: relative;
      z-index: 1;
      overflow: hidden;
      font-size: 13px;
      line-height: 18px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .district-button__feature {
      position: relative;
      z-index: 1;
      margin-top: 3px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 9px;
      line-height: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .district-button.is-active {
      border-color: color-mix(in srgb, var(--section-accent) 42%, transparent);
      color: var(--section-accent);
      background: var(--section-soft);
      box-shadow: 0 5px 12px color-mix(in srgb, var(--section-accent) 12%, transparent);
    }

    .district-button:active,
    .recent-chip:active {
      opacity: 0.65;
    }

    .policy-type-section {
      overflow: hidden;
      padding: 16px 14px 18px;
      border: 8px solid #5f8fc8;
      border-radius: 19px;
      background:
        linear-gradient(90deg, rgba(228, 218, 201, 0.16), transparent 9%, transparent 91%, rgba(228, 218, 201, 0.14)),
        var(--surface);
      box-shadow:
        0 12px 26px rgba(31, 76, 133, 0.18),
        inset 0 0 18px rgba(220, 210, 193, 0.14);
    }

    .policy-type-intro {
      margin-bottom: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e3eaf3;
    }

    .policy-type-intro h2 {
      margin: 0;
      color: #11151c;
      font-size: 16px;
      line-height: 22px;
    }

    .policy-type-intro p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 16px;
    }

    .policy-type-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 12px;
    }

    .policy-type-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 36px;
      padding: 0 1px;
      border: 0;
      border-radius: 0;
      color: var(--text-primary);
      background: transparent;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      white-space: nowrap;
    }

    .policy-type-button.is-wide {
      grid-column: 1 / -1;
    }

    .policy-type-button.is-active {
      color: var(--brand);
      font-weight: 500;
    }

    .policy-type-button:active {
      opacity: 0.68;
    }

    /* 区县政策底部弹框 */
    .sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-layer[hidden] {
      display: none;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .policy-sheet {
      position: relative;
      z-index: 1;
      width: min(100%, var(--phone-width));
      max-height: min(80vh, 660px);
      overflow: hidden;
      border-radius: 22px 22px 0 0;
      border: 1px solid #bed2ec;
      border-bottom: 0;
      background: #f4f8fd;
      box-shadow: 0 -14px 40px rgba(31, 76, 133, 0.22);
      transform: translateY(100%);
      transition: transform 0.24s cubic-bezier(0.22, 0.76, 0.28, 1);
    }

    .policy-sheet:focus {
      outline: none;
    }

    .sheet-layer.is-open .sheet-backdrop {
      opacity: 1;
    }

    .sheet-layer.is-open .policy-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      display: block;
      width: 36px;
      height: 4px;
      margin: 9px auto 0;
      border-radius: 999px;
      background: #d9dadd;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 11px 16px 10px;
    }

    .sheet-heading {
      min-width: 0;
    }

    .sheet-title {
      margin: 0;
      color: #30343b;
      font-size: 19px;
      line-height: 27px;
      font-weight: 700;
    }

    .sheet-count {
      display: block;
      margin-top: 1px;
      color: var(--text-regular);
      font-size: 11px;
      line-height: 16px;
    }

    .sheet-close {
      display: grid;
      width: 32px;
      height: 32px;
      margin-left: auto;
      place-items: center;
      border: 1px solid #e2e5e9;
      border-radius: 50%;
      color: #68707d;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(31, 36, 48, 0.06);
    }

    .sheet-close svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2;
    }

    .policy-list {
      max-height: calc(min(80vh, 660px) - 150px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2px 14px calc(18px + env(safe-area-inset-bottom));
      scrollbar-width: none;
    }

    .policy-list::-webkit-scrollbar {
      display: none;
    }

    .policy-item {
      position: relative;
      width: 100%;
      min-height: 126px;
      margin-bottom: 10px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid #dfe8f3;
      border-radius: 14px;
      background:
        radial-gradient(circle at 100% 0, rgba(159, 195, 239, 0.2), transparent 32%),
        #ffffff;
      box-shadow: 0 7px 18px rgba(31, 76, 133, 0.07);
      text-align: left;
    }

    .policy-item::before {
      position: absolute;
      left: 0;
      top: 14px;
      width: 3px;
      height: 28px;
      border-radius: 0 3px 3px 0;
      background: var(--brand);
      content: "";
    }

    .policy-item__topline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .policy-status {
      flex: 0 0 auto;
      height: 21px;
      padding: 0 7px;
      border-radius: 999px;
      color: #2f8d55;
      background: #ecf8f1;
      font-size: 10px;
      line-height: 21px;
      font-weight: 650;
    }

    .policy-district {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .policy-item__title {
      display: block;
      color: #30343b;
      font-size: 15px;
      line-height: 21px;
      font-weight: 700;
    }

    .policy-item__summary {
      display: -webkit-box;
      margin: 6px 0 0;
      overflow: hidden;
      color: #707680;
      font-size: 11px;
      line-height: 17px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .policy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .policy-tag {
      min-height: 22px;
      padding: 1px 8px;
      border-radius: 5px;
      color: var(--brand);
      background: var(--brand-soft);
      font-size: 10px;
      line-height: 20px;
      white-space: nowrap;
    }

    .policy-period {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      color: #626873;
      font-size: 10px;
      line-height: 16px;
    }

    .policy-period svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: var(--brand);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .sheet-feature {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 14px 12px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--feature-accent, var(--brand)) 20%, transparent);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--feature-soft, var(--brand-soft)), #ffffff);
    }

    .sheet-feature[hidden] {
      display: none;
    }

    .sheet-feature__icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      color: #ffffff;
      background: var(--feature-accent, var(--brand));
      box-shadow: 0 5px 12px color-mix(in srgb, var(--feature-accent, var(--brand)) 24%, transparent);
    }

    .sheet-feature__icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .sheet-feature__title {
      display: block;
      color: var(--feature-accent, var(--brand));
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
    }

    .sheet-feature__note {
      display: block;
      margin-top: 1px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 15px;
    }

    .empty-state {
      padding: 42px 16px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 150;
      max-width: calc(100vw - 48px);
      padding: 9px 14px;
      border-radius: 6px;
      color: #ffffff;
      background: rgba(31, 36, 48, 0.86);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: 0.18s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 书本式政策导航：左侧区县书签，右侧政策结果常驻展示 */
    .legacy-policy-app,
    body > .sheet-layer,
    body > .toast:not(.book-toast) {
      display: none !important;
    }

    .policy-book-app.policy-app {
      --book-blue: #f47716;
      --book-blue-dark: #c94f00;
      --book-ink: #142441;
      --book-muted: #7b8799;
      --paper: #fffdf9;
      width: min(100%, 425px);
      max-width: 425px;
      min-width: 0;
      min-height: 100svh;
      flex: 0 1 425px;
      background:
        radial-gradient(circle at 82% 10%, rgba(255, 172, 94, 0.2), transparent 29%),
        linear-gradient(180deg, #fffdf9 0, #fff5e9 212px, #f7f1eb 100%);
    }

    .policy-book-app .mini-header {
      background: rgba(250, 253, 255, 0.94);
      box-shadow: none;
      backdrop-filter: blur(12px);
    }

    .book-hero {
      position: relative;
      height: 148px;
      overflow: hidden;
      padding: 22px 23px 0;
      color: var(--book-ink);
    }

    .book-hero::after {

          <header class="policy-type-intro">
            <h2>按支持类型查政策</h2>
            <p>汇总全市各区（市）县政策，选择你关注的支持方向</p>

    <button class="sheet-backdrop" id="policySheetBackdrop" type="button" aria-label="关闭政策列表弹框"></button>

          <h2 class="sheet-title" id="sheetTitle"></h2>

        </button>
      </header>

      <div class="policy-list" id="policyList"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const districtGroups = [

      "龙泉驿区": "东进门户 · 生态山居",
      "青白江区": "铁路港区 · 产城融合",
      "新都区": "北部新城 · 宜居活力",

    const districtTones = {
      future: { accent: "#f36a22", soft: "#fff1e8" },

    const districtGroupByName = Object.fromEntries(
      districtGroups.flatMap((group) => group.districts.map((district) => [district, group]))
    );

    function getDistrictProfile(district) {
      const group = districtGroupByName[district] || districtGroups[0];
      const tone = districtTones[group.tone] || districtTones.future;
      return {
        feature: districtFeatures[district] || "宜居成都 · 安心置业",
        note: `${group.name}特色 · ${group.subtitle}`,
        accent: tone.accent,
        soft: tone.soft

    }

    const districtOrder = districtGroups.flatMap((group) => group.districts);

    const policySupportDimensions = [
      "人才购房支持",
      "就学支持",
      "购房补贴支持",
      "购房消费券支持",
      "以旧换新支持",
      "交通优惠支持",
      "车位购买支持",
      "房票购房支持",
      "房票安置支持",
      "公房承租人购买新建商品住房补贴支持"
    ];

    const specialPolicies = {
      "四川天府新区": [
        {
          title: "四川天府新区购房补贴申领实施细则",
          tags: ["购房补贴支持", "公房承租人购买新建商品住房补贴支持"],
          start: "2026-01-01",
          end: "2026-12-31",
          summary: "面向符合条件的购房人提供住房消费支持。适用对象、补贴标准、申请材料和兑付流程以四川天府新区主管部门正式发布内容为准。"
        },
        {
          title: "四川天府新区人才安居购房支持办法",
          tags: ["人才购房支持", "就学支持"],
          start: "2026-03-01",
          end: "2027-02-28",
          summary: "面向符合条件的人才提供购房支持。人才认定、房源范围、支持标准和办理方式以四川天府新区主管部门正式发布内容为准。"
        }
      ],
      "成都东部新区": [
        {
          title: "成都东部新区人才购房支持办法",
          tags: ["人才购房支持", "就学支持"],
          start: "2026-01-08",
          end: "2029-01-08",
          summary: "面向符合条件的人才提供分层分类购房支持。具体申报范围、资格条件、补贴标准及办理材料，以主管部门正式发布的政策文件和申报通知为准。"
        },
        {
          title: "成都东部新区促进住房消费若干措施",
          tags: ["以旧换新支持", "交通优惠支持"],
          start: "2026-05-01",
          end: "2027-04-30",
          summary: "围绕合理住房需求和房地产市场平稳健康发展提供支持，具体适用条件和办理口径以正式政策文件为准。"
        }
      ],
      "成华区": [
        {
          title: "成华区人才安居购房支持办法",
          tags: ["人才购房支持", "就学支持"],
          start: "2026-12-12",
          end: "2027-12-12",
          summary: "面向符合条件的人才提供购房与安居支持。人才认定、房源范围、支持标准和办理方式以成华区主管部门正式发布内容为准。"
        },
        {
          title: "成华区促进住房消费若干措施",
          tags: ["以旧换新支持", "交通优惠支持"],
          start: "2026-12-12",
          end: "2027-12-12",
          summary: "围绕住房消费、存量住房改善和交通配套提供支持。适用条件、执行期限和申报方式以成华区正式政策文件为准。"
        }
      ],
      "龙泉驿区": [
        {
          title: "龙泉驿区购房补贴措施",
          tags: ["购房补贴支持", "车位购买支持"],
          start: "2026-02-13",
          end: "2026-12-31",
          summary: "对政策有效期内符合条件的购房人给予相应支持。补贴对象、房源范围、申请时限和审核方式以龙泉驿区相关部门公布内容为准。"
        }
      ],
      "青白江区": [
        {
          title: "关于2026年青白江区发放购房消费券",
          tags: ["购房消费券支持", "购房补贴支持"],
          start: "2026-01-01",
          end: "2026-12-31",
          summary: "通过购房消费券形式支持合理住房需求。适用房源、领取资格、核销规则及资金安排以青白江区正式活动通知为准。"
        }
      ],
      "简阳市": [
        {
          title: "简阳市房票购房支持政策",
          tags: ["房票购房支持", "房票安置支持"],
          start: "2026-03-31",
          end: "2028-03-30",
          summary: "针对符合条件的房票使用人提供购房支持。房票适用范围、使用期限、抵扣方式和办理流程以简阳市正式政策文件为准。"
        }
      ],
      "彭州市": [
        {
          title: "彭州市购房补贴措施",
          tags: ["购房补贴支持", "车位购买支持"],
          start: "2026-01-04",
          end: "2027-01-03",
          summary: "对符合条件的住房消费给予购房补贴。申请对象、补贴金额、申报材料及兑付流程以彭州市主管部门公布的实施细则为准。"
        }
      ]
    };

    const fallbackTemplates = [
      {
        title: "人才安居购房支持办法",
        tags: ["人才购房支持", "就学支持"],
        start: "2026-03-01",
        end: "2027-02-28",
        summary: "面向符合条件的人才提供购房支持。人才认定、房源范围、支持标准和办理方式以属地区县主管部门正式发布内容为准。"
      },
      {
        title: "促进住房消费若干措施",
        tags: ["以旧换新支持", "交通优惠支持"],
        start: "2026-05-01",
        end: "2027-04-30",
        summary: "围绕合理住房需求和房地产市场平稳健康发展提供支持。适用条件、执行期限和办理口径以属地区县正式政策文件为准。"
      }
    ];

    const policiesByDistrict = Object.fromEntries(districtOrder.map((district) => {
      const policies = [...(specialPolicies[district] || [])];
      for (const template of fallbackTemplates) {
        if (policies.length >= 2) break;
        policies.push({ ...template, title: `${district}${template.title}` });
      }
      return [district, policies.map((policy, index) => ({
        ...policy,
        id: `${district}-${index}`,
        district
      }))];
    }));

    const allPolicies = districtOrder.flatMap((district) => policiesByDistrict[district]);

    if (false) {
    const regionSections = document.getElementById("regionSections");
    const recentList = document.getElementById("recentList");
    const policyTypeGrid = document.getElementById("policyTypeGrid");
    const districtTabPanel = document.getElementById("districtTabPanel");
    const policyTypeTabPanel = document.getElementById("policyTypeTabPanel");
    const policyTabs = [...document.querySelectorAll("[data-policy-tab]")];
    const policySheetLayer = document.getElementById("policySheetLayer");
    const policySheet = document.getElementById("policySheet");
    const policySheetBackdrop = document.getElementById("policySheetBackdrop");
    const policySheetClose = document.getElementById("policySheetClose");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetCount = document.getElementById("sheetCount");
    const sheetFeature = document.getElementById("sheetFeature");
    const policyList = document.getElementById("policyList");
    const policyBack = document.getElementById("policyBack");
    const moreAction = document.getElementById("moreAction");
    const closeAction = document.getElementById("closeAction");
    const toast = document.getElementById("toast");

    let activeDistrict = "";
    let activePolicyType = "";
    let activeTab = "district";
    let lastFocusedElement = null;
    let toastTimer = null;
    let recentDistricts = readRecentDistricts();

    function readRecentDistricts() {
      try {
        const stored = JSON.parse(localStorage.getItem("policyRecentDistricts") || "null");
        if (Array.isArray(stored)) {
          const valid = stored.filter((district) => districtOrder.includes(district));
          if (valid.length) return valid.slice(0, 4);
        }
      } catch (error) {
        console.warn("无法读取最近查看记录", error);
      }
      return ["成华区", "成都东部新区"];
    }

    function saveRecentDistricts() {
      try {
        localStorage.setItem("policyRecentDistricts", JSON.stringify(recentDistricts));
      } catch (error) {
        console.warn("无法保存最近查看记录", error);
      }
    }

    function renderRegions() {
      regionSections.innerHTML = districtGroups.map((group, index) => {
        const tone = districtTones[group.tone];
        return `
        <section
          class="region-section"
          aria-labelledby="regionTitle${index}"
          style="--section-accent:${tone.accent};--section-soft:${tone.soft}"
        >
          <header class="section-heading-wrap">
            <span>
              <h2 class="section-heading section-heading--region" id="regionTitle${index}">${group.name}</h2>
              <p class="section-kicker">${group.subtitle}</p>
            </span>
            <span class="section-count">${group.districts.length}个区域</span>
          </header>
          <div class="district-grid">
            ${group.districts.map((district) => `
              <button
                class="district-button${district === activeDistrict ? " is-active" : ""}"
                type="button"
                data-district="${district}"
                aria-haspopup="dialog"
              >
                <span class="district-button__name">${district}</span>
                <span class="district-button__feature">${districtFeatures[district]}</span>
              </button>
            `).join("")}
          </div>
        </section>
      `;
      }).join("");
    }

    function renderRecent() {
      recentList.innerHTML = recentDistricts.map((district) => `
        <button
          class="recent-chip${district === activeDistrict ? " is-active" : ""}"
          type="button"
          data-district="${district}"
          aria-haspopup="dialog"
        >
          <span>${district}</span>
          <span class="recent-chip__feature">${districtFeatures[district]}</span>
        </button>
      `).join("");
    }

    function renderPolicyTypes() {
      policyTypeGrid.innerHTML = policySupportDimensions.map((type) => `
        <button
          class="policy-type-button${type === activePolicyType ? " is-active" : ""}${type.length > 10 ? " is-wide" : ""}"
          type="button"
          data-policy-type="${type}"
          aria-haspopup="dialog"
        >${type}</button>
      `).join("");
    }

    function renderPolicyResults(title, policies, emptyText, featureProfile) {
      sheetTitle.textContent = title;
      sheetCount.textContent = `共收录 ${policies.length} 项相关政策`;

      if (featureProfile) {
        sheetFeature.hidden = false;
        sheetFeature.style.setProperty("--feature-accent", featureProfile.accent);
        sheetFeature.style.setProperty("--feature-soft", featureProfile.soft);
        sheetFeature.innerHTML = `
          <span class="sheet-feature__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M8 20v-6h8v6M2 20h20" /></svg>
          </span>
          <span>
            <strong class="sheet-feature__title">${featureProfile.feature}</strong>
            <small class="sheet-feature__note">${featureProfile.note}</small>
          </span>
        `;
      } else {
        sheetFeature.hidden = true;
        sheetFeature.innerHTML = "";
      }

      if (!policies.length) {
        policyList.innerHTML = `<div class="empty-state">${emptyText}</div>`;
        return;
      }

      policyList.innerHTML = policies.map((policy) => `
        <article class="policy-item">
          <span class="policy-item__topline">
            <span class="policy-status">有效期内</span>
            <span class="policy-district">${policy.district}</span>
          </span>
          <strong class="policy-item__title">${policy.title}</strong>
          <p class="policy-item__summary">${policy.summary}</p>
          <span class="policy-tags">
            ${policy.tags.map((tag) => `<span class="policy-tag">${tag}</span>`).join("")}
          </span>
          <time class="policy-period" datetime="${policy.start}">
            <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="4" width="13" height="11" rx="2" /><path d="M5 2.5V5M13 2.5V5M3 7.5h12" /></svg>
            ${policy.start} 至 ${policy.end}
          </time>
        </article>
      `).join("");
      policyList.scrollTop = 0;
    }

    function updateActiveDistrict() {
      document.querySelectorAll("[data-district]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.district === activeDistrict);
      });
    }

    function updateActivePolicyType() {
      document.querySelectorAll("[data-policy-type]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.policyType === activePolicyType);
      });
    }

    function showPolicySheet() {
      policySheetLayer.hidden = false;
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => {
        policySheetLayer.classList.add("is-open");
        policySheet.focus({ preventScroll: true });
      });
    }

    function openDistrictPolicies(district, trigger) {
      if (!districtOrder.includes(district)) return;

      activeDistrict = district;
      lastFocusedElement = trigger || document.activeElement;
      recentDistricts = [district, ...recentDistricts.filter((item) => item !== district)].slice(0, 4);
      saveRecentDistricts();
      renderRecent();
      updateActiveDistrict();
      renderPolicyResults(
        `${district}政策`,
        policiesByDistrict[district] || [],
        "该区域暂无已收录政策",
        getDistrictProfile(district)
      );

      showPolicySheet();
    }

    function openPolicyTypePolicies(type, trigger) {
      if (!policySupportDimensions.includes(type)) return;

      activePolicyType = type;
      lastFocusedElement = trigger || document.activeElement;
      updateActivePolicyType();
      const matchedPolicies = allPolicies.filter((policy) => policy.tags.includes(type));
      renderPolicyResults(type, matchedPolicies, "该购房支持维度暂无已收录政策", {
        feature: "全城政策汇总",
        note: "按支持类型匹配成都各区（市）县相关政策",
        accent: "#3478e5",
        soft: "#edf5ff"
      });

      showPolicySheet();
    }

    function switchPolicyTab(tab) {
      if (!['district', 'policy'].includes(tab)) return;
      activeTab = tab;
      policyTabs.forEach((button) => {
        const isActive = button.dataset.policyTab === tab;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      districtTabPanel.hidden = tab !== "district";
      policyTypeTabPanel.hidden = tab !== "policy";
    }

    function closePolicySheet() {
      policySheetLayer.classList.remove("is-open");
      document.body.style.overflow = "";
      window.setTimeout(() => {
        policySheetLayer.hidden = true;
        lastFocusedElement?.focus?.({ preventScroll: true });
      }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 240);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1600);
    }

    function navigateBack() {
      if (!policySheetLayer.hidden) {
        closePolicySheet();
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./安家成都-首页-扫码.html";
      }
    }

    document.addEventListener("click", (event) => {
      const policyTypeButton = event.target.closest("[data-policy-type]");
      if (policyTypeButton) {
        openPolicyTypePolicies(policyTypeButton.dataset.policyType, policyTypeButton);
        return;
      }

      const districtButton = event.target.closest("[data-district]");
      if (districtButton) {
        openDistrictPolicies(districtButton.dataset.district, districtButton);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !policySheetLayer.hidden) {
        closePolicySheet();
      }

      if (event.key === "Tab" && !policySheetLayer.hidden) {
        const focusable = [...policySheet.querySelectorAll("button:not([hidden])")]
          .filter((element) => element.offsetParent !== null);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      }
    });

    policySheetBackdrop.addEventListener("click", closePolicySheet);
    policySheetClose.addEventListener("click", closePolicySheet);
    policyBack.addEventListener("click", navigateBack);
    closeAction.addEventListener("click", navigateBack);
    moreAction.addEventListener("click", () => showToast("更多功能正在完善中"));
    policyTabs.forEach((button) => {
      button.addEventListener("click", () => switchPolicyTab(button.dataset.policyTab));
    });

    renderRegions();
    renderRecent();
    renderPolicyTypes();

    const previewParams = new URLSearchParams(window.location.search);
    const previewTab = previewParams.get("tab");
    const previewDistrict = previewParams.get("district");
    const previewPolicyType = previewParams.get("type");
    if (previewTab === "policy") {
      switchPolicyTab("policy");
    }
    if (previewDistrict && districtOrder.includes(previewDistrict)) {
      window.setTimeout(() => openDistrictPolicies(previewDistrict), 80);
    } else if (previewPolicyType && policySupportDimensions.includes(previewPolicyType)) {
      switchPolicyTab("policy");
      window.setTimeout(() => openPolicyTypePolicies(previewPolicyType), 80);
    }
    }

    const bookmarkNav = document.getElementById("bookmarkNav");
    const resultsScroll = document.getElementById("resultsScroll");
    const resultFilters = document.getElementById("resultFilters");
    const inlinePolicyList = document.getElementById("inlinePolicyList");
    const bookPolicyBack = document.getElementById("bookPolicyBack");
    const bookMoreAction = document.getElementById("bookMoreAction");
    const bookCloseAction = document.getElementById("bookCloseAction");
    const bookToast = document.getElementById("bookToast");

    let bookActiveDistrict = "锦江区";
    let bookActiveFilter = "全部";
    let bookToastTimer = null;

    function renderBookmarks() {
      bookmarkNav.innerHTML = districtGroups.map((group) => {
        const tone = districtTones[group.tone];
        return `
          <section class="bookmark-group" aria-label="${group.name}">
            <p class="bookmark-group__label">${group.name}</p>
            ${group.districts.map((district) => `
              <button
                class="district-bookmark${district === bookActiveDistrict ? " is-active" : ""}"
                type="button"
                data-book-district="${district}"
                aria-pressed="${district === bookActiveDistrict}"
                style="--bookmark-accent:${tone.accent}"
              >
                <span class="district-bookmark__name">${district}</span>
                <span class="district-bookmark__arrow" aria-hidden="true">›</span>
              </button>
            `).join("")}
          </section>
        `;
      }).join("");
    }

    function updateBookmarkSelection() {
      bookmarkNav.querySelectorAll("[data-book-district]").forEach((button) => {
        const isActive = button.dataset.bookDistrict === bookActiveDistrict;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function getPolicyVisual(policy) {
      const key = policy.tags.join("|");
      if (/人才/.test(key)) {
        return {
          accent: "#e94d7b",
          soft: "#fdebf2"
        };
      }
      if (/补贴|消费券/.test(key)) {
        return {
          accent: "#f0a23a",
          soft: "#fff3e3"
        };
      }
      if (/交通|车位/.test(key)) {
        return {
          accent: "#36a975",
          soft: "#e8f8f0"
        };
      }
      if (/就学/.test(key)) {
        return {
          accent: "#7b78e8",
          soft: "#eeeeff"
        };
      }
      return {
        accent: "#4c8ee8",
        soft: "#eaf3ff"
      };
    }

    function renderBookFilters() {
      resultFilters.innerHTML = ["全部", ...policySupportDimensions].map((type) => `
        <button
          class="result-filter${type === bookActiveFilter ? " is-active" : ""}"
          type="button"
          data-book-filter="${type}"
          aria-pressed="${type === bookActiveFilter}"
        >${type}</button>
      `).join("");
    }

    function renderInlinePolicyCard(policy) {
      const visual = getPolicyVisual(policy);
      return `
        <article class="inline-policy-card" style="--card-accent:${visual.accent};--card-soft:${visual.soft}">
          <div class="inline-policy-card__body">
            <h4>${policy.title}</h4>
            <div class="inline-policy-tags">
              ${policy.tags.map((tag) => `<span class="inline-policy-tag">${tag}</span>`).join("")}
            </div>
            <time class="inline-policy-period" datetime="${policy.start}">
              <span>有效期：${policy.start} 至 ${policy.end}</span>
            </time>
          </div>
        </article>
      `;
    }

    function renderBookResults(resetScroll = false) {
      const policies = policiesByDistrict[bookActiveDistrict] || [];
      const filteredPolicies = bookActiveFilter === "全部"
        ? policies
        : policies.filter((policy) => policy.tags.includes(bookActiveFilter));
      inlinePolicyList.innerHTML = filteredPolicies.length
        ? filteredPolicies.map(renderInlinePolicyCard).join("")
        : `<div class="inline-empty">该区县暂无“${bookActiveFilter}”相关政策<br>可切换其他政策类型查看</div>`;
      renderBookFilters();
      if (resetScroll) resultsScroll.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showBookToast(message) {
      window.clearTimeout(bookToastTimer);
      bookToast.textContent = message;
      bookToast.classList.add("is-visible");
      bookToastTimer = window.setTimeout(() => bookToast.classList.remove("is-visible"), 1700);
    }

    function navigateBookBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./安家成都-首页-扫码.html";
      }
    }

    bookmarkNav.addEventListener("click", (event) => {
      const button = event.target.closest("[data-book-district]");
      if (!button) return;
      bookActiveDistrict = button.dataset.bookDistrict;
      bookActiveFilter = "全部";
      updateBookmarkSelection();
      renderBookResults(true);
    });

    resultFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-book-filter]");
      if (!button) return;
      bookActiveFilter = button.dataset.bookFilter;
      renderBookResults(false);
    });

    bookPolicyBack.addEventListener("click", navigateBookBack);
    bookCloseAction.addEventListener("click", navigateBookBack);
    bookMoreAction.addEventListener("click", () => showBookToast("更多政策服务正在完善中"));

    const bookPreviewParams = new URLSearchParams(window.location.search);
    const bookPreviewDistrict = bookPreviewParams.get("district");
    const bookPreviewType = bookPreviewParams.get("type");
    if (bookPreviewDistrict && districtOrder.includes(bookPreviewDistrict)) {
      bookActiveDistrict = bookPreviewDistrict;
    }
    if (bookPreviewType && policySupportDimensions.includes(bookPreviewType)) {
      bookActiveFilter = bookPreviewType;
    }

    renderBookmarks();
    renderBookResults(false);
  </script>
</body>
</html>
