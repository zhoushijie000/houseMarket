<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>购房政策</title>
  <style>
    :root {
      --brand: #fd5d00;
      --brand-soft: #fff0e9;
      --text-primary: #1f2430;
      --text-regular: #5f6570;
      --text-muted: #8a9099;
      --line: #e4e7ed;
      --page: #fdf9f5;
      --surface: #ffffff;
      --phone-width: 375px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f2;
      color: var(--text-primary);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button {
      border: 0;
      margin: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid rgba(253, 93, 0, 0.5);
      outline-offset: 2px;
    }

    .policy-app {
      position: relative;
      width: min(100%, var(--phone-width));
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--page);
      box-shadow: 0 18px 52px rgba(31, 36, 48, 0.12);
    }

    /* 小程序顶部栏 */
    .mini-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 88px;
      background: #ffffff;
    }

    .status-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 44px;
      padding: 0 19px 8px 21px;
      color: #000000;
      font-size: 15px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.2px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      display: block;
      width: auto;
      height: 13px;
    }

    .nav-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }

    .nav-title {
      margin: 0;
      color: #000000;
      font-size: 18px;
      line-height: 1;
      font-weight: 650;
    }

    .nav-back {
      position: absolute;
      left: 18px;
      top: 50%;
      display: grid;
      width: 32px;
      height: 36px;
      place-items: center;
      transform: translateY(-50%);
    }

    .nav-back svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: #000000;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .mini-actions {
      position: absolute;
      right: 6px;
      top: 50%;
      display: flex;
      align-items: center;
      width: 88px;
      height: 34px;
      transform: translateY(-50%);
      overflow: hidden;
      border: 1px solid #eceef1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
    }

    .mini-actions button {
      position: relative;
      display: grid;
      width: 44px;
      height: 100%;
      place-items: center;
    }

    .mini-actions button + button::before {
      position: absolute;
      left: 0;
      top: 7px;
      width: 1px;
      height: 20px;
      background: #e0e2e5;
      content: "";
    }

    .more-dots {
      display: flex;
      gap: 3px;
    }

    .more-dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000000;
    }

    .mini-target {
      position: relative;
      width: 17px;
      height: 17px;
      border: 2px solid #000000;
      border-radius: 50%;
    }

    .mini-target::after {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000000;
      content: "";
      transform: translate(-50%, -50%);
    }

    /* 页面 Tab 与内容 */
    .policy-tabs {
      position: sticky;
      top: 88px;
      z-index: 19;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(228, 231, 237, 0.78);
      background: rgba(253, 249, 245, 0.97);
      backdrop-filter: blur(10px);
    }

    .policy-tab {
      position: relative;
      color: #4d535d;
      font-size: 14px;
      line-height: 42px;
      text-align: center;
    }

    .policy-tab::after {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 24px;
      height: 3px;
      border-radius: 2px 2px 0 0;
      background: var(--brand);
      content: "";
      opacity: 0;
      transform: translateX(-50%) scaleX(0.5);
      transition: 0.18s ease;
    }

    .policy-tab.is-active {
      color: var(--brand);
      font-weight: 600;
    }

    .policy-tab.is-active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    .policy-content {
      min-height: calc(100vh - 130px);
      padding: 12px 16px 28px;
      background: var(--page);
    }

    .tab-panel[hidden] {
      display: none;
    }

    .policy-sections {
      overflow: hidden;
      border-radius: 12px 12px 0 0;
      background: var(--surface);
    }

    .recent-section,
    .region-section {
      position: relative;
      padding: 14px 12px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .recent-section {
      min-height: 84px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      margin: 0;
      color: #11151c;
      font-size: 16px;
      line-height: 20px;
      font-weight: 650;
    }

    .section-heading--region::before {
      width: 4px;
      height: 16px;
      border-radius: 2px;
      background: var(--brand);
      content: "";
    }

    .recent-clock {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--brand);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      min-height: 32px;
      margin-top: 12px;
    }

    .recent-chip {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text-primary);
      background: #ffffff;
      font-size: 14px;
      line-height: 30px;
      white-space: nowrap;
    }

    .recent-chip.is-active {
      border-color: rgba(253, 93, 0, 0.36);
      color: var(--brand);
      background: #fffaf7;
    }

    .region-section {
      padding-top: 15px;
    }

    .district-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 9px;
    }

    .district-button {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 48px;
      padding: 0 1px;
      color: var(--text-primary);
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      white-space: nowrap;
    }

    .district-button.is-active {
      color: var(--brand);
      font-weight: 500;
    }

    .district-button:active,
    .recent-chip:active {
      opacity: 0.65;
    }

    .policy-type-section {
      overflow: hidden;
      padding: 10px 12px 14px;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .policy-type-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 12px;
    }

    .policy-type-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 36px;
      padding: 0 1px;
      border: 0;
      border-radius: 0;
      color: var(--text-primary);
      background: transparent;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      white-space: nowrap;
    }

    .policy-type-button.is-wide {
      grid-column: 1 / -1;
    }

    .policy-type-button.is-active {
      color: var(--brand);
      font-weight: 500;
    }

    .policy-type-button:active {
      opacity: 0.68;
    }

    /* 区县政策底部弹框 */
    .sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-layer[hidden] {
      display: none;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .policy-sheet {
      position: relative;
      z-index: 1;
      width: min(100%, var(--phone-width));
      max-height: min(70vh, 520px);
      overflow: hidden;
      border-radius: 12px 12px 0 0;
      background: #ffffff;
      box-shadow: 0 -8px 30px rgba(31, 36, 48, 0.12);
      transform: translateY(100%);
      transition: transform 0.24s cubic-bezier(0.22, 0.76, 0.28, 1);
    }

    .policy-sheet:focus {
      outline: none;
    }

    .sheet-layer.is-open .sheet-backdrop {
      opacity: 1;
    }

    .sheet-layer.is-open .policy-sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      min-height: 62px;
      padding: 16px 16px 13px;
    }

    .sheet-title {
      margin: 0;
      color: #30343b;
      font-size: 18px;
      line-height: 26px;
      font-weight: 650;
    }

    .sheet-count {
      margin-left: 9px;
      color: var(--text-regular);
      font-size: 14px;
      line-height: 24px;
    }

    .sheet-close {
      display: grid;
      width: 32px;
      height: 32px;
      margin-left: auto;
      place-items: center;
      border: 1px solid #e2e5e9;
      border-radius: 50%;
      color: #68707d;
    }

    .sheet-close svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2;
    }

    .policy-list {
      max-height: calc(min(70vh, 520px) - 62px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 16px env(safe-area-inset-bottom);
      scrollbar-width: none;
    }

    .policy-list::-webkit-scrollbar {
      display: none;
    }

    .policy-item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24px;
      gap: 8px;
      width: 100%;
      min-height: 112px;
      padding: 14px 0 12px;
      border-top: 1px solid #edf0f3;
      text-align: left;
    }

    .policy-item:first-child {
      border-top: 0;
    }

    .policy-item__title {
      display: block;
      overflow: hidden;
      color: #30343b;
      font-size: 16px;
      line-height: 22px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .policy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
    }

    .policy-tag {
      min-height: 24px;
      padding: 2px 9px;
      color: var(--brand);
      background: var(--brand-soft);
      font-size: 13px;
      line-height: 20px;
      white-space: nowrap;
    }

    .policy-period {
      display: block;
      margin-top: 5px;
      color: #626873;
      font-size: 14px;
      line-height: 20px;
    }

    .policy-item__arrow {
      align-self: center;
      justify-self: end;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #68707d;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.3;
    }

    .empty-state {
      padding: 42px 16px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 150;
      max-width: calc(100vw - 48px);
      padding: 9px 14px;
      border-radius: 6px;
      color: #ffffff;
      background: rgba(31, 36, 48, 0.86);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: 0.18s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 360px) {
      .policy-content {
        padding-right: 12px;
        padding-left: 12px;
      }

      .district-button {
        font-size: 13px;
      }

      .policy-type-button {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet-backdrop,
      .policy-sheet,
      .toast {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="policy-app">
    <header class="mini-header">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons">

          <svg viewBox="0 0 17 13"><path d="M1 4.7C5.2.7 11.8.7 16 4.7M3.8 7.4c2.7-2.5 6.7-2.5 9.4 0M6.7 10c1-1 2.6-1 3.6 0M8.5 12h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          <svg viewBox="0 0 25 13"><rect x=".7" y=".7" width="21" height="11.6" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" /><rect x="2.7" y="2.7" width="17" height="7.6" rx="1" fill="currentColor" /><path d="M23 4.2v4.6c1-.2 1.5-.9 1.5-2.3S24 4.4 23 4.2Z" fill="currentColor" /></svg>

      </div>

      <div class="nav-bar">
        <button class="nav-back" id="policyBack" type="button" aria-label="返回首页">

            <span class="more-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button id="closeAction" type="button" aria-label="关闭页面">
            <span class="mini-target" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <nav class="policy-tabs" role="tablist" aria-label="政策筛选方式">
      <button
        class="policy-tab is-active"
        id="districtTab"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="districtTabPanel"
        data-policy-tab="district"
      >区市县</button>
      <button
        class="policy-tab"
        id="policyTypeTab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="policyTypeTabPanel"
        data-policy-tab="policy"
      >政策类型</button>
    </nav>

    <div class="policy-content">
      <section class="tab-panel" id="districtTabPanel" role="tabpanel" aria-labelledby="districtTab">
        <div class="policy-sections">
          <section class="recent-section" aria-labelledby="recentTitle">
            <h2 class="section-heading" id="recentTitle">
              <svg class="recent-clock" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" /><path d="M9 5v4h3" /></svg>
              最近查看
            </h2>
            <div class="recent-list" id="recentList"></div>
          </section>

          <div id="regionSections"></div>
        </div>
      </section>

      <section class="tab-panel" id="policyTypeTabPanel" role="tabpanel" aria-labelledby="policyTypeTab" hidden>
        <div class="policy-type-section">
          <div class="policy-type-grid" id="policyTypeGrid" aria-label="购房支持政策维度"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="sheet-layer" id="policySheetLayer" hidden>
    <button class="sheet-backdrop" id="policySheetBackdrop" type="button" aria-label="关闭政策列表弹框"></button>
    <section class="policy-sheet" id="policySheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <header class="sheet-header">
        <h2 class="sheet-title" id="sheetTitle"></h2>
        <span class="sheet-count" id="sheetCount"></span>
        <button class="sheet-close" id="policySheetClose" type="button" aria-label="关闭弹框">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 4 12 12M16 4 4 16" /></svg>
        </button>
      </header>
      <div class="policy-list" id="policyList"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      "青白江区": [
        {
          title: "关于2026年青白江区发放购房消费券",
          tags: ["购房消费券支持", "购房补贴支持"],
          start: "2026-01-01",
          end: "2026-12-31",
          summary: "通过购房消费券形式支持合理住房需求。适用房源、领取资格、核销规则及资金安排以青白江区正式活动通知为准。"
        }
      ],
      "简阳市": [
        {
          title: "简阳市房票购房支持政策",
          tags: ["房票购房支持", "房票安置支持"],
          start: "2026-03-31",
          end: "2028-03-30",
          summary: "针对符合条件的房票使用人提供购房支持。房票适用范围、使用期限、抵扣方式和办理流程以简阳市正式政策文件为准。"
        }
      ],
      "彭州市": [
        {
          title: "彭州市购房补贴措施",
          tags: ["购房补贴支持", "车位购买支持"],
          start: "2026-01-04",
          end: "2027-01-03",
          summary: "对符合条件的住房消费给予购房补贴。申请对象、补贴金额、申报材料及兑付流程以彭州市主管部门公布的实施细则为准。"
        }
      ]
    };

    const fallbackTemplates = [
      {
        title: "人才安居购房支持办法",
        tags: ["人才购房支持", "就学支持"],
        start: "2026-03-01",
        end: "2027-02-28",
        summary: "面向符合条件的人才提供购房支持。人才认定、房源范围、支持标准和办理方式以属地区县主管部门正式发布内容为准。"
      },
      {
        title: "促进住房消费若干措施",
        tags: ["以旧换新支持", "交通优惠支持"],
        start: "2026-05-01",
        end: "2027-04-30",
        summary: "围绕合理住房需求和房地产市场平稳健康发展提供支持。适用条件、执行期限和办理口径以属地区县正式政策文件为准。"
      }
    ];

    const policiesByDistrict = Object.fromEntries(districtOrder.map((district) => {
      const policies = [...(specialPolicies[district] || [])];
      for (const template of fallbackTemplates) {
        if (policies.length >= 2) break;
        policies.push({ ...template, title: `${district}${template.title}` });
      }
      return [district, policies.map((policy, index) => ({
        ...policy,
        id: `${district}-${index}`,
        district
      }))];
    }));

    const allPolicies = districtOrder.flatMap((district) => policiesByDistrict[district]);

    const regionSections = document.getElementById("regionSections");
    const recentList = document.getElementById("recentList");
    const policyTypeGrid = document.getElementById("policyTypeGrid");
    const districtTabPanel = document.getElementById("districtTabPanel");
    const policyTypeTabPanel = document.getElementById("policyTypeTabPanel");
    const policyTabs = [...document.querySelectorAll("[data-policy-tab]")];
    const policySheetLayer = document.getElementById("policySheetLayer");
    const policySheet = document.getElementById("policySheet");
    const policySheetBackdrop = document.getElementById("policySheetBackdrop");
    const policySheetClose = document.getElementById("policySheetClose");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetCount = document.getElementById("sheetCount");
    const policyList = document.getElementById("policyList");
    const policyBack = document.getElementById("policyBack");
    const moreAction = document.getElementById("moreAction");
    const closeAction = document.getElementById("closeAction");
    const toast = document.getElementById("toast");

    let activeDistrict = "";
    let activePolicyType = "";
    let activeTab = "district";
    let lastFocusedElement = null;
    let toastTimer = null;
    let recentDistricts = readRecentDistricts();

    function readRecentDistricts() {
      try {
        const stored = JSON.parse(localStorage.getItem("policyRecentDistricts") || "null");
        if (Array.isArray(stored)) {
          const valid = stored.filter((district) => districtOrder.includes(district));
          if (valid.length) return valid.slice(0, 4);
        }
      } catch (error) {
        console.warn("无法读取最近查看记录", error);
      }
      return ["成华区", "成都东部新区"];
    }

    function saveRecentDistricts() {
      try {
        localStorage.setItem("policyRecentDistricts", JSON.stringify(recentDistricts));
      } catch (error) {
        console.warn("无法保存最近查看记录", error);
      }
    }

    function renderRegions() {
      regionSections.innerHTML = districtGroups.map((group, index) => `
        <section class="region-section" aria-labelledby="regionTitle${index}">
          <h2 class="section-heading section-heading--region" id="regionTitle${index}">${group.name}</h2>
          <div class="district-grid">
            ${group.districts.map((district) => `
              <button
                class="district-button${district === activeDistrict ? " is-active" : ""}"
                type="button"
                data-district="${district}"
                aria-haspopup="dialog"
              >${district}</button>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderRecent() {
      recentList.innerHTML = recentDistricts.map((district) => `
        <button
          class="recent-chip${district === activeDistrict ? " is-active" : ""}"
          type="button"
          data-district="${district}"
          aria-haspopup="dialog"
        >${district}</button>
      `).join("");
    }

    function renderPolicyTypes() {
      policyTypeGrid.innerHTML = policySupportDimensions.map((type) => `
        <button
          class="policy-type-button${type === activePolicyType ? " is-active" : ""}${type.length > 10 ? " is-wide" : ""}"
          type="button"
          data-policy-type="${type}"
          aria-haspopup="dialog"
        >${type}</button>
      `).join("");
    }

    function renderPolicyResults(title, policies, emptyText) {
      sheetTitle.textContent = title;
      sheetCount.textContent = `共${policies.length}项`;

      if (!policies.length) {
        policyList.innerHTML = `<div class="empty-state">${emptyText}</div>`;
        return;
      }

      policyList.innerHTML = policies.map((policy) => `
        <article class="policy-item">
          <span>
            <strong class="policy-item__title">${policy.title}</strong>
            <span class="policy-tags">
              ${policy.tags.map((tag) => `<span class="policy-tag">${tag}</span>`).join("")}
            </span>
            <time class="policy-period" datetime="${policy.start}">${policy.start} 至 ${policy.end}</time>
          </span>
          <svg class="policy-item__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </article>
      `).join("");
      policyList.scrollTop = 0;
    }

    function updateActiveDistrict() {
      document.querySelectorAll("[data-district]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.district === activeDistrict);
      });
    }

    function updateActivePolicyType() {
      document.querySelectorAll("[data-policy-type]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.policyType === activePolicyType);
      });
    }

    function showPolicySheet() {
      policySheetLayer.hidden = false;
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => {
        policySheetLayer.classList.add("is-open");
        policySheet.focus({ preventScroll: true });
      });
    }

    function openDistrictPolicies(district, trigger) {
      if (!districtOrder.includes(district)) return;

      activeDistrict = district;
      lastFocusedElement = trigger || document.activeElement;
      recentDistricts = [district, ...recentDistricts.filter((item) => item !== district)].slice(0, 4);
      saveRecentDistricts();
      renderRecent();
      updateActiveDistrict();
      renderPolicyResults(`${district}政策`, policiesByDistrict[district] || [], "该区域暂无已收录政策");

      showPolicySheet();
    }

    function openPolicyTypePolicies(type, trigger) {
      if (!policySupportDimensions.includes(type)) return;

      activePolicyType = type;
      lastFocusedElement = trigger || document.activeElement;
      updateActivePolicyType();
      const matchedPolicies = allPolicies.filter((policy) => policy.tags.includes(type));
      renderPolicyResults(type, matchedPolicies, "该购房支持维度暂无已收录政策");

      showPolicySheet();
    }

    function switchPolicyTab(tab) {
      if (!['district', 'policy'].includes(tab)) return;
      activeTab = tab;
      policyTabs.forEach((button) => {
        const isActive = button.dataset.policyTab === tab;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      districtTabPanel.hidden = tab !== "district";
      policyTypeTabPanel.hidden = tab !== "policy";
    }

    function closePolicySheet() {
      policySheetLayer.classList.remove("is-open");
      document.body.style.overflow = "";
      window.setTimeout(() => {
        policySheetLayer.hidden = true;
        lastFocusedElement?.focus?.({ preventScroll: true });
      }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 240);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1600);
    }

    function navigateBack() {
      if (!policySheetLayer.hidden) {
        closePolicySheet();
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./安家成都-首页-扫码.html";
      }
    }

    document.addEventListener("click", (event) => {
      const policyTypeButton = event.target.closest("[data-policy-type]");
      if (policyTypeButton) {
        openPolicyTypePolicies(policyTypeButton.dataset.policyType, policyTypeButton);
        return;
      }

      const districtButton = event.target.closest("[data-district]");
      if (districtButton) {
        openDistrictPolicies(districtButton.dataset.district, districtButton);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !policySheetLayer.hidden) {
        closePolicySheet();
      }

      if (event.key === "Tab" && !policySheetLayer.hidden) {
        const focusable = [...policySheet.querySelectorAll("button:not([hidden])")]
          .filter((element) => element.offsetParent !== null);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      }
    });

    policySheetBackdrop.addEventListener("click", closePolicySheet);
    policySheetClose.addEventListener("click", closePolicySheet);
    policyBack.addEventListener("click", navigateBack);
    closeAction.addEventListener("click", navigateBack);
    moreAction.addEventListener("click", () => showToast("更多功能正在完善中"));
    policyTabs.forEach((button) => {
      button.addEventListener("click", () => switchPolicyTab(button.dataset.policyTab));
    });

    renderRegions();
    renderRecent();
    renderPolicyTypes();

    const previewParams = new URLSearchParams(window.location.search);
    const previewTab = previewParams.get("tab");
    const previewDistrict = previewParams.get("district");
    const previewPolicyType = previewParams.get("type");
    if (previewTab === "policy") {
      switchPolicyTab("policy");
    }
    if (previewDistrict && districtOrder.includes(previewDistrict)) {
      window.setTimeout(() => openDistrictPolicies(previewDistrict), 80);
    } else if (previewPolicyType && policySupportDimensions.includes(previewPolicyType)) {
      switchPolicyTab("policy");
      window.setTimeout(() => openPolicyTypePolicies(previewPolicyType), 80);
    }
  </script>
</body>
</html>
