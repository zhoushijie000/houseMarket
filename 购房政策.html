<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>购房政策</title>
  <style>
    :root {
      --brand: #fe6a16;
      --brand-strong: #fd5d00;
      --brand-soft: #fef0e7;
      --tag-soft: #fdefe9;
      --text-primary: #303133;
      --text-regular: #606266;
      --text-muted: #909399;
      --line: #e4e7ed;
      --panel: #fff9f2;
      --surface: #ffffff;
      --phone-width: 375px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #eef0f2;
      color: var(--text-primary);
    }

    body {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid rgba(254, 106, 22, 0.45);
      outline-offset: 1px;
    }

    .policy-app {
      width: min(100%, var(--phone-width));
      height: 100vh;
      height: 100svh;
      min-height: 568px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 18px 52px rgba(31, 36, 48, 0.12);
    }

    /* 小程序顶部栏 */
    .mini-header {
      position: relative;
      z-index: 10;
      height: 88px;
      background: #ffffff;
    }

    .status-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 44px;
      padding: 0 14px 8px 21px;
      color: #000000;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icons svg {
      display: block;
      width: auto;
      height: 13px;
    }

    .nav-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }

    .nav-title {
      margin: 0;
      color: #000000;
      font-size: 17px;
      font-weight: 600;
      line-height: 24px;
    }

    .nav-back {
      position: absolute;
      left: 20px;
      top: 8px;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
    }

    .nav-back svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: #000000;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mini-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: grid;
      grid-template-columns: 43px 1px 43px;
      align-items: center;
      width: 87px;
      height: 32px;
      overflow: hidden;
      border: 0.5px solid rgba(151, 151, 151, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
    }

    .mini-actions::after {
      width: 0.5px;
      height: 18.5px;
      background: rgba(0, 0, 0, 0.2);
      content: "";
    }

    .mini-actions button {
      display: grid;
      width: 43px;
      height: 31px;
      place-items: center;
    }

    .mini-actions button:last-child { grid-column: 3; }

    .more-dots {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .more-dots i {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #000000;
    }

    .more-dots i:nth-child(2) {
      width: 6.5px;
      height: 6.5px;
    }

    .mini-target {
      position: relative;
      width: 18px;
      height: 18px;
      border: 2px solid #000000;
      border-radius: 50%;
    }

    .mini-target::after {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #000000;
      content: "";
    }

    /* 左侧区县导航 + 右侧政策结果 */
    .policy-workspace {
      display: flex;
      height: calc(100% - 88px);
      background: #ffffff;
    }

    .district-sidebar {
      flex: 0 0 110px;
      width: 110px;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 40px;
      background: #ffffff;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .district-sidebar::-webkit-scrollbar,
    .results-page::-webkit-scrollbar,
    .policy-filters::-webkit-scrollbar { display: none; }

    .district-group__title {
      display: flex;
      align-items: flex-start;
      height: 29px;
      margin: 0;
      padding: 4px 16px 8px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 500;
      line-height: 17px;
      white-space: nowrap;
    }

    .district-group:first-child .district-group__title {
      height: 37px;
      padding-top: 12px;
    }

    .district-item {
      display: flex;
      align-items: center;
      width: 94px;
      height: 36px;
      margin: 0 8px;
      padding: 0 8px;
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
      text-align: left;
      white-space: nowrap;
    }

    .district-item.is-active {
      height: 32px;
      margin-top: 0;
      margin-bottom: 4px;
      background: var(--brand);
      color: #ffffff;
    }

    .results-page {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 12px 12px 34px;
      border-radius: 12px 0 0;
      background: var(--panel);
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .district-title {
      margin: 0;
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 600;
      line-height: 25px;
      white-space: nowrap;
    }

    .policy-filters {
      display: flex;
      gap: 8px;
      margin: 11px 0 0;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .policy-filter {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 12px;
      border: 0.5px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
      color: #1f2430;
      font-size: 12px;
      line-height: 31px;
      white-space: nowrap;
    }

    .policy-filter.is-active {
      border-color: transparent;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .policy-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .policy-card {
      min-height: 100px;
      padding: 12px;
      border-radius: 8px;
      background: #ffffff;
    }

    .policy-card h3 {
      margin: 0;
      overflow: hidden;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .policy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .policy-tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--tag-soft);
      color: var(--brand-strong);
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }

    .policy-period {
      display: flex;
      align-items: center;
      margin-top: 9px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 17px;
      white-space: nowrap;
    }

    .policy-period span {
      margin-left: 3px;
      color: var(--text-regular);
    }

    .policy-note {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin: 18px 4px 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 15.4px;
    }

    .policy-note svg {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      margin-top: 1px;
      fill: none;
      stroke: var(--brand-strong);
      stroke-width: 1.25;
    }

    .policy-empty {
      padding: 34px 14px;
      border-radius: 8px;
      background: #ffffff;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 20px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 24px;
      max-width: calc(min(100vw, var(--phone-width)) - 48px);
      padding: 9px 14px;
      border-radius: 8px;
      background: rgba(31, 36, 48, 0.88);
      color: #ffffff;
      font-size: 12px;
      line-height: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 340px) {
      .district-sidebar { flex-basis: 104px; width: 104px; }
      .district-item { width: 90px; margin-right: 7px; margin-left: 7px; }
      .district-group__title { padding-left: 14px; }
      .results-page { padding-right: 10px; padding-left: 10px; }
    }
  </style>
</head>
<body>
  <main class="policy-app">
    <header class="mini-header">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons">
          <svg viewBox="0 0 19 13"><path d="M1 12V9h2v3H1Zm4 0V6h2v6H5Zm4 0V4h2v8H9Zm4 0V1h2v11h-2Zm4 0V0h2v12h-2Z" fill="currentColor" /></svg>
          <svg viewBox="0 0 17 13"><path d="M1 4.7C5.2.7 11.8.7 16 4.7M3.8 7.4c2.7-2.5 6.7-2.5 9.4 0M6.7 10c1-1 2.6-1 3.6 0M8.5 12h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          <svg viewBox="0 0 25 13"><rect x=".7" y=".7" width="21" height="11.6" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" /><rect x="2.7" y="2.7" width="17" height="7.6" rx="1" fill="currentColor" /><path d="M23 4.2v4.6c1-.2 1.5-.9 1.5-2.3S24 4.4 23 4.2Z" fill="currentColor" /></svg>
        </span>
      </div>
      <div class="nav-bar">
        <button class="nav-back" id="policyBack" type="button" aria-label="返回首页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 19-7-7 7-7" /></svg>
        </button>
        <h1 class="nav-title">购房政策</h1>
        <div class="mini-actions" aria-label="页面操作">
          <button id="moreAction" type="button" aria-label="更多操作">
            <span class="more-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button id="closeAction" type="button" aria-label="关闭页面">
            <span class="mini-target" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="policy-workspace">
      <aside class="district-sidebar" id="districtSidebar" aria-label="成都区市县"></aside>
      <section class="results-page" id="resultsPage" aria-live="polite">
        <h2 class="district-title" id="districtTitle">四川天府新区</h2>
        <nav class="policy-filters" id="policyFilters" aria-label="政策类型筛选"></nav>
        <div class="policy-list" id="policyList"></div>
        <div class="policy-note">
          <svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.35" /><path d="M5 2.5v3.1M5 7.25h.01" stroke-linecap="round" /></svg>
          <span>政策具有时效性，具体执行以相关部门最新<br />发布为准</span>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const districtGroups = [
      { name: "城市新区", districts: ["四川天府新区", "成都东部新区", "成都高新区"] },
      {
        name: "中心城区",
        districts: [
          "锦江区", "青羊区", "金牛区", "武侯区", "成华区", "龙泉驿区",
          "青白江区", "新都区", "温江区", "双流区", "郫都区", "新津区"
        ]
      },
      {
        name: "县市新城",
        districts: [
          "简阳市", "都江堰市", "彭州市", "邛崃市",
          "崇州市", "金堂县", "大邑县", "蒲江县"
        ]
      }
    ];

    const policySupportDimensions = [
      "人才购房支持", "就学支持", "购房补贴支持", "购房消费券支持", "以旧换新支持",
      "交通优惠支持", "车位购买支持", "房票购房支持", "房票安置支持",
      "公房承租人购买新建商品住房补贴支持"
    ];

    const defaultPolicies = (district) => [
      {
        title: `${district}人才安居购房支持办法`,
        tags: ["人才购房支持", "就学支持"],
        start: "2026-03-01",
        end: "2027-02-28"
      },
      {
        title: `${district}促进住房消费若干措施`,
        tags: ["以旧换新支持", "交通优惠支持"],
        start: "2026-03-01",
        end: "2027-02-28"
      }
    ];

    const specialPolicies = {
      "四川天府新区": defaultPolicies("四川天府新区"),
      "成都东部新区": [
        { title: "成都东部新区人才购房支持办法", tags: ["人才购房支持", "就学支持"], start: "2026-01-08", end: "2029-01-08" },
        { title: "成都东部新区促进住房消费若干措施", tags: ["以旧换新支持", "交通优惠支持"], start: "2026-05-01", end: "2027-04-30" }
      ],
      "成华区": [
        { title: "成华区人才安居购房支持办法", tags: ["人才购房支持", "就学支持"], start: "2026-12-12", end: "2027-12-12" },
        { title: "成华区促进住房消费若干措施", tags: ["以旧换新支持", "交通优惠支持"], start: "2026-12-12", end: "2027-12-12" }
      ],
      "龙泉驿区": [
        { title: "龙泉驿区购房补贴措施", tags: ["购房补贴支持", "车位购买支持"], start: "2026-02-13", end: "2026-12-31" },
        defaultPolicies("龙泉驿区")[1]
      ],
      "青白江区": [
        { title: "关于2026年青白江区发放购房消费券", tags: ["购房消费券支持", "购房补贴支持"], start: "2026-01-01", end: "2026-12-31" },
        defaultPolicies("青白江区")[0]
      ],
      "简阳市": [
        { title: "简阳市房票购房支持政策", tags: ["房票购房支持", "房票安置支持"], start: "2026-03-31", end: "2028-03-30" },
        defaultPolicies("简阳市")[1]
      ],
      "彭州市": [
        { title: "彭州市购房补贴措施", tags: ["购房补贴支持", "车位购买支持"], start: "2026-01-04", end: "2027-01-03" },
        defaultPolicies("彭州市")[0]
      ]
    };

    const districtOrder = districtGroups.flatMap((group) => group.districts);
    const policiesByDistrict = Object.fromEntries(
      districtOrder.map((district) => [district, specialPolicies[district] || defaultPolicies(district)])
    );

    const districtSidebar = document.getElementById("districtSidebar");
    const districtTitle = document.getElementById("districtTitle");
    const policyFilters = document.getElementById("policyFilters");
    const policyList = document.getElementById("policyList");
    const resultsPage = document.getElementById("resultsPage");
    const policyBack = document.getElementById("policyBack");
    const moreAction = document.getElementById("moreAction");
    const closeAction = document.getElementById("closeAction");
    const toast = document.getElementById("toast");

    let activeDistrict = "四川天府新区";
    let activeFilter = "全部";
    let toastTimer = null;

    function renderDistricts() {
      districtSidebar.innerHTML = districtGroups.map((group) => `
        <section class="district-group" aria-label="${group.name}">
          <h2 class="district-group__title">${group.name}</h2>
          ${group.districts.map((district) => `
            <button class="district-item${district === activeDistrict ? " is-active" : ""}" type="button"
              data-district="${district}" aria-pressed="${district === activeDistrict}">${district}</button>
          `).join("")}
        </section>
      `).join("");
    }

    function renderFilters() {
      policyFilters.innerHTML = ["全部", ...policySupportDimensions].map((type) => `
        <button class="policy-filter${type === activeFilter ? " is-active" : ""}" type="button"
          data-filter="${type}" aria-pressed="${type === activeFilter}">${type}</button>
      `).join("");
    }

    function renderPolicyCard(policy) {
      return `
        <article class="policy-card">
          <h3 title="${policy.title}">${policy.title}</h3>
          <div class="policy-tags">${policy.tags.map((tag) => `<span class="policy-tag">${tag}</span>`).join("")}</div>
          <time class="policy-period" datetime="${policy.start}">有效期：<span>${policy.start} 至 ${policy.end}</span></time>
        </article>
      `;
    }

    function renderPolicies(resetScroll = false) {
      const policies = policiesByDistrict[activeDistrict] || [];
      const filteredPolicies = activeFilter === "全部"
        ? policies
        : policies.filter((policy) => policy.tags.includes(activeFilter));

      districtTitle.textContent = activeDistrict;
      policyList.innerHTML = filteredPolicies.length
        ? filteredPolicies.map(renderPolicyCard).join("")
        : `<div class="policy-empty">该区县暂无“${activeFilter}”相关政策<br />可切换其他政策类型查看</div>`;

      if (resetScroll) {
        resultsPage.scrollTo({ top: 0, behavior: "smooth" });
        policyFilters.scrollTo({ left: 0, behavior: "smooth" });
      }
    }

    function updateDistrictSelection() {
      districtSidebar.querySelectorAll("[data-district]").forEach((button) => {
        const isActive = button.dataset.district === activeDistrict;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1700);
    }

    function navigateBack() {
      if (window.history.length > 1) window.history.back();
      else window.location.href = "./安家成都-首页-扫码.html";
    }

    districtSidebar.addEventListener("click", (event) => {
      const button = event.target.closest("[data-district]");
      if (!button) return;
      activeDistrict = button.dataset.district;
      activeFilter = "全部";
      updateDistrictSelection();
      renderFilters();
      renderPolicies(true);
    });

    policyFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      renderFilters();
      renderPolicies(false);
      const selected = policyFilters.querySelector(`[data-filter="${CSS.escape(activeFilter)}"]`);
      selected?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    });

    policyBack.addEventListener("click", navigateBack);
    closeAction.addEventListener("click", navigateBack);
    moreAction.addEventListener("click", () => showToast("更多政策服务正在完善中"));

    const previewParams = new URLSearchParams(window.location.search);
    const previewDistrict = previewParams.get("district");
    const previewType = previewParams.get("type");
    if (previewDistrict && districtOrder.includes(previewDistrict)) activeDistrict = previewDistrict;
    if (previewType && policySupportDimensions.includes(previewType)) activeFilter = previewType;

    renderDistricts();
    renderFilters();
    renderPolicies(false);
  </script>
</body>
</html>
