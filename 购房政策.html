<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>购房政策</title>
  <style>
    :root {
      --brand: #fd5d00;
      --brand-light: #ff8f2e;
      --text-primary: #303133;
      --text-regular: #606266;
      --text-muted: #909399;
      --line: #e4e7ed;
      --page: #f3f5f6;
      --surface: #ffffff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-card: 0 4px 16px rgba(48, 49, 51, 0.05);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f1ed;
      color: var(--text-primary);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .policy-page {
      width: min(100vw, 375px);
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--page);
      box-shadow: 0 20px 50px rgba(48, 49, 51, 0.12);
    }

    .policy-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      border-bottom: 1px solid rgba(228, 231, 237, 0.7);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }

    .policy-topbar__title {
      margin: 0;
      color: #000000;
      font-size: 17px;
      line-height: 1;
      font-weight: 600;
    }

    .policy-back {
      position: absolute;
      left: 8px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .policy-back svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #111827;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .policy-actions {
      position: absolute;
      right: 8px;
      display: flex;
      align-items: center;
      height: 36px;
      overflow: hidden;
      border: 1px solid rgba(151, 151, 151, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
    }

    .policy-actions__button {
      position: relative;
      width: 42px;
      height: 36px;
      display: grid;
      place-items: center;
    }

    .policy-actions__button + .policy-actions__button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      width: 1px;
      height: 18px;
      background: rgba(144, 147, 153, 0.36);
    }

    .policy-actions__more {
      display: flex;
      gap: 3px;
    }

    .policy-actions__more i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #111827;
    }

    .policy-actions__target {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border: 2px solid #111827;
      border-radius: 50%;
    }

    .policy-actions__target::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #111827;
    }

    .policy-content {
      padding: 8px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    }

    .policy-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .policy-district-group {
      min-width: 0;
    }

    .policy-district-group__header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 30px;
      margin-bottom: 8px;
      padding-left: 9px;
      border-left: 3px solid var(--brand);
    }

    .policy-district-group__title {
      margin: 0;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 800;
    }

    .policy-district-group__cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .policy-card {
      display: flex;
      min-width: 0;
      min-height: 178px;
      flex-direction: column;
      padding: 12px;
      border: 1px solid rgba(228, 231, 237, 0.72);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }

    .policy-card__title {
      min-width: 0;
      margin: 0;
      color: #000000;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .policy-card__district {
      margin-top: 8px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .policy-card__period {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      margin-top: auto;
      padding-top: 12px;
      color: var(--text-muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .policy-card__period time {
      color: var(--text-regular);
      font-weight: 700;
    }

    .policy-card__detail {
      width: 100%;
      min-height: 32px;
      margin-top: 10px;
      padding: 0 10px;
      border-radius: 999px;
      background: #fff1e8;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }

    .policy-card__detail:active {
      background: linear-gradient(90deg, var(--brand), var(--brand-light));
      color: #ffffff;
    }

    .policy-empty {
      display: grid;
      place-items: center;
      min-height: 190px;
      padding: 24px;
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    .policy-dialog {
      width: min(calc(100vw - 32px), 343px);
      max-height: min(72vh, 560px);
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      color: var(--text-primary);
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.24);
    }

    .policy-dialog::backdrop {
      background: rgba(17, 24, 39, 0.46);
      backdrop-filter: blur(3px);
    }

    .policy-dialog__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .policy-dialog__head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
    }

    .policy-dialog__close {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--page);
      color: var(--text-regular);
      font-size: 20px;
      line-height: 1;
    }

    .policy-dialog__body {
      max-height: calc(min(72vh, 560px) - 60px);
      padding: 14px 16px 20px;
      overflow-y: auto;
    }

    .policy-dialog__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .policy-dialog__tag {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: #fff1e8;
      color: var(--brand);
      font-size: 10px;
      font-weight: 700;
    }

    .policy-dialog__body p {
      margin: 0;
      color: var(--text-regular);
      font-size: 13px;
      line-height: 1.75;
    }

    @media (max-width: 340px) {
      .policy-card-grid,
      .policy-district-group__cards {
        grid-template-columns: 1fr;
      }

      .policy-card {
        min-height: 168px;
      }
    }

    /* 补贴专区：参考政策专题页的纵向信息卡布局 */
    .policy-page {
      background:
        radial-gradient(circle at 86% 4%, rgba(255, 191, 91, 0.38), transparent 24%),
        linear-gradient(180deg, #ee4b2e 0%, #df3824 100%);
    }

    .policy-content {
      padding: 14px 12px calc(34px + env(safe-area-inset-bottom, 0px));
    }

    .policy-card-grid {
      gap: 20px;
    }

    .policy-district-group__header {
      min-height: 28px;
      margin: 0 2px 8px;
      padding: 0;
      border-left: 0;
    }

    .policy-district-group__header::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff36c, #ffb349);
      box-shadow: 0 0 10px rgba(255, 235, 91, 0.72);
    }

    .policy-district-group__title {
      color: #fff;
      font-size: 16px;
      letter-spacing: 0.02em;
    }

    .policy-district-group__cards {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .policy-card {
      min-height: 0;
      padding: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 26px rgba(121, 28, 12, 0.18);
    }

    .policy-card__head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 13px 12px 12px;
      border-radius: 12px;
      background: linear-gradient(180deg, #fff8df 0%, #fff0ea 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255, 202, 88, 0.72),
        inset 0 -3px 0 rgba(245, 87, 72, 0.82);
    }

    .policy-card__head-main {
      min-width: 0;
    }

    .policy-card__type {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      margin-bottom: 7px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(238, 75, 46, 0.1);
      color: #d43b26;
      font-size: 10px;
      font-weight: 800;
    }

    .policy-card__title {
      color: #b92f22;
      font-size: 17px;
      line-height: 1.35;
      -webkit-line-clamp: unset;
    }

    .policy-card__district {
      display: none;
    }

    .policy-card__period {
      gap: 4px;
      margin-top: 8px;
      padding-top: 0;
      color: #61646b;
      font-size: 11px;
      white-space: normal;
    }

    .policy-card__period-label {
      color: #50535a;
      font-weight: 700;
    }

    .policy-card__period time {
      color: #3d4047;
      font-weight: 600;
    }

    .policy-card__detail {
      width: auto;
      min-width: 72px;
      min-height: 40px;
      margin-top: 0;
      padding: 0 4px;
      border-radius: 0;
      background: transparent;
      color: #47423f;
      font-size: 12px;
      white-space: nowrap;
    }

    .policy-card__detail:active {
      background: transparent;
      color: var(--brand);
    }

    .policy-card__detail-arrow {
      margin-left: 3px;
      font-size: 20px;
      line-height: 1;
      vertical-align: -2px;
    }

    .policy-card__body {
      margin-top: 10px;
      padding: 13px 12px;
      border-radius: 10px;
      background: #f7f7f7;
    }

    .policy-card__summary {
      margin: 0;
      color: #3d4047;
      font-size: 12px;
      line-height: 1.75;
      text-align: justify;
    }

    @media (max-width: 340px) {
      .policy-card {
        min-height: 0;
      }

      .policy-card__head {
        grid-template-columns: 1fr;
      }

      .policy-card__detail {
        justify-self: end;
        min-height: 28px;
      }
    }

    /* 每个区县合并为一个总卡片，区内政策保留独立入口 */
    .policy-card-grid {
      gap: 16px;
    }

    .policy-district-card {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 14px 30px rgba(112, 26, 14, 0.2);
    }

    .policy-district-card .policy-district-group__header {
      min-height: 42px;
      margin: 0 0 2px;
      padding: 0 13px;
      border-radius: 11px;
      background: linear-gradient(100deg, #f05a35, #e33b28);
    }

    .policy-district-card .policy-district-group__header::before {
      width: 4px;
      height: 17px;
      background: #ffe765;
      box-shadow: 0 0 9px rgba(255, 231, 101, 0.7);
    }

    .policy-district-card .policy-district-group__title {
      color: #fff;
      font-size: 16px;
    }

    .policy-district-card .policy-district-group__cards {
      display: block;
    }

    .policy-district-card .policy-card {
      min-height: 0;
      padding: 12px 2px 0;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .policy-district-card .policy-card + .policy-card {
      margin-top: 12px;
      padding-top: 13px;
      border-top: 1px dashed #ead8ce;
    }

    .policy-district-card .policy-card__head {
      display: block;
      padding: 12px;
      border-radius: 11px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 202, 88, 0.7),
        inset 0 -2px 0 rgba(245, 87, 72, 0.68);
    }

    .policy-district-card .policy-card__type {
      margin-bottom: 6px;
    }

    .policy-district-card .policy-card__title {
      font-size: 16px;
      line-height: 1.4;
    }

    .policy-district-card .policy-card__body {
      margin-top: 8px;
      padding: 11px 12px;
    }

    .policy-district-card .policy-card__summary {
      line-height: 1.7;
    }

    .policy-district-card .policy-card__detail {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 7px;
      padding: 0 10px;
      border-radius: 8px;
      background: #fff3ed;
      color: #df462d;
      font-weight: 800;
    }

    .policy-district-card .policy-card__detail:active {
      background: #ffe5d8;
      color: #c9311d;
    }

    /* 视觉精修：弱化大面积红色，强化区县与政策两级信息层次 */
    .policy-page {
      background:
        radial-gradient(circle at 92% 2%, rgba(255, 181, 124, 0.22), transparent 28%),
        linear-gradient(180deg, #fff5ef 0%, #f5f2ef 36%, #f1f3f5 100%);
    }

    .policy-content {
      padding: 16px 13px calc(36px + env(safe-area-inset-bottom, 0px));
    }

    .policy-card-grid {
      gap: 14px;
    }

    .policy-district-card {
      padding: 9px;
      border: 1px solid rgba(229, 218, 210, 0.86);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 24px rgba(74, 50, 39, 0.08);
    }

    .policy-district-card .policy-district-group__header {
      min-height: 44px;
      margin-bottom: 9px;
      padding: 0 14px;
      border-radius: 12px;
      background: linear-gradient(105deg, #ff7848 0%, #ef4d34 62%, #e63e31 100%);
      box-shadow: 0 7px 16px rgba(224, 67, 43, 0.18);
    }

    .policy-district-card .policy-district-group__header::before {
      width: 3px;
      height: 18px;
      background: #fff1a8;
      box-shadow: 0 0 8px rgba(255, 241, 168, 0.7);
    }

    .policy-district-card .policy-district-group__title {
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    .policy-district-card .policy-district-group__cards {
      display: grid;
      gap: 9px;
    }

    .policy-district-card .policy-card,
    .policy-district-card .policy-card + .policy-card {
      position: relative;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid #efe4dc;
      border-radius: 12px;
      background: #fffaf7;
      box-shadow: 0 4px 12px rgba(75, 47, 34, 0.045);
    }

    .policy-district-card .policy-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 13px;
      bottom: 13px;
      width: 3px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #ffaf62, #f05a3b);
    }

    .policy-district-card .policy-card__head {
      padding: 13px 13px 12px 15px;
      border-radius: 0;
      background: linear-gradient(110deg, rgba(255, 251, 246, 0.98), rgba(255, 245, 237, 0.86));
      box-shadow: none;
    }

    .policy-district-card .policy-card__title {
      color: #2f3034;
      font-size: 15px;
      line-height: 1.42;
      font-weight: 800;
    }

    .policy-district-card .policy-card__period {
      width: fit-content;
      min-height: 24px;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 6px;
      background: rgba(239, 77, 52, 0.06);
      color: #74767b;
      font-size: 10.5px;
      line-height: 1.35;
    }

    .policy-district-card .policy-card__period-label {
      color: #d95036;
      font-weight: 800;
    }

    .policy-district-card .policy-card__period time {
      color: #53565c;
      font-weight: 700;
    }

    /* 参考区县政策矩阵：标题分隔线 + 2~3 列彩色政策卡 */
    .policy-page {
      background:
        radial-gradient(circle at 50% 0%, rgba(105, 212, 245, 0.17), transparent 30%),
        linear-gradient(180deg, #eef8ff 0%, #f8fbfd 42%, #eef3f7 100%);
    }

    .policy-content {
      padding: 20px 12px calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .policy-card-grid {
      gap: 30px;
    }

    .policy-district-card {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .policy-district-card .policy-district-group__header {
      min-height: 35px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 5px 13px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .policy-district-card .policy-district-group__header::before,
    .policy-district-card .policy-district-group__header::after {
      content: "";
      flex: 1 1 auto;
      width: auto;
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 161, 65, 0.25), #f6a143);
      box-shadow: none;
    }

    .policy-district-card .policy-district-group__header::after {
      background: linear-gradient(90deg, #f6a143, rgba(255, 161, 65, 0.25));
    }

    .policy-district-card .policy-district-group__title {
      position: relative;
      flex: 0 0 auto;
      min-width: 82px;
      padding: 5px 12px;
      border-radius: 5px;
      background: rgba(226, 239, 248, 0.92);
      color: #363d46;
      font-size: 15px;
      line-height: 1;
      text-align: center;
      box-shadow: 0 3px 9px rgba(67, 92, 113, 0.08);
    }

    .policy-district-card .policy-district-group__title::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 8px;
      height: 8px;
      border-right: 2px solid #f3a24b;
      border-bottom: 2px solid #f3a24b;
      background: #eef8ff;
      transform: translateX(-50%) rotate(45deg);
    }

    .policy-district-card .policy-district-group__cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .policy-district-card .policy-card,
    .policy-district-card .policy-card + .policy-card {
      min-height: 154px;
      overflow: hidden;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(145deg, #40bdd7, #5599d9);
      box-shadow: 0 8px 18px rgba(55, 117, 161, 0.16);
    }

    .policy-district-card .policy-card:nth-child(3n + 2) {
      background: linear-gradient(145deg, #6689ed, #6575d6);
      box-shadow: 0 8px 18px rgba(79, 91, 187, 0.17);
    }

    .policy-district-card .policy-card:nth-child(3n) {
      background: linear-gradient(145deg, #a360cf, #7955b6);
      box-shadow: 0 8px 18px rgba(104, 71, 162, 0.18);
    }

    .policy-district-card .policy-card::before {
      display: none;
    }

    .policy-district-card .policy-card__head {
      height: 100%;
      padding: 15px 10px 11px;
      background: transparent;
    }

    .policy-district-card .policy-card__head-main {
      min-height: 128px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .policy-district-card .policy-card__title {
      color: #fff;
      font-size: 12px;
      line-height: 1.48;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px 2px rgba(37, 65, 100, 0.16);
    }

    .policy-district-card .policy-card__period {
      width: 100%;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      margin-top: auto;
      padding: 8px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-size: 8.5px;
      line-height: 1.35;
      text-align: center;
    }

    .policy-district-card .policy-card__period-label {
      display: none;
    }

    .policy-district-card .policy-card__period time {
      color: #fff;
      font-size: 8.5px;
      font-weight: 700;
    }

    /* 橙色主题与单行日期优化 */
    .policy-page {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 182, 102, 0.2), transparent 32%),

      .policy-district-card,
      .policy-district-group__header,
      .policy-district-group__chevron::before {
        transition: none !important;
      }

      .policy-district-group__cards {
        animation: none !important;
      }
    }

    /* 区县入口下方的最新政策列表 */
    .latest-policy-section {
      margin-top: 28px;
    }

    .latest-policy-section__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 11px;
    }

    .latest-policy-section__title {
      position: relative;
      margin: 0;
      padding-left: 11px;
      color: #2f3034;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 800;
    }

    .latest-policy-section__title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      bottom: 2px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff8a42, #fd5d00);
    }

    .latest-policy-list {
      display: grid;
      gap: 9px;
    }

    .latest-policy-item {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 26px;
      gap: 10px;
      align-items: center;
      padding: 13px 12px 12px 14px;
      overflow: hidden;
      border: 1px solid #ebe3dd;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 16px rgba(67, 50, 40, 0.06);
      text-align: left;
      transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .latest-policy-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      width: 3px;
      height: 30px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #ff9a54, #fd5d00);
    }

    .latest-policy-item:active {
      border-color: #ffc6a4;
      box-shadow: 0 4px 11px rgba(161, 73, 28, 0.09);
      transform: scale(0.985);
    }

    .latest-policy-item__main {
      min-width: 0;
    }

    .latest-policy-item__title {
      margin: 0;
      display: -webkit-box;
      overflow: hidden;
      color: #303133;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 800;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .latest-policy-item__date {
      display: block;
      margin-top: 7px;
      color: #909399;
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
    }

    .latest-policy-item__arrow {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff1e8;
      color: #e45f29;
    }

    .latest-policy-item__arrow svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      .latest-policy-item {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="policy-page">
    <header class="policy-topbar">
      <button class="policy-back" id="policyBack" type="button" aria-label="返回首页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <h1 class="policy-topbar__title">购房政策</h1>
      <div class="policy-actions" aria-label="页面操作">
        <button class="policy-actions__button" type="button" aria-label="更多操作">
          <span class="policy-actions__more" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button class="policy-actions__button" type="button" aria-label="关闭页面">
          <span class="policy-actions__target" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="policy-content">
      <section class="policy-card-grid" id="policyCards" aria-label="按区县归类的购房政策" aria-live="polite"></section>
      <section class="latest-policy-section" aria-labelledby="latestPolicyTitle">
        <div class="latest-policy-section__head">
          <h2 class="latest-policy-section__title" id="latestPolicyTitle">最新政策</h2>
        </div>
        <div class="latest-policy-list" id="latestPolicyList"></div>
      </section>
    </div>
  </main>

  <dialog class="policy-dialog" id="policyDialog">
    <div class="policy-dialog__head">
      <h2 id="policyDialogTitle"></h2>
      <button class="policy-dialog__close" id="policyDialogClose" type="button" aria-label="关闭详情">×</button>
    </div>
    <div class="policy-dialog__body">
      <div class="policy-dialog__meta">
        <span class="policy-dialog__tag" id="policyDialogDistrict"></span>
        <span class="policy-dialog__tag" id="policyDialogType"></span>
        <span class="policy-dialog__tag" id="policyDialogDate"></span>
      </div>
      <p id="policyDialogSummary"></p>
    </div>
  </dialog>

  <script>
    const districtOrder = [
      "四川天府新区",
      "成都东部新区",
      "成都高新区",
      "锦江区",
      "青羊区",
      "金牛区",
      "武侯区",
      "成华区",
      "龙泉驿区",
      "青白江区",
      "新都区",
      "温江区",
      "双流区",
      "郫都区",
      "新津区",
      "简阳市",
      "都江堰市",
      "彭州市",
      "邛崃市",
      "崇州市",
      "金堂县",
      "大邑县",
      "蒲江县"
    ];

    const basePolicies = [
      {
        id: "east-talent",
        title: "东部新区人才购房补贴最高100万元",
        district: "成都东部新区",
        type: "人才安居",
        start: "2026.01.08",
        end: "2029.01.08",
        summary: "面向符合条件的人才提供分层分类购房支持。具体申报范围、资格条件、补贴标准及办理材料，以主管部门正式发布的政策文件和申报通知为准。"
      },
      {
        id: "qingyang-market",
        title: "青羊房地产市场健康发展的若干措施",
        district: "青羊区",
        type: "市场支持",
        start: "2026.06.18",
        end: "2027.03.01",
        summary: "围绕住房消费、人才安居和房地产市场平稳健康发展制定支持措施。政策适用对象、办理流程及执行口径以正式文件为准。"
      },
      {
        id: "longquanyi-subsidy",
        title: "龙泉驿区购房补贴措施",
        district: "龙泉驿区",
        type: "购房补贴",
        start: "2026.02.13",
        end: "2026.12.31",
        summary: "对政策有效期内符合条件的购房人给予相应支持。补贴对象、房源范围、申请时限和审核方式以龙泉驿区相关部门公布内容为准。"
      },
      {
        id: "qingbaijiang-coupon",
        title: "关于2026年青白江区发放购房“消费券”",
        district: "青白江区",
        type: "购房补贴",
        start: "2026.01.01",
        end: "2026.12.31",
        summary: "通过购房消费券形式支持合理住房需求。适用房源、领取资格、核销规则及资金安排以青白江区正式活动通知为准。"
      },
      {
        id: "jianyang-ticket",
        title: "简阳市房票购房支持政策",
        district: "简阳市",
        type: "房票安置",
        start: "2026.03.31",
        end: "2028.03.30",
        summary: "针对符合条件的房票使用人提供购房支持。房票适用范围、使用期限、抵扣方式和办理流程以简阳市正式政策文件为准。"
      },
      {
        id: "pengzhou-subsidy",
        title: "彭州市购房补贴措施",
        district: "彭州市",
        type: "购房补贴",
        start: "2026.01.04",
        end: "2027.01.03",
        summary: "对符合条件的住房消费给予购房补贴。申请对象、补贴金额、申报材料及兑付流程以彭州市主管部门公布的实施细则为准。"
      }
    ];

    const policyTemplates = [
      {
        key: "subsidy-guide",
        title: "购房补贴申领实施细则",
        type: "购房补贴",
        start: "2026.01.01",
        end: "2026.12.31",
        summary: "面向符合条件的购房人提供住房消费支持。适用对象、补贴标准、申请材料和兑付流程以属地区县主管部门正式发布内容为准。"
      },
      {
        key: "talent-support",
        title: "人才安居购房支持办法",
        type: "人才安居",
        start: "2026.03.01",
        end: "2027.02.28",
        summary: "面向符合条件的人才提供购房支持。人才认定、房源范围、支持标准和办理方式以属地区县主管部门正式发布内容为准。"
      },
      {
        key: "market-measures",
        title: "促进住房消费若干措施",
        type: "市场支持",
        start: "2026.05.01",
        end: "2027.04.30",
        summary: "围绕合理住房需求和房地产市场平稳健康发展提供支持。适用条件、执行期限和办理口径以属地区县正式政策文件为准。"
      }
    ];

    const threePolicyDistricts = new Set(["四川天府新区"]);

    const policies = districtOrder.flatMap((district, districtIndex) => {
      const existingPolicies = basePolicies.filter((policy) => policy.district === district);
      const existingTypes = new Set(existingPolicies.map((policy) => policy.type));
      const targetPolicyCount = threePolicyDistricts.has(district) ? 3 : 2;
      const rotatedTemplates = policyTemplates
        .slice(districtIndex % policyTemplates.length)
        .concat(policyTemplates.slice(0, districtIndex % policyTemplates.length));
      const preferredTemplates = rotatedTemplates
        .filter((template) => !existingTypes.has(template.type))
        .concat(rotatedTemplates.filter((template) => existingTypes.has(template.type)));
      const additions = preferredTemplates
        .slice(0, Math.max(0, targetPolicyCount - existingPolicies.length))
        .map((template, templateIndex) => ({
          id: `district-${districtIndex}-${template.key}-${templateIndex}`,
          title: `${district}${template.title}`,
          district,
          type: template.type,
          start: template.start,
          end: template.end,
          summary: template.summary
        }));

      return [...existingPolicies, ...additions];
    });

    const policyCards = document.getElementById("policyCards");
    const latestPolicyList = document.getElementById("latestPolicyList");
    const policyBack = document.getElementById("policyBack");
    const policyDialog = document.getElementById("policyDialog");
    const policyDialogClose = document.getElementById("policyDialogClose");
    const policyDialogTitle = document.getElementById("policyDialogTitle");
    const policyDialogDistrict = document.getElementById("policyDialogDistrict");
    const policyDialogType = document.getElementById("policyDialogType");
    const policyDialogDate = document.getElementById("policyDialogDate");
    const policyDialogSummary = document.getElementById("policyDialogSummary");

    const districtCoverMap = {
      "四川天府新区": "./assets/区县-四川天府新区.jpg",
      "成都东部新区": "./assets/区县-成都东部新区.jpg",
      "成都高新区": "./assets/区县-成都高新区.jpg",
      "锦江区": "./assets/区县-锦江区.jpg",
      "青羊区": "./assets/区县-青羊区.jpg",
      "金牛区": "./assets/区县-金牛区.jpg",
      "武侯区": "./assets/区县-武侯区.jpg",
      "成华区": "./assets/区县-成华区.jpg",
      "龙泉驿区": "./assets/区县-龙泉驿区.jpg",
      "青白江区": "./assets/区县-青白江区.jpg",
      "新都区": "./assets/区县-新都区.jpg",
      "温江区": "./assets/区县-温江区.jpg",
      "双流区": "./assets/区县-双流区.jpg",
      "郫都区": "./assets/区县-郫都区.jpg",
      "新津区": "./assets/区县-新津区.jpg",
      "简阳市": "./assets/区县-简阳市.jpg",
      "都江堰市": "./assets/区县-都江堰市.jpg",
      "彭州市": "./assets/区县-彭州市.jpg",
      "邛崃市": "./assets/区县-邛崃市.jpg",
      "崇州市": "./assets/区县-崇州市.jpg",
      "金堂县": "./assets/区县-金堂县.jpg",
      "大邑县": "./assets/区县-大邑县.jpg",
      "蒲江县": "./assets/区县-蒲江县.jpg"
    };

    function getDistrictCover(district) {
      return districtCoverMap[district] || "./assets/chengdu-home-cover.svg";
    }

    function compactPolicyPeriod(start, end) {
      const startParts = start.split(".");
      const endParts = end.split(".");
      if (startParts[0] === endParts[0]) {
        return {
          start,
          end: `${endParts[1]}.${endParts[2]}`
        };
      }
      return {
        start: `${startParts[0].slice(-2)}.${startParts[1]}.${startParts[2]}`,
        end: `${endParts[0].slice(-2)}.${endParts[1]}.${endParts[2]}`
      };
    }

    function getPolicySubsidyTags(policy) {
      if (policy.title.includes("人才") || policy.type === "人才安居") {
        return ["人才购房支持", "就学支持"];
      }
      if (policy.title.includes("房票") || policy.type === "房票安置") {
        return ["房票购房支持", "房票安置支持"];
      }
      if (policy.title.includes("消费券")) {
        return ["购房消费券支持", "购房补贴支持"];
      }
      if (policy.type === "市场支持" || policy.title.includes("住房消费")) {
        return ["以旧换新支持", "交通优惠支持"];
      }
      if (policy.title.includes("申领实施细则")) {
        return ["购房补贴支持", "公房承租人购买新建商品住房补贴支持"];
      }
      if (policy.type === "购房补贴") {
        return ["购房补贴支持", "车位购买支持"];
      }
      return ["购房补贴支持", "交通优惠支持"];
    }

    function policyCardMarkup(policy) {
      const compactPeriod = compactPolicyPeriod(policy.start, policy.end);
      const subsidyTags = getPolicySubsidyTags(policy);
      return `
        <article class="policy-card">
          <div class="policy-card__head">
            <div class="policy-card__head-main">
              <h3 class="policy-card__title">${policy.title}</h3>
              <span class="policy-card__tags" aria-label="政策标签：${subsidyTags.join("、")}">
                ${subsidyTags.map((tag) => `<span class="policy-card__tag">${tag}</span>`).join("")}
              </span>
              <span class="policy-card__district">${policy.district}</span>
              <div class="policy-card__period" aria-label="政策时间：${policy.start}至${policy.end}">
                <span class="policy-card__period-label">政策时间：</span>
                <time datetime="${policy.start.replaceAll(".", "-")}">${compactPeriod.start}</time>
                <span aria-hidden="true">—</span>
                <time datetime="${policy.end.replaceAll(".", "-")}">${compactPeriod.end}</time>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderPolicyCards() {
      if (!policies.length) {
        policyCards.innerHTML = '<div class="policy-empty">暂无已收录政策</div>';
        return;
      }

      const knownDistricts = new Set(districtOrder);
      const extraDistricts = [...new Set(policies.map((policy) => policy.district))]
        .filter((district) => !knownDistricts.has(district))
        .sort((a, b) => a.localeCompare(b, "zh-CN"));
      const visibleDistricts = [...districtOrder, ...extraDistricts]
        .filter((district) => policies.some((policy) => policy.district === district));

      policyCards.innerHTML = visibleDistricts.map((district, index) => {
        const districtPolicies = policies.filter((policy) => policy.district === district);
        return `
          <section class="policy-district-group" aria-labelledby="policyDistrict${index}">
            <article class="policy-district-card">
              <button
                class="policy-district-group__header"
                type="button"
                data-district-toggle
                aria-expanded="false"
                aria-controls="policyDistrictPanel${index}"
                style="--district-cover: url('${getDistrictCover(district)}')"
              >
                <span class="policy-district-group__title" id="policyDistrict${index}">${district}</span>
                <span class="policy-district-group__meta" aria-hidden="true">
                  <span class="policy-district-group__chevron"></span>
                </span>
              </button>
              <div class="policy-district-group__cards" id="policyDistrictPanel${index}" hidden>
                ${districtPolicies.map(policyCardMarkup).join("")}
              </div>
            </article>
          </section>
        `;
      }).join("");
    }

    function renderLatestPolicies() {
      const latestPolicies = [...policies]
        .sort((a, b) => b.start.localeCompare(a.start))
        .slice(0, 6);

      latestPolicyList.innerHTML = latestPolicies.map((policy) => `
        <button class="latest-policy-item" type="button" data-policy-detail="${policy.id}" aria-label="查看${policy.title}详情">
          <span class="latest-policy-item__main">
            <strong class="latest-policy-item__title">${policy.title}</strong>
            <time class="latest-policy-item__date" datetime="${policy.start.replaceAll(".", "-")}">政策时间：${policy.start}</time>
          </span>
          <span class="latest-policy-item__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
          </span>
        </button>
      `).join("");
    }

    function openPolicyDetail(policyId) {
      const policy = policies.find((item) => item.id === policyId);
      if (!policy) {
        return;
      }
      policyDialogTitle.textContent = policy.title;
      policyDialogDistrict.textContent = policy.district;
      policyDialogType.textContent = policy.type;
      policyDialogDate.textContent = `${policy.start}-${policy.end}`;
      policyDialogSummary.textContent = policy.summary;
      policyDialog.showModal();
    }

    policyCards.addEventListener("click", (event) => {
      const districtToggle = event.target.closest("[data-district-toggle]");
      if (districtToggle) {
        const districtCard = districtToggle.closest(".policy-district-card");
        const districtPanel = document.getElementById(districtToggle.getAttribute("aria-controls"));
        const willOpen = districtToggle.getAttribute("aria-expanded") !== "true";

        policyCards.querySelectorAll("[data-district-toggle]").forEach((toggle) => {
          toggle.setAttribute("aria-expanded", "false");
          toggle.closest(".policy-district-card")?.classList.remove("is-open");
          const panel = document.getElementById(toggle.getAttribute("aria-controls"));
          if (panel) {
            panel.hidden = true;
          }
        });

        if (willOpen && districtPanel) {
          districtToggle.setAttribute("aria-expanded", "true");
          districtCard?.classList.add("is-open");
          districtPanel.hidden = false;
        }
        return;
      }

      const button = event.target.closest("[data-policy-detail]");
      if (button) {
        openPolicyDetail(button.dataset.policyDetail);
      }
    });

    latestPolicyList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-policy-detail]");
      if (button) {
        openPolicyDetail(button.dataset.policyDetail);
      }
    });

    policyDialogClose.addEventListener("click", () => policyDialog.close());
    policyDialog.addEventListener("click", (event) => {
      if (event.target === policyDialog) {
        policyDialog.close();
      }
    });

    policyBack.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./安家成都-首页-扫码.html";
      }
    });

    renderPolicyCards();
    renderLatestPolicies();
  </script>
</body>
</html>
